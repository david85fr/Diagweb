# Diagweb — interopérabilité contre un serveur OPC UA PUBLIC.
#
# Volontairement séparé de ci.yml, et volontairement MANUEL : ce contrôle
# dépend d'un serveur tiers, gratuit et sans engagement de disponibilité. Le
# mettre sur chaque poussée reviendrait à accepter des rouges causés par la
# maintenance de quelqu'un d'autre — et le jour où le rouge serait le nôtre,
# plus personne ne le regarderait. La CI de chaque poussée garde donc ses
# équipements simulés, qui ne dépendent de rien.
#
# Ce qu'il apporte en plus : nos bouchons prouvent que le pilote décode ce que
# NOUS encodons ; une pile écrite par d'autres est le seul juge honnête de
# l'interopérabilité.
name: Interopérabilité (manuelle)

on:
  workflow_dispatch:
    inputs:
      endpoint:
        description: Point de terminaison OPC UA public
        required: true
        default: opc.tcp://uademo.prosysopc.com:53530/OPCUA/SimulationServer

permissions:
  contents: read

jobs:
  opcua:
    name: Client OPC UA contre un serveur public
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Même cache et même recette que ci.yml : un seul endroit à faire
      # évoluer le jour où open62541 change de version.
      - name: Cache d'open62541
        id: cache-o62
        uses: actions/cache@v4
        with:
          path: ~/.local/open62541
          key: open62541-v1.5.6-meson-${{ runner.os }}

      - name: Construire open62541 (si absent du cache)
        if: steps.cache-o62.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v1.5.6 \
            https://github.com/open62541/open62541.git "$RUNNER_TEMP/o62"
          cmake -S "$RUNNER_TEMP/o62" -B "$RUNNER_TEMP/o62/build" \
                -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/.local/open62541" \
                -DUA_NAMESPACE_ZERO=REDUCED -DUA_ENABLE_AMALGAMATION=OFF \
                -DUA_BUILD_EXAMPLES=OFF -DUA_FORCE_WERROR=OFF -DBUILD_SHARED_LIBS=OFF \
                -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build "$RUNNER_TEMP/o62/build" -j
          cmake --install "$RUNNER_TEMP/o62/build"

      - name: Outillage de construction (Meson + Ninja)
        run: |
          sudo apt-get install -y --no-install-recommends meson ninja-build
          echo "PKG_CONFIG_PATH=$HOME/.local/open62541/lib/pkgconfig:$HOME/.local/open62541/lib64/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      # -Dopcua=enabled plutôt que « auto » : tout ce workflow ne sert qu'à
      # éprouver le pilote OPC UA. Si open62541 manquait, « auto » le
      # désactiverait en silence et le test passerait au vert sans rien avoir
      # vérifié — ici, la configuration doit échouer.
      - name: Configurer et compiler (C++23, avertissements = erreurs)
        run: |
          meson setup build -Dopcua=enabled
          meson compile -C build

      - name: Interroger le serveur public
        # Le point de terminaison passe par l'environnement, jamais par
        # interpolation dans la ligne de commande : une entrée de workflow est
        # une chaîne libre, et elle n'a rien à faire dans un shell.
        env:
          ENDPOINT: ${{ inputs.endpoint }}
        run: |
          ./build/diagweb-server --port 8080 --root . \
            --data-dir "$RUNNER_TEMP/diag-data" > "$RUNNER_TEMP/serveur.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/serveur.pid"
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8080/api/health > /dev/null && break
            sleep 0.25
          done
          set +e
          node tests/interop.mjs http://localhost:8080 "$ENDPOINT"
          code=$?
          set -e
          kill "$(cat "$RUNNER_TEMP/serveur.pid")" 2> /dev/null || true
          # 3 = serveur public injoignable : ce n'est pas un défaut de notre
          # code, et un rouge le laisserait croire. Avertissement, pas échec.
          if [ "$code" -eq 3 ]; then
            echo "::warning::Serveur public injoignable ($ENDPOINT) — rien à conclure sur le client Diagweb."
            exit 0
          fi
          exit "$code"

      - name: Journal du serveur
        if: always()
        run: cat "$RUNNER_TEMP/serveur.log" || true

# Diagweb — livrables téléchargeables : la page autonome et les deux paquets
# d'installation.
#
# Workflow séparé de l'intégration continue, et pour une raison précise : la
# construction arm64 tourne sous émulation et prend des dizaines de minutes.
# Dans ci.yml, où les poussées rapprochées annulent l'exécution précédente
# (« cancel-in-progress »), elle n'aurait presque jamais le temps d'aboutir —
# et le cache qu'elle alimente non plus. Ici, les exécutions font la queue au
# lieu de s'annuler.
#
# Déclenchement : à la fin d'une intégration continue RÉUSSIE sur main. On ne
# publie donc jamais un paquet dont les tests ne sont pas passés.
name: Livrables (page autonome et paquets)

on:
  workflow_run:
    workflows: ["Intégration continue"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Pas d'annulation : un paquet à moitié construit n'a aucune valeur, et
# l'émulation arm64 coûte trop cher pour être jetée en route.
concurrency:
  group: paquets
  cancel-in-progress: false

jobs:
  paquets:
    name: Page autonome + paquets .deb (amd64 et arm64)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write        # publication de la release « paquets »
    steps:
      - uses: actions/checkout@v4
        with:
          # Le commit exactement testé par l'intégration continue qui déclenche
          # ce workflow — pas la tête de la branche, qui a pu avancer depuis.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0     # le numéro de version est un compte de commits

      # Les livrables d'une même publication portent LE MÊME numéro. Il est donc
      # figé ici, une fois : le calculer dans chaque construction donnerait deux
      # valeurs, la seconde partant d'un arbre où build.py a réécrit dist/.
      - name: Numéro de version
        run: echo "PKGVER=1.0.$(git rev-list --count HEAD)+g$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      # ---- amd64 : natif, avec les deux dépendances facultatives
      - name: Cache d'open62541 (amd64)
        id: cache-o62
        uses: actions/cache@v4
        with:
          path: ~/.local/open62541
          key: open62541-v1.5.6-meson-${{ runner.os }}

      - name: Construire open62541 (si absent du cache)
        if: steps.cache-o62.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v1.5.6 \
            https://github.com/open62541/open62541.git "$RUNNER_TEMP/o62"
          cmake -S "$RUNNER_TEMP/o62" -B "$RUNNER_TEMP/o62/build" \
                -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/.local/open62541" \
                -DUA_NAMESPACE_ZERO=REDUCED -DUA_ENABLE_AMALGAMATION=OFF \
                -DUA_BUILD_EXAMPLES=OFF -DUA_FORCE_WERROR=OFF -DBUILD_SHARED_LIBS=OFF \
                -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build "$RUNNER_TEMP/o62/build" -j "$(nproc)"
          cmake --install "$RUNNER_TEMP/o62/build"

      - name: Outillage et dépendances (amd64)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config dpkg-dev libsnmp-dev
          echo "PKG_CONFIG_PATH=$HOME/.local/open62541/lib/pkgconfig:$HOME/.local/open62541/lib64/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      - name: Paquet amd64 (Ubuntu)
        run: bash tools/package-deb.sh --version "$PKGVER"

      # ---- arm64 : dans un conteneur Debian 13, le système des Raspberry Pi
      # récents, émulé par QEMU. Lent mais fidèle : mêmes bibliothèques, même
      # éditeur de liens, même architecture que la machine cible.
      - name: Émulation arm64 (QEMU)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # Restauration et sauvegarde séparées : avec un cache ordinaire, une
      # construction ratée d'open62541 (réseau, mémoire sous émulation) serait
      # enregistrée telle quelle et TOUTES les exécutions suivantes
      # repartiraient de cet échec — le paquet arm64 sortirait sans OPC UA,
      # indéfiniment et sans que rien ne le dise.
      - name: Cache d'open62541 (arm64) — restauration
        uses: actions/cache/restore@v4
        with:
          path: .o62-arm64
          key: open62541-v1.5.6-arm64-trixie

      - name: Paquet arm64 (Raspberry Pi OS)
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD":/src -w /src -e PKGVER \
            debian:trixie bash packaging/build-arm64.sh

      # Tout ce que le conteneur a écrit appartient à root : dist/ (build.py a
      # réécrit les pages), build-paquet/ et le cache. On rend le tout à
      # l'utilisateur du runner, sans quoi un runner auto-hébergé échouerait au
      # nettoyage de l'exécution suivante. `always()` : même si la construction
      # a échoué, il ne faut pas laisser l'arbre en root.
      - name: Rendre les fichiers à l'utilisateur du runner
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" dist build-paquet .o62-arm64 2>/dev/null || true

      - name: Cache d'open62541 (arm64) — sauvegarde si la construction a abouti
        if: hashFiles('.o62-arm64/lib/pkgconfig/open62541.pc', '.o62-arm64/lib64/pkgconfig/open62541.pc') != ''
        uses: actions/cache/save@v4
        with:
          path: .o62-arm64
          key: open62541-v1.5.6-arm64-trixie

      # ---- la page autonome, troisième livrable
      - name: Page autonome (simulation navigateur)
        run: |
          python3 tools/build.py
          cp dist/index.html "dist/packages/diagweb_${PKGVER}_page-autonome.html"

      - name: Vérifier les trois livrables
        run: |
          ls -l dist/packages
          for p in dist/packages/*.deb; do
            echo "== $p"
            dpkg-deb --info "$p" | sed -n '1,25p'
            dpkg-deb --contents "$p" | grep -E 'usr/bin/diagweb-server|diagweb.service' || {
              echo "::error::paquet incomplet : $p"; exit 1; }
          done
          test "$(ls dist/packages/*_amd64.deb 2> /dev/null | wc -l)" -eq 1 || {
            echo "::error::paquet amd64 manquant"; exit 1; }
          test "$(ls dist/packages/*_arm64.deb 2> /dev/null | wc -l)" -eq 1 || {
            echo "::error::paquet arm64 manquant"; exit 1; }
          # Les deux paquets doivent porter le même numéro : sinon le tableau de
          # la release annoncerait un fichier qui n'existe pas.
          test "$(ls dist/packages/*.deb | sed 's/_[a-z0-9]*\.deb$//' | sort -u | wc -l)" -eq 1 || {
            echo "::error::les deux paquets n'ont pas la même version"; exit 1; }
          # La page doit être autonome : aucune ressource externe, sans quoi elle
          # ne s'ouvrirait pas hors ligne.
          python3 tools/check-dist.py
          # Pilote OPC UA : un avertissement, pas une erreur — un paquet sans
          # OPC UA reste installable et utile, mais cela doit se voir. Le
          # résumé de l'exécution le porte aussi : c'est là qu'on regarde.
          {
            echo "### Livrables — $PKGVER"
            echo ""
            echo "| Fichier | Taille | OPC UA | SNMP v3 |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for p in dist/packages/*.deb; do
            info=$(dpkg-deb --info "$p")
            opcua=non; snmp=non
            echo "$info" | grep -q 'OPC UA oui' && opcua=oui
            echo "$info" | grep -q 'SNMP v3 oui' && snmp=oui
            printf '| `%s` | %s | %s | %s |\n' "$(basename "$p")" \
              "$(du -h "$p" | cut -f1)" "$opcua" "$snmp" >> "$GITHUB_STEP_SUMMARY"
            [ "$opcua" = oui ] ||
              echo "::warning::$(basename "$p") est construit sans le pilote OPC UA"
          done
          h=$(ls dist/packages/*_page-autonome.html)
          printf '| `%s` | %s | — | — |\n' "$(basename "$h")" "$(du -h "$h" | cut -f1)" \
            >> "$GITHUB_STEP_SUMMARY"

      # Trois dépôts séparés : on télécharge celui dont on a besoin, sans tirer
      # les autres. Ils restent disponibles même quand la release est refaite.
      - name: Livrable — page autonome
        uses: actions/upload-artifact@v4
        with:
          name: page-autonome-html
          path: dist/packages/*_page-autonome.html
          retention-days: 90

      - name: Livrable — paquet Ubuntu (amd64)
        uses: actions/upload-artifact@v4
        with:
          name: paquet-ubuntu-amd64
          path: dist/packages/*_amd64.deb
          retention-days: 90

      - name: Livrable — paquet Raspberry Pi OS (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: paquet-raspberry-arm64
          path: dist/packages/*_arm64.deb
          retention-days: 90

      # Release « paquets » : toujours le dernier main, jamais un empilement.
      # Elle est refaite à chaque fois pour que ses fichiers soient exactement
      # ceux qu'on vient de construire.
      - name: Publier la release « paquets »
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          # Le tag est posé ici, sur le commit qui a produit ces livrables. Le
          # laisser créer par « gh release create » le placerait sur la tête de
          # la branche au moment de l'appel — pas forcément le même commit,
          # l'étape arm64 durant une heure.
          git tag -f paquets "$SHA"
          git push -f origin refs/tags/paquets
          gh release delete paquets --yes || true
          gh release create paquets \
            dist/packages/*.deb "dist/packages/diagweb_${PKGVER}_page-autonome.html" \
            --verify-tag \
            --title "Livrables — $PKGVER" \
            --notes "$(printf '%s\n' \
              "Construits par l'intégration continue à partir du dernier \`main\` (${SHA:0:7})." \
              "" \
              "| Fichier | Pour |" \
              "|---|---|" \
              "| \`diagweb_${PKGVER}_amd64.deb\` | PC sous Ubuntu 24.04+ (ou Debian 13+) |" \
              "| \`diagweb_${PKGVER}_arm64.deb\` | Raspberry Pi OS 64 bits (Debian 13 « trixie ») |" \
              "| \`diagweb_${PKGVER}_page-autonome.html\` | à ouvrir dans un navigateur : l'interface en simulation, sans rien installer |" \
              "" \
              "Installation d'un paquet : \`sudo apt install ./diagweb_${PKGVER}_<arch>.deb\`" \
              "" \
              "Depuis un clone du dépôt, sur la machine cible :" \
              "\`sudo bash tools/install.sh\` — voir \`docs/INSTALL.md\`.")"

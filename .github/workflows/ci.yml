# Diagweb — intégration continue.
#
# Tout ce qui est vérifié ici l'est aussi en local par `bash tools/check.sh` :
# ce fichier est la référence, le script en est le miroir.
name: Intégration continue

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Une exécution à la fois par branche : les poussées rapprochées annulent
# la précédente au lieu de faire la queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  serveur:
    name: Serveur de diagnostic (C++23, Meson)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'    # WebSocket natif : les tests n'ont aucune dépendance

      # open62541 (pilote OPC UA) n'est pas empaqueté par la distribution :
      # il est construit une fois puis conservé en cache, et Meson le trouve
      # par pkg-config. La compilation du produit, elle, ne dépend d'aucun
      # accès réseau — c'est ce qui compte pour une cible embarquée.
      - name: Cache d'open62541
        id: cache-o62
        uses: actions/cache@v4
        with:
          path: ~/.local/open62541
          key: open62541-v1.5.6-meson-${{ runner.os }}

      - name: Construire open62541 (si absent du cache)
        if: steps.cache-o62.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v1.5.6 \
            https://github.com/open62541/open62541.git "$RUNNER_TEMP/o62"
          cmake -S "$RUNNER_TEMP/o62" -B "$RUNNER_TEMP/o62/build" \
                -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/.local/open62541" \
                -DUA_NAMESPACE_ZERO=REDUCED -DUA_ENABLE_AMALGAMATION=OFF \
                -DUA_BUILD_EXAMPLES=OFF -DUA_FORCE_WERROR=OFF -DBUILD_SHARED_LIBS=OFF \
                -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build "$RUNNER_TEMP/o62/build" -j
          cmake --install "$RUNNER_TEMP/o62/build"

      - name: Outillage de construction (Meson + Ninja)
        run: |
          sudo apt-get install -y --no-install-recommends meson ninja-build
          echo "PKG_CONFIG_PATH=$HOME/.local/open62541/lib/pkgconfig:$HOME/.local/open62541/lib64/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      # Net-SNMP : la bibliothèque pour compiler le pilote v3 (USM), et l'agent
      # snmpd pour l'éprouver de bout en bout — le modèle de sécurité de SNMPv3
      # ne se simule pas honnêtement.
      #
      # Le test lance snmpd avec sa propre configuration dans un dossier
      # temporaire, ce qu'un profil AppArmor confinant le démon à /etc/snmp
      # empêcherait. Ubuntu 24.04 n'en fournit aucun pour snmpd : aa-disable
      # est donc sans effet ici, et reste par précaution pour une image qui en
      # embarquerait un. Son échec est ignoré, jamais bloquant.
      - name: Installer Net-SNMP (bibliothèque et agent de test)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsnmp-dev snmpd
          sudo systemctl stop snmpd 2> /dev/null || true
          sudo aa-disable /usr/sbin/snmpd 2> /dev/null || true

      - name: Configurer et compiler (C++23, avertissements = erreurs)
        run: |
          meson setup build
          meson compile -C build

      - name: Tests du serveur (décodage, simulateur, liens réseau, forçage, journalisation)
        # Les phrases secrètes de l'agent SNMPv3 de test passent par
        # l'environnement du serveur : le pilote refuse de les lire ailleurs.
        # meson test lance le serveur, joue les vérifications et l'arrête.
        run: meson test -C build --suite serveur --print-errorlogs

      - name: Journaux de test
        if: always()
        run: |
          cat build/meson-logs/testlog.txt || true
          cat /tmp/diagweb-test-server.log || true

  interface:
    name: Interface web (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntaxe des sources JavaScript
        run: |
          for f in web/js/*.js; do node --check "$f" || exit 1; done

      - name: Syntaxe de l'outillage (Python et shell)
        run: |
          python3 -m py_compile tools/*.py
          for f in tools/*.sh .devcontainer/*.sh; do bash -n "$f" || exit 1; done

      - name: En-têtes générés à jour (catalogue et protocoles)
        run: |
          python3 tools/gen-all.py
          git diff --exit-code -- server/src/catalog.generated.hpp \
                                  server/src/protocols.generated.hpp \
            || { echo "::error::Un en-tête généré ne correspond plus à sa source." \
                      " Relancer tools/gen-catalog.mjs et tools/gen-protocols.mjs," \
                      " puis commiter."; exit 1; }

      - name: Un dossier de pilote par protocole
        run: node tools/check-drivers.mjs

      - name: Livrables à jour et page autonome (aucune ressource externe)
        run: python3 tools/check-dist.py

      - name: Installer Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium

      - name: Tests d'interface (mobile + poste de travail)
        run: node tests/ui.mjs

      - name: Tests de déplacement de widgets (origine http requise)
        run: |
          python3 tools/serve.py > "$RUNNER_TEMP/apercu.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/apercu.pid"
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8080/web/index.html > /dev/null && break
            sleep 0.25
          done
          node tests/dnd.mjs
          kill "$(cat "$RUNNER_TEMP/apercu.pid")" 2> /dev/null || true

      - name: Captures d'écran des tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-interface
          path: .test-shots
          if-no-files-found: ignore
          retention-days: 7

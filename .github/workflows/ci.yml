# Diagweb — intégration continue.
#
# Tout ce qui est vérifié ici l'est aussi en local par `bash tools/check.sh` :
# ce fichier est la référence, le script en est le miroir.
name: Intégration continue

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Une exécution à la fois par branche : les poussées rapprochées annulent
# la précédente au lieu de faire la queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  serveur:
    name: Serveur de diagnostic (C++20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'    # WebSocket natif : les tests n'ont aucune dépendance

      # open62541 (pilote OPC UA) est récupéré par FetchContent : la
      # configuration a besoin du réseau, et le cache évite de recompiler la
      # bibliothèque à chaque exécution.
      - name: Cache d'open62541
        uses: actions/cache@v4
        with:
          path: server/build/_deps
          key: open62541-v1.5.6-${{ runner.os }}

      # Net-SNMP : la bibliothèque pour compiler le pilote v3 (USM), et l'agent
      # snmpd pour l'éprouver de bout en bout — le modèle de sécurité de SNMPv3
      # ne se simule pas honnêtement. Le profil AppArmor d'Ubuntu enferme snmpd
      # dans /etc/snmp et /var/lib/snmp, alors que le test le lance avec sa
      # propre configuration dans un dossier temporaire : on le désactive sur
      # cette machine de CI, qui ne sert qu'à cela.
      - name: Installer Net-SNMP (bibliothèque et agent de test)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsnmp-dev snmpd
          sudo systemctl stop snmpd 2> /dev/null || true
          sudo aa-disable /usr/sbin/snmpd 2> /dev/null || true

      - name: Compiler (avertissements = erreurs)
        run: |
          cmake -B server/build -S server -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"
          cmake --build server/build -j --target diagweb-server diagweb-decode-test \
                                            diagweb-opcua-test-server

      - name: Décodage des protocoles (tests unitaires)
        run: ./server/build/diagweb-decode-test

      - name: Liens réseau de bout en bout (équipements simulés)
        # Les phrases secrètes de l'agent SNMPv3 de test passent par
        # l'environnement du serveur : le pilote refuse de les lire ailleurs.
        env:
          DIAGWEB_SECRET_AGENT_AUTH: motdepasseauth
          DIAGWEB_SECRET_AGENT_PRIV: motdepassepriv
        run: |
          ./server/build/diagweb-server --port 8080 --root . \
            --data-dir "$RUNNER_TEMP/diag-data" > "$RUNNER_TEMP/serveur.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/serveur.pid"
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8080/api/health > /dev/null && break
            sleep 0.25
          done
          curl -sf http://localhost:8080/api/health > /dev/null \
            || { echo "le serveur n'a pas démarré :"; cat "$RUNNER_TEMP/serveur.log"; exit 1; }
          node tests/protocols.mjs http://localhost:8080

      - name: Forçage et journalisation autonome (serveur d'acquisition)
        run: node tests/server.mjs http://localhost:8080

      - name: Journal du serveur
        if: always()
        run: cat "$RUNNER_TEMP/serveur.log" || true

      - name: Arrêter le serveur
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/serveur.pid")" 2> /dev/null || true

  interface:
    name: Interface web (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntaxe des sources JavaScript
        run: |
          for f in web/js/*.js; do node --check "$f" || exit 1; done

      - name: Syntaxe de l'outillage (Python et shell)
        run: |
          python3 -m py_compile tools/*.py
          for f in tools/*.sh; do bash -n "$f" || exit 1; done

      - name: En-têtes générés à jour (catalogue et protocoles)
        run: |
          node tools/gen-catalog.mjs
          node tools/gen-protocols.mjs
          git diff --exit-code -- server/src/catalog.generated.hpp \
                                  server/src/protocols.generated.hpp \
            || { echo "::error::Un en-tête généré ne correspond plus à sa source." \
                      " Relancer tools/gen-catalog.mjs et tools/gen-protocols.mjs," \
                      " puis commiter."; exit 1; }

      - name: Un dossier de pilote par protocole
        run: node tools/check-drivers.mjs

      - name: Livrables à jour et page autonome (aucune ressource externe)
        run: python3 tools/check-dist.py

      - name: Installer Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium

      - name: Tests d'interface (mobile + poste de travail)
        run: node tests/ui.mjs

      - name: Tests de déplacement de widgets (origine http requise)
        run: |
          python3 tools/serve.py > "$RUNNER_TEMP/apercu.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/apercu.pid"
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8080/web/index.html > /dev/null && break
            sleep 0.25
          done
          node tests/dnd.mjs
          kill "$(cat "$RUNNER_TEMP/apercu.pid")" 2> /dev/null || true

      - name: Captures d'écran des tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-interface
          path: .test-shots
          if-no-files-found: ignore
          retention-days: 7

    if (o.origin === winId && dragging && !place &&
        api.isSameTarget(targetTab, dragging.payload)) {
      dragging = null;
      return;
    }

    // 'reordered' : la cible a simplement rangé le widget déjà présent —
    // la source ne doit surtout pas le retirer.
    const ok = api.receive(o, targetTab, place, o.origin === winId);
    if (ok === 'reordered') {
      const p = pending.get(o.dragId);
      if (p) { clearTimeout(p.timer); pending.delete(o.dragId); }
      dragging = null;
      return;
    }
    if (!ok) return;

    if (o.origin === winId) {
      dragging = null;
      // Ctrl / ⌘ : on garde l'original. Sans modificateur, c'est un
      // déplacement — la source retire son widget maintenant que la cible a
      // accusé réception.
      if (copie(e)) {
        const p = pending.get(o.dragId);
        if (p) { clearTimeout(p.timer); pending.delete(o.dragId); }
        api.toast('Copié (Ctrl enfoncé) — l’original reste en place.');
      } else {
        completeMove(o.dragId);
      }
    } else if (bc) {
      bc.postMessage({ type: 'widget-accepted', dragId: o.dragId });
    } else {
      api.toast('Copié depuis une autre fenêtre (déplacement impossible ici).');
    }
  }

  // ---------------------------------------- ouverture dans une autre fenêtre
  function openInNewWindow(payload, onMoved) {
    const id = DW.store && DW.store.putTransfer(payload);
    if (!id) { api && api.toast('Stockage indisponible : transfert impossible.', 'err'); return; }
    const url = location.pathname + '?open=' + encodeURIComponent(id);
    const w = window.open(url, '_blank');
    if (!w) {
      DW.store.takeTransfer(id);
      api && api.toast('Fenêtre bloquée par le navigateur — autorisez les fenêtres surgissantes.', 'err');
      return;
    }
    if (onMoved) onMoved();
  }

  /** Au démarrage : récupère le widget transféré par ?open=<id>. */
  function consumeOpenParam() {
    let id = null;
    try { id = new URLSearchParams(location.search).get('open'); } catch (e) { return null; }
    if (!id) return null;
    const payload = DW.store && DW.store.takeTransfer(id);
    // L'adresse est nettoyée pour qu'un rechargement ne rejoue pas le transfert
    try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) { /* ignoré */ }
    return payload || null;
  }

  DW.dnd = {
    winId,
    startDrag,
    endDrag,
    shareRename,
    shareAppearance,
    shareLang,
    openInNewWindow,
    consumeOpenParam,
    describe,
    /** app.js fournit ici l'accès à l'espace de travail. */
    attach(a) {
      api = a;
      document.addEventListener('dragover', onDragOver);
      document.addEventListener('drop', onDrop);
      document.addEventListener('dragend', endDrag);
      document.addEventListener('dragleave', (e) => {
        if (e.relatedTarget === null) clearHighlight();
      });
    },
  };
})();

</script>
<script>
/* Diagweb — apparence : logo de l'exploitant et couleurs de l'interface.
 *
 * Deux réglages, un même principe : ils appartiennent à l'INSTALLATION, pas au
 * poste qui les saisit. Servis par le contrôleur, ils sont donc enregistrés
 * côté serveur (`<data-dir>/appearance.json`) et tous les postes connectés les
 * voient. Page ouverte hors serveur (copie hors ligne, Artifact), ils restent
 * dans le navigateur : jamais de réglage perdu, jamais d'appel réseau inutile.
 *
 * AUCUNE RESSOURCE EXTERNE. Le logo n'est pas une URL mais une image
 * INCORPORÉE (data:), pour deux raisons : la page doit se servir hors ligne
 * depuis le contrôleur, et la page publiée l'est sous une CSP stricte qui
 * refuse tout hôte tiers. Une image matricielle est réduite à la volée avant
 * d'être stockée — un logo de 4 Mo dans une configuration partagée n'a aucun
 * sens.
 *
 * Le logo est rendu dans une balise <img>, jamais injecté comme balisage. Un
 * SVG y est traité en image : ses scripts éventuels ne s'exécutent pas. C'est
 * la seule façon d'accepter un fichier fourni par l'exploitant sans lui donner
 * les clés de la page.
 */
(function () {
  "use strict";
  const DW = (window.DW = window.DW || {});

  const CLE = 'diagweb.appearance';
  const MAX_LOGO = 384 * 1024;      // octets du data: final
  const LOGO_H = 128;               // hauteur de réduction (affiché ~28 px)
  const LOGO_W = 512;

  /**
   * Jetons de couleur proposés. Volontairement peu nombreux : tout le reste
   * s'en déduit (voir `derives`). Six réglages tiennent dans une fenêtre et
   * donnent une palette cohérente ; vingt donneraient surtout l'occasion de
   * fabriquer une interface illisible.
   */
  const TOKENS = [
    { key: 'accent', css: '--accent', label: 'Accent',
      help: 'Couleur des boutons actifs, des sélections et des repères. Les nuances associées en sont déduites.' },
    { key: 'bg', css: '--bg', label: 'Fond de page',
      help: 'Fond général, derrière les cartes.' },
    { key: 'panel', css: '--panel', label: 'Cartes',
      help: 'Fond des cartes : tableau, graphiques, fenêtres.' },
    { key: 'panel2', css: '--panel-2', label: 'Fond secondaire',
      help: 'Fond des champs, des lignes paires du tableau et des zones en retrait.' },
    { key: 'ink', css: '--ink', label: 'Texte',
      help: 'Couleur du texte principal. Les gris atténués en sont déduits.' },
    { key: 'line', css: '--line', label: 'Traits',
      help: 'Bordures des cartes, séparateurs et grille des graphiques.' },
  ];

  const vide = () => ({ version: 1, logo: '', colors: { dark: {}, light: {} } });
  let etat = vide();
  let svgOrigine = null;            // logo par défaut, capturé au démarrage

  const theme = () => (DW.isDarkTheme && DW.isDarkTheme() ? 'dark' : 'light');
  const couleurs = () => etat.colors[theme()] || {};

  /** Le serveur de diagnostic sert-il cette page ? */
  const surServeur = () => DW.sourceMode === 'ws';

  // ------------------------------------------------------------ application
  /**
   * Nuances déduites des jetons réglés, pour que la palette reste cohérente
   * sans multiplier les réglages :
   *   --accent-dim  l'autre extrémité des dégradés d'accent ;
   *   --muted/faint le texte atténué, obtenu en fondant le texte dans le fond.
   */
  function derives(root, c) {
    if (c.accent) {
      root.style.setProperty('--accent-dim', theme() === 'dark'
        ? 'color-mix(in srgb, ' + c.accent + ' 62%, #000)'
        : 'color-mix(in srgb, ' + c.accent + ' 82%, #fff)');
    } else {
      root.style.removeProperty('--accent-dim');
    }
    if (c.ink) {
      root.style.setProperty('--muted', 'color-mix(in srgb, ' + c.ink + ' 62%, var(--bg))');
      root.style.setProperty('--faint', 'color-mix(in srgb, ' + c.ink + ' 42%, var(--bg))');
    } else {
      root.style.removeProperty('--muted');
      root.style.removeProperty('--faint');
    }
  }

  /** Applique les couleurs du thème courant, ou les retire si aucune. */
  function appliquerCouleurs() {
    const root = document.documentElement;
    const c = couleurs();
    for (const t of TOKENS) {
      if (c[t.key]) root.style.setProperty(t.css, c[t.key]);
      else root.style.removeProperty(t.css);
    }
    derives(root, c);
    // Les graphiques lisent l'encre du thème dans les variables CSS : sans
    // cette invalidation, ils garderaient l'ancienne palette jusqu'au prochain
    // changement de thème.
    if (DW.invalidateChartTheme) DW.invalidateChartTheme();
    document.dispatchEvent(new CustomEvent('dw:appearance'));
  }

  function appliquerLogo() {
    const box = document.querySelector('.logo');
    if (!box) return;
    if (svgOrigine === null) svgOrigine = box.innerHTML;
    box.innerHTML = '';
    if (!etat.logo) {
      box.innerHTML = svgOrigine;
    } else {
      const img = document.createElement('img');
      img.src = etat.logo;                 // data: — jamais une URL distante
      img.alt = 'Logo de l’installation';
      box.appendChild(img);
    }
    // L'icône d'onglet suit le logo : c'est le même repère visuel, et
    // l'opérateur qui ouvre trois postes s'y retrouve.
    let lien = document.querySelector('link[rel="icon"]');
    if (etat.logo) {
      if (!lien) {
        lien = document.createElement('link');
        lien.rel = 'icon';
        document.head.appendChild(lien);
      }
      lien.href = etat.logo;
    } else if (lien && lien.dataset.dw === '1') {
      lien.remove();
    }
    if (lien) lien.dataset.dw = '1';
  }

  function appliquer() { appliquerCouleurs(); appliquerLogo(); }

  // ------------------------------------------------------------ persistance
  function lireLocal() {
    try {
      const brut = window.localStorage.getItem(CLE);
      if (brut) return normaliser(JSON.parse(brut));
    } catch (e) { /* stockage indisponible ou contenu illisible */ }
    return null;
  }

  /** N'accepte que ce qu'on sait rendre : une image incorporée et des couleurs. */
  function normaliser(o) {
    const out = vide();
    if (!o || typeof o !== 'object') return out;
    if (typeof o.logo === 'string' && /^data:image\//.test(o.logo)) out.logo = o.logo;
    for (const t of ['dark', 'light']) {
      const src = (o.colors && o.colors[t]) || {};
      for (const tok of TOKENS) {
        const v = src[tok.key];
        if (typeof v === 'string' && /^#[0-9a-fA-F]{3,8}$/.test(v)) out.colors[t][tok.key] = v;
      }
    }
    return out;
  }

  async function charger() {
    // Le stockage local d'abord : l'apparence s'applique sans attendre le
    // réseau, ce qui évite de voir la page changer de couleur sous les yeux.
    const local = lireLocal();
    if (local) { etat = local; appliquer(); }
    if (!surServeur()) return etat;
    try {
      const r = await fetch('/api/appearance', { cache: 'no-store' });
      if (r.ok) {
        etat = normaliser(await r.json());
        appliquer();
        try { window.localStorage.setItem(CLE, JSON.stringify(etat)); } catch (e) { /* ignoré */ }
      }
    } catch (e) { /* serveur muet : les réglages locaux font foi */ }
    return etat;
  }

  async function enregistrer() {
    appliquer();
    try { window.localStorage.setItem(CLE, JSON.stringify(etat)); } catch (e) { /* ignoré */ }
    if (DW.dnd && DW.dnd.shareAppearance) DW.dnd.shareAppearance(etat);
    if (!surServeur()) return { ok: true, portee: 'navigateur' };
    try {
      const r = await fetch('/api/appearance', {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(etat),
      });
      if (!r.ok) {
        const j = await r.json().catch(() => ({}));
        return { ok: false, error: j.error || ('refus du serveur (HTTP ' + r.status + ')') };
      }
      return { ok: true, portee: 'contrôleur' };
    } catch (e) {
      return { ok: false, error: 'serveur injoignable' };
    }
  }

  // ------------------------------------------------------------------ logo
  /**
   * Fichier choisi par l'opérateur → image incorporée, réduite.
   *
   * SVG : conservé tel quel (il se redimensionne sans perte), simplement
   * encodé. Matriciel : redessiné dans un canvas à la hauteur d'affichage,
   * ce qui ramène une photo de plusieurs méga-octets à quelques kilo-octets.
   */
  function lireLogo(file) {
    return new Promise((resolve, reject) => {
      if (!file) return reject(new Error('aucun fichier'));
      if (!/^image\//.test(file.type || '')) {
        return reject(new Error('ce fichier n’est pas une image'));
      }
      if (file.size > 4 * 1024 * 1024) {
        return reject(new Error('image trop lourde (4 Mo maximum en entrée)'));
      }
      const fr = new FileReader();
      fr.onerror = () => reject(new Error('lecture impossible'));
      if (/svg/.test(file.type)) {
        fr.onload = () => {
          const uri = 'data:image/svg+xml;base64,' + btoa(
            String.fromCharCode(...new Uint8Array(fr.result)));
          if (uri.length > MAX_LOGO) return reject(new Error('SVG trop volumineux'));
          resolve(uri);
        };
        fr.readAsArrayBuffer(file);
        return;
      }
      fr.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('image illisible'));
        img.onload = () => {
          const k = Math.min(1, LOGO_H / (img.naturalHeight || LOGO_H),
                             LOGO_W / (img.naturalWidth || LOGO_W));
          const cv = document.createElement('canvas');
          cv.width = Math.max(1, Math.round(img.naturalWidth * k));
          cv.height = Math.max(1, Math.round(img.naturalHeight * k));
          const ctx = cv.getContext('2d');
          ctx.drawImage(img, 0, 0, cv.width, cv.height);
          let uri = cv.toDataURL('image/png');
          if (uri.length > MAX_LOGO) uri = cv.toDataURL('image/jpeg', 0.85);
          if (uri.length > MAX_LOGO) return reject(new Error('image trop lourde après réduction'));
          resolve(uri);
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  DW.appearance = {
    TOKENS,
    charger,
    enregistrer,
    appliquer,
    lireLogo,
    etat: () => etat,
    /** Valeur affichée d'un jeton : celle réglée, sinon celle du thème. */
    valeur(key) {
      const c = couleurs();
      if (c[key]) return c[key];
      const tok = TOKENS.find((t) => t.key === key);
      const v = getComputedStyle(document.documentElement).getPropertyValue(tok.css).trim();
      return /^#[0-9a-fA-F]{3,8}$/.test(v) ? v : '#888888';
    },
    setCouleur(key, valeur) {
      etat.colors[theme()][key] = valeur;
      appliquerCouleurs();
    },
    setLogo(uri) { etat.logo = uri || ''; appliquerLogo(); },
    /** Remet les couleurs du thème courant à celles du produit. */
    reinitialiserCouleurs() {
      etat.colors[theme()] = {};
      appliquerCouleurs();
    },
    /** Reçu d'une autre fenêtre : appliqué sans réémettre ni réenregistrer. */
    recevoir(o) {
      etat = normaliser(o);
      appliquer();
      try { window.localStorage.setItem(CLE, JSON.stringify(etat)); } catch (e) { /* ignoré */ }
    },
    surServeur,
  };

  // Le thème bascule : les couleurs propres à l'autre thème prennent le relais.
  document.addEventListener('dw:theme', appliquerCouleurs);
})();

</script>
<script>
/* Diagweb — back-end simulé des pages réseau (audit, capture, LLDP).
 *
 * Les trois pages réseau interrogent le serveur de diagnostic du contrôleur.
 * Hors serveur — Artifact, page publiée, copie hors ligne — il n'y a personne
 * pour répondre. Plutôt que de fermer la porte, ce module répond à la place du
 * serveur, avec **exactement les mêmes routes et les mêmes formes de JSON**
 * (`server/src/main.cpp`) : l'interface de gestion reste visible et
 * manipulable, on peut démarrer une capture, la voir grossir, l'arrêter, régler
 * un quota, armer un déclencheur.
 *
 * Deux règles, pour que la simulation ne se fasse jamais passer pour la
 * réalité :
 *   1. chaque réponse porte `simule: true`, et les pages affichent un bandeau ;
 *   2. rien n'est inventé qui prétende venir du matériel : les fichiers pcap
 *      simulés ne se téléchargent pas (il n'y a pas de trame derrière).
 *
 * Ce module est au serveur de diagnostic ce que `sim.js` est à la source de
 * données : le bouchon qui permet de travailler l'interface sans contrôleur.
 */
(function () {
  "use strict";
  const DW = (window.DW = window.DW || {});

  const CLE = 'diagweb.netsim.v1';   // réglages simulés (quota, déclencheur)
  const t0 = Date.now() / 1000;
  const now = () => Date.now() / 1000;

  // --------------------------------------------------------- état simulé
  // Un contrôleur plausible : deux ports Ethernet, un bus CAN, la boucle.
  const INTERFACES = [
    { name: 'eth0', kind: 'ethernet', mac: '02:1c:42:a7:10:01',
      ips: ['192.168.10.24/24', 'fe80::1c:42ff:fea7:1001/64'], mtu: 1500, up: true, oper: 'up' },
    { name: 'eth1', kind: 'ethernet', mac: '02:1c:42:a7:10:02',
      ips: ['10.20.0.7/24'], mtu: 1500, up: true, oper: 'up' },
    { name: 'eth2', kind: 'ethernet', mac: '02:1c:42:a7:10:03',
      ips: [], mtu: 1500, up: false, oper: 'down' },
    { name: 'can0', kind: 'can', mac: '', ips: [], mtu: 16, up: true, oper: 'unknown' },
    { name: 'lo', kind: 'boucle', mac: '00:00:00:00:00:00', ips: ['127.0.0.1/8'], mtu: 65536, up: true, oper: 'unknown' },
  ];

  const VOISINS = [
    { iface: 'eth0', chassis: '00:1b:1b:44:0a:21', chassisKind: 'adresse MAC',
      port: 'Gi1/0/12', portDesc: 'vers armoire de commande', sysName: 'commutateur-atelier-1',
      sysDesc: 'Commutateur industriel 8 ports, gestion niveau 2', mgmtIp: '192.168.10.1',
      caps: 'pont (actif)', vlan: '10', srcMac: '00:1b:1b:44:0a:21', ttl: 120, frames: 0, _p: 30 },
    { iface: 'eth0', chassis: 'passerelle-io-3', chassisKind: 'nom local',
      port: 'port-1', portDesc: '', sysName: 'passerelle-io-3',
      sysDesc: 'Passerelle d’entrées/sorties déportées', mgmtIp: '192.168.10.42',
      caps: 'station (actif)', vlan: '', srcMac: '00:0e:8c:71:33:5a', ttl: 120, frames: 0, _p: 30 },
    { iface: 'eth1', chassis: '00:60:35:12:c4:07', chassisKind: 'adresse MAC',
      port: 'eth3', portDesc: 'liaison de supervision', sysName: 'routeur-supervision',
      sysDesc: 'Routeur d’usine, filtrage entre ateliers', mgmtIp: '10.20.0.1',
      caps: 'pont (actif), routeur (actif)', vlan: '200', srcMac: '00:60:35:12:c4:07',
      ttl: 120, frames: 0, _p: 60 },
  ];

  const etat = {
    quotaBytes: 100 * 1048576,
    trigger: { enabled: false, addr: '', mode: 'nonzero', threshold: 0, iface: 'eth0', durationS: 60, armed: false },
    lldpTimeoutS: 600,
    runs: [],
    seq: 1,
    message: '',
  };

  try {
    const brut = localStorage.getItem(CLE);
    if (brut) {
      const j = JSON.parse(brut);
      if (j && typeof j.quotaBytes === 'number') etat.quotaBytes = j.quotaBytes;
      if (j && j.trigger) Object.assign(etat.trigger, j.trigger, { armed: false });
      if (j && typeof j.lldpTimeoutS === 'number') etat.lldpTimeoutS = j.lldpTimeoutS;
    }
  } catch (e) { /* stockage indisponible : réglages par défaut */ }

  // Les réglages simulés survivent au rechargement, comme ceux du serveur
  // survivent au redémarrage : c'est la propriété qu'on veut pouvoir montrer.
  function retenir() {
    try {
      localStorage.setItem(CLE, JSON.stringify({
        quotaBytes: etat.quotaBytes, trigger: etat.trigger, lldpTimeoutS: etat.lldpTimeoutS,
      }));
    } catch (e) { /* stockage indisponible : la session en cours suffit */ }
  }

  // --------------------------------------------------------------- capture
  /** Débit simulé, par interface : une capture grossit de façon crédible. */
  const debit = (iface) => (iface === 'can0' ? 3500 : iface === 'eth0' ? 42000 : 9000);

  function tailleDe(r) {
    const fin = r.state === 'en cours' ? now() : r.end_t;
    return Math.round(24 + debit(r.iface) * Math.max(0, fin - r.start_t));
  }

  function occupe() {
    return etat.runs.reduce((s, r) => s + tailleDe(r), 0);
  }

  function demarrer(iface, dureeS, filtre) {
    if (!INTERFACES.some((i) => i.name === iface)) return 'interface inconnue : ' + iface;
    if (etat.runs.some((r) => r.state === 'en cours' && r.iface === iface)) {
      return 'une capture est déjà en cours sur ' + iface;
    }
    if (occupe() >= etat.quotaBytes) return 'quota de disque atteint';
    const n = etat.seq++;
    etat.runs.push({
      id: iface + '-sim' + String(n).padStart(3, '0'),
      iface, filter: filtre || '', state: 'en cours', detail: 'capture simulée',
      start_t: now(), end_t: 0, duration_s: dureeS || 0,
    });
    return '';
  }

  function terminer(r, etatFin, detail) {
    r.state = etatFin;
    r.end_t = now();
    r.detail = detail;
  }

  /** Applique durée, quota et déclencheur — l'équivalent de `service()`. */
  function service() {
    for (const r of etat.runs) {
      if (r.state !== 'en cours') continue;
      if (r.duration_s > 0 && now() - r.start_t >= r.duration_s) terminer(r, 'terminée', 'durée atteinte');
    }
    if (occupe() >= etat.quotaBytes) {
      for (const r of etat.runs) {
        if (r.state === 'en cours') terminer(r, 'arrêtée', 'quota de disque atteint');
      }
    }
    const t = etat.trigger;
    if (!t.enabled || !t.addr) { t.armed = false; return; }
    const v = DW.source && DW.source.latest ? DW.source.latest(t.addr) : null;
    if (!v || typeof v.v !== 'number') return;
    const vrai = t.mode === 'above' ? v.v > t.threshold
               : t.mode === 'below' ? v.v < t.threshold
               : v.v !== 0;
    if (vrai && !t.armed) {
      t.armed = true;
      const err = demarrer(t.iface, t.durationS, '');
      etat.message = err ? 'déclenchement refusé : ' + err
                         : 'capture déclenchée par « ' + t.addr +' »';
    } else if (!vrai && t.armed) {
      t.armed = false;
      for (const r of etat.runs) {
        if (r.state === 'en cours' && r.detail === 'capture simulée') {
          terminer(r, 'terminée', 'fin de la condition de déclenchement');
        }
      }
    }
  }

  function captureJson() {
    service();
    return {
      simule: true,
      tool: '/usr/bin/tcpdump (simulé)',
      // Aucun privilège en jeu hors serveur : la simulation ne prétend pas
      // ouvrir d'interface, elle ne peut donc pas s'en voir refuser une.
      privilege: '',
      quotaBytes: etat.quotaBytes,
      usedBytes: occupe(),
      message: etat.message,
      trigger: Object.assign({}, etat.trigger),
      runs: etat.runs.map((r) => ({
        id: r.id, iface: r.iface, filter: r.filter, state: r.state, detail: r.detail,
        bytes: tailleDe(r), ageS: now() - r.start_t, durationS: r.duration_s, simule: true,
      })),
    };
  }

  // ----------------------------------------------------------------- audit
  const liens = () => (DW.protocols && DW.protocols.links ? DW.protocols.links() : []);

  /** Cible d'un lien, comme le serveur la compose pour l'audit. */
  function cible(k) {
    const p = k.params || {};
    if (p.host) return p.host + ':' + (p.port || 0);
    return p.iface || p.device || p.endpoint || '';
  }

  /** Sockets plausibles : le serveur en écoute, plus un client par lien actif. */
  function sockets() {
    const l = [
      { proto: 'tcp', local: '0.0.0.0:8080', remote: '', state: 'écoute', direction: 'entrante' },
      { proto: 'tcp', local: '192.168.10.24:8080', remote: '192.168.10.60:51422',
        state: 'établie', direction: 'entrante' },
    ];
    let p = 40000;
    for (const k of liens()) {
      if (k.enabled === false) continue;
      const par = k.params || {};
      if (!par.host) continue;                 // liens sur bus : pas de socket IP
      l.push({
        proto: (k.protocol === 'snmp' ? 'udp' : 'tcp'),
        local: '192.168.10.24:' + (p++), remote: par.host + ':' + (par.port || 0),
        state: 'établie', direction: 'sortante',
      });
    }
    return l;
  }

  function auditJson() {
    const st = (DW.protocols && DW.protocols.status) || {};
    return {
      simule: true, listenPort: 8080, pid: 0, source: 'simulation',
      sockets: sockets(),
      interfaces: INTERFACES,
      links: liens().map((k) => ({
        id: k.id, protocol: k.protocol, target: cible(k),
        points: (k.points || []).length, enabled: k.enabled !== false,
        secretRef: (k.params && k.params.secretRef) || '',
      })),
      status: Object.keys(st).map((id) => ({
        id, state: st[id].state || '', detail: st[id].detail || '',
      })),
    };
  }

  // ------------------------------------------------------------------ LLDP
  function lldpJson() {
    const age = (v) => (now() - t0) % v._p;     // annonce répétée toutes les _p s
    return {
      simule: true, active: true, error: '', timeoutS: etat.lldpTimeoutS,
      interfaces: INTERFACES,
      neighbors: VOISINS.map((v) => Object.assign({}, v, {
        ageS: age(v),
        seenS: now() - t0,
        frames: Math.max(1, Math.floor((now() - t0) / v._p) + 1),
      })),
    };
  }

  // ------------------------------------------------- aiguillage des routes
  /**
   * Même contrat que `fetch` côté appelant : le chemin et le corps sont ceux
   * du serveur. Toute route inconnue échoue, comme elle échouerait là-bas.
   */
  function appel(chemin, options) {
    const opt = options || {};
    const corps = opt.body ? JSON.parse(opt.body) : {};
    const route = chemin.split('?')[0];

    if (route === '/api/interfaces') return INTERFACES;
    if (route === '/api/audit') return auditJson();
    if (route === '/api/lldp') {
      if (opt.method === 'PUT') {
        etat.lldpTimeoutS = Math.max(10, Math.min(86400, corps.timeoutS || 600));
        retenir();
      }
      return lldpJson();
    }
    if (route === '/api/capture') return captureJson();
    if (route === '/api/capture/start') {
      const err = demarrer(corps.iface, corps.durationS, corps.filter);
      if (err) throw new Error(err);
      return { ok: true, state: captureJson() };
    }
    if (route === '/api/capture/stop') {
      const r = etat.runs.find((x) => x.id === corps.id);
      if (!r || r.state !== 'en cours') throw new Error('capture inconnue ou déjà arrêtée');
      terminer(r, 'arrêtée', 'arrêt demandé');
      return { ok: true, state: captureJson() };
    }
    if (route === '/api/capture/delete') {
      const i = etat.runs.findIndex((x) => x.id === corps.id);
      if (i < 0) throw new Error('capture inconnue');
      if (etat.runs[i].state === 'en cours') throw new Error('capture en cours : l’arrêter d’abord');
      etat.runs.splice(i, 1);
      return { ok: true, state: captureJson() };
    }
    if (route === '/api/capture/config') {
      // Bornes identiques au serveur. `4096 << 20` déborderait le décalage
      // 32 bits de JavaScript et retournerait 0 : la multiplication s'impose.
      etat.quotaBytes = Math.max(1048576,
          Math.min(4096 * 1048576, Math.round((corps.quotaMB || 100) * 1048576)));
      const t = corps.trigger || {};
      const arme = etat.trigger.armed;
      etat.trigger = {
        enabled: !!t.enabled, addr: t.addr || '', mode: t.mode || 'nonzero',
        threshold: t.threshold || 0, iface: t.iface || 'eth0',
        durationS: t.durationS || 60, armed: arme,
      };
      // Une variable observée doit être abonnée, sinon le déclencheur est
      // aveugle — exactement comme côté serveur.
      if (etat.trigger.enabled && etat.trigger.addr && DW.source && DW.source.subscribe) {
        DW.source.subscribe(etat.trigger.addr, { periodMs: 200 });
      }
      retenir();
      return { ok: true, state: captureJson() };
    }
    throw new Error('point d’entrée inconnu : ' + route);
  }

  DW.netsim = { appel, interfaces: INTERFACES };
})();

</script>
<script>
/* Diagweb — trois pages réseau : audit, capture d'interfaces, voisinage LLDP.
 *
 * Elles s'ouvrent depuis le menu ☰ et s'affichent en pleine page par-dessus
 * l'espace de travail, qui continue de tourner derrière : ce sont des vues de
 * diagnostic du CONTRÔLEUR, pas des onglets de travail.
 *
 * Toutes trois interrogent le serveur de diagnostic. Hors serveur — Artifact,
 * page publiée, copie hors ligne — c'est `netsim.js` qui répond à sa place,
 * avec les mêmes routes : l'interface de gestion reste visible et
 * manipulable. Un bandeau le dit sans ambiguïté, et rien de ce qui vient de
 * la simulation ne se fait passer pour une mesure du matériel.
 */
(function () {
  "use strict";
  const DW = (window.DW = window.DW || {});

  // L'état d'un lien est un mot de CODE côté serveur (« up », « down »…) : il
  // se traduit avant d'être montré, sans quoi la seule vue qui affichait la
  // cause la donnait sous la forme « down · Connection refused ».
  const ETAT_LIEN = { up: 'connecté', down: 'en défaut', off: 'désactivé',
                      todo: 'non branché', sim: 'simulé' };
  const etatLien = (s) => (ETAT_LIEN[s.state] || s.state) + (s.detail ? ' · ' + s.detail : '');

  const $ = (id) => document.getElementById(id);
  const surServeur = () => DW.sourceMode === 'ws';

  /** Enveloppe commune : titre, bouton de fermeture, corps, rafraîchissement. */
  function ouvrirPage(titre, aide, construire, periodeMs) {
    const root = $('modalRoot');
    root.innerHTML = '';
    const back = document.createElement('div');
    back.className = 'modal-back page-back';
    back.innerHTML =
      '<div class="modal page" role="dialog" aria-label="' + DW.escapeHtml(titre) + '">' +
        '<header class="m-head"><h3></h3>' +
          '<button class="iconbtn m-close" type="button" title="Fermer cette page">✕</button>' +
        '</header>' +
        '<p class="m-note"></p>' +
        '<div class="page-body"></div>' +
      '</div>';
    back.querySelector('h3').textContent = titre;
    back.querySelector('.m-note').innerHTML = aide;
    const corps = back.querySelector('.page-body');
    let timer = null;
    const fermer = () => { if (timer) clearInterval(timer); root.innerHTML = ''; };
    back.querySelector('.m-close').addEventListener('click', fermer);
    back.addEventListener('pointerdown', (e) => { if (e.target === back) fermer(); });
    root.appendChild(back);

    if (!surServeur()) {
      const b = document.createElement('p');
      b.className = 'net-sim';
      b.title = 'Aucun serveur de diagnostic joignable : cette page fonctionne ' +
        'sur des données simulées, pour découvrir et régler l’interface.';
      b.innerHTML = '<b>Données simulées.</b> Aucun serveur de diagnostic n’est ' +
        'joignable : cette page montre un contrôleur fictif, pour découvrir et ' +
        'régler l’interface. Rien de ce qui s’affiche ici ne vient d’un matériel.';
      back.querySelector('.modal').insertBefore(b, corps);
    }
    const maj = () => construire(corps).catch((e) => {
      corps.innerHTML = '<p class="page-vide">Serveur injoignable : ' +
        DW.escapeHtml(e.message || String(e)) + '</p>';
    });
    maj();
    // Rafraîchissement tant que la page est ouverte ; l'intervalle meurt avec elle.
    if (periodeMs) timer = setInterval(() => { if (root.contains(back)) maj(); else fermer(); }, periodeMs);
    return { corps, maj, fermer };
  }

  /**
   * Un seul point d'appel pour les trois pages. Hors serveur, la requête part
   * vers le back-end simulé : mêmes routes, mêmes formes de réponse, si bien
   * que le reste de ce fichier ignore laquelle des deux répond.
   */
  async function api(chemin, options) {
    if (!surServeur()) {
      if (!DW.netsim) throw new Error('simulation réseau indisponible');
      return DW.netsim.appel(chemin, options);
    }
    const r = await fetch(chemin, options);
    const txt = await r.text();
    let j = null;
    try { j = JSON.parse(txt); } catch { /* réponse non JSON */ }
    if (!r.ok) throw new Error((j && j.error) || ('HTTP ' + r.status));
    return j;
  }

  const octets = (n) => (n >= 1048576 ? (n / 1048576).toFixed(1) + ' Mo'
                        : n >= 1024 ? (n / 1024).toFixed(1) + ' ko' : n + ' o');
  const duree = (s) => (s >= 3600 ? Math.round(s / 3600) + ' h'
                       : s >= 60 ? Math.round(s / 60) + ' min' : Math.round(s) + ' s');

  const tableau = (entetes, lignes, vide) => {
    if (!lignes.length) return '<p class="page-vide">' + vide + '</p>';
    return '<table class="net-tab"><thead><tr>' +
      entetes.map((h) => '<th>' + h + '</th>').join('') + '</tr></thead><tbody>' +
      lignes.map((l) => '<tr>' + l.map((c) => '<td>' + c + '</td>').join('') + '</tr>').join('') +
      '</tbody></table>';
  };

  // ------------------------------------------------------------------ audit
  /**
   * Audit des communications. Deux vues côte à côte : les sockets réellement
   * ouvertes par le processus (état du noyau, lu dans /proc) et les liens
   * déclarés dans la configuration. Un écart entre les deux est une
   * information — un lien en défaut n'a pas de socket ouverte.
   */
  function pageAudit() {
    ouvrirPage('Audit des communications',
      'Ce que le processus échange avec l’extérieur, à l’instant du relevé. ' +
      'La vue <b>observée</b> vient du noyau (sockets réellement ouvertes) ; la vue ' +
      '<b>déclarée</b> vient de la configuration des liens. Destiné à un audit de ' +
      'sécurité ou à un architecte réseau : le rapport se copie en un bouton.',
      async (corps) => {
        const d = await api('/api/audit');
        const entrantes = d.sockets.filter((s) => s.direction === 'entrante');
        const sortantes = d.sockets.filter((s) => s.direction === 'sortante');
        const st = Object.fromEntries((d.status || []).map((s) => [s.id, s]));

        corps.innerHTML =
          '<div class="net-sec"><h4>Entrant — ce que le contrôleur accepte</h4>' +
          tableau(['Protocole', 'Écoute sur', 'Pair', 'État'],
            entrantes.map((s) => [s.proto, DW.escapeHtml(s.local),
                                  DW.escapeHtml(s.remote || '—'), DW.escapeHtml(s.state)]),
            'Aucune socket entrante.') + '</div>' +

          '<div class="net-sec"><h4>Sortant — ce que le contrôleur va chercher</h4>' +
          tableau(['Protocole', 'Depuis', 'Vers', 'État'],
            sortantes.map((s) => [s.proto, DW.escapeHtml(s.local),
                                  DW.escapeHtml(s.remote), DW.escapeHtml(s.state)]),
            'Aucune connexion sortante ouverte à cet instant.') + '</div>' +

          '<div class="net-sec"><h4>Liens déclarés</h4>' +
          tableau(['Lien', 'Protocole', 'Cible', 'Points', 'Secrets', 'État'],
            (d.links || []).map((l) => [
              DW.escapeHtml(l.id), DW.escapeHtml(l.protocol), DW.escapeHtml(l.target || '—'),
              String(l.points),
              l.secretRef ? 'référence « ' + DW.escapeHtml(l.secretRef) + ' »' : '—',
              st[l.id] ? DW.escapeHtml(etatLien(st[l.id])) : '—',
            ]),
            'Aucun lien réseau configuré.') + '</div>' +

          '<div class="net-sec"><h4>Interfaces</h4>' +
          tableau(['Interface', 'Type', 'MAC', 'Adresses', 'MTU', 'État'],
            (d.interfaces || []).map((i) => [
              DW.escapeHtml(i.name), i.kind, DW.escapeHtml(i.mac || '—'),
              i.ips.length ? i.ips.map(DW.escapeHtml).join('<br>') : '—',
              String(i.mtu), i.up ? i.oper : 'éteinte',
            ]), 'Aucune interface.') + '</div>' +

          '<div class="net-sec"><h4>Propriétés de conception</h4><ul class="net-list">' +
          '<li><b>Lecture seule de bout en bout</b> : aucune écriture vers un équipement, ' +
          'hors trois exceptions bornées et explicites — activation d’un bloc de rapport ' +
          'IEC 61850, requête de lecture SDO CANopen (désactivée par défaut) et demande de ' +
          'PGN J1939 (par point, décochée par défaut).</li>' +
          '<li><b>Aucun secret dans la configuration</b> : elle ne porte que des ' +
          'références, résolues dans l’environnement du service.</li>' +
          '<li><b>Aucune ressource extérieure</b> dans la page : ni CDN, ni police, ni ' +
          'image distante. Le logo de l’exploitant est incorporé.</li>' +
          '<li><b>Écoute de niveau 2</b> (GOOSE, Sampled Values, LLDP) en réception ' +
          'seulement : Diagweb n’émet aucune trame Ethernet.</li>' +
          '</ul></div>' +
          '<div class="m-actions"><button class="btn net-copy" type="button" ' +
          'title="Copier le rapport en texte, pour un compte rendu d’audit">' +
          'Copier le rapport</button><span class="net-msg"></span></div>';

        corps.querySelector('.net-copy').addEventListener('click', () => {
          const txt = rapportTexte(d);
          const msg = corps.querySelector('.net-msg');
          navigator.clipboard.writeText(txt)
            .then(() => { msg.textContent = 'Rapport copié (' + txt.split('\n').length + ' lignes).'; })
            .catch(() => { DW.app.showText('Rapport d’audit', txt); });
        });
      }, 4000);
  }

  /** Le même rapport, en texte : c'est ce qui se colle dans un compte rendu. */
  function rapportTexte(d) {
    const l = [];
    l.push('Diagweb — audit des communications');
    if (d.simule) l.push('*** DONNÉES SIMULÉES — aucun contrôleur interrogé ***');
    l.push('Processus ' + d.pid + ', port d’écoute ' + d.listenPort);
    l.push('');
    l.push('ENTRANT');
    for (const s of d.sockets.filter((x) => x.direction === 'entrante')) {
      l.push('  ' + s.proto + '  ' + s.local + (s.remote ? '  <- ' + s.remote : '') + '  [' + s.state + ']');
    }
    l.push('');
    l.push('SORTANT');
    const sortantes = d.sockets.filter((x) => x.direction === 'sortante');
    if (!sortantes.length) l.push('  (aucune connexion ouverte à cet instant)');
    for (const s of sortantes) l.push('  ' + s.proto + '  ' + s.local + '  -> ' + s.remote + '  [' + s.state + ']');
    l.push('');
    l.push('LIENS DÉCLARÉS');
    for (const k of d.links || []) {
      l.push('  ' + k.id + '  ' + k.protocol + '  ' + (k.target || '—') + '  ' +
             k.points + ' point(s)' + (k.secretRef ? '  secrets: ' + k.secretRef : ''));
      // L'état et son motif dans le rapport : c'est ce texte qu'on copie dans
      // un compte rendu, et il omettait justement la panne dont on parle.
      const e = (DW.protocols && DW.protocols.status) ? DW.protocols.status[k.id] : null;
      if (e) l.push('      état : ' + etatLien(e));
    }
    l.push('');
    l.push('INTERFACES');
    for (const i of d.interfaces || []) {
      l.push('  ' + i.name + '  ' + i.kind + '  ' + (i.mac || '') + '  ' +
             (i.ips.join(', ') || '—') + '  MTU ' + i.mtu + '  ' + (i.up ? i.oper : 'éteinte'));
    }
    return l.join('\n');
  }

  // ---------------------------------------------------------------- capture
  /**
   * Capture d'interfaces. tcpdump tourne sur le contrôleur, au plus près du
   * câble ; le fichier .pcap se relit dans Wireshark. Trois garde-fous
   * (quota, durée, déclencheur) parce qu'une capture oubliée remplit un
   * disque embarqué.
   */
  function pageCapture() {
    let form = null;
    ouvrirPage('Capture d’interfaces réseau',
      'Capture des trames sur les interfaces du contrôleur — Ethernet et CAN — ' +
      'par tcpdump, au format pcap relisible dans Wireshark. Le <b>quota global</b> ' +
      'protège le disque : atteint, les captures en cours s’arrêtent. Une capture ' +
      'peut aussi être <b>déclenchée par une variable</b> de diagnostic, pour ' +
      'attraper un incident rare sans laisser tourner la capture des heures.',
      async (corps) => {
        const [d, ifs] = await Promise.all([api('/api/capture'), api('/api/interfaces')]);
        if (!form) {
          corps.innerHTML = '<div class="net-sec cap-form"></div>' +
                            '<div class="net-sec cap-trig"></div>' +
                            '<div class="net-sec cap-list"></div>';
          form = true;
          construireFormulaire(corps.querySelector('.cap-form'), d, ifs, corps);
          construireDeclencheur(corps.querySelector('.cap-trig'), d, ifs, corps);
        }
        majListe(corps.querySelector('.cap-list'), d, corps);
      }, 2000);
  }

  function construireFormulaire(el, d, ifs, corps) {
    const options = ifs.map((i) =>
      '<option value="' + DW.escapeHtml(i.name) + '">' + DW.escapeHtml(i.name) +
      ' — ' + i.kind + (i.up ? '' : ' (éteinte)') + '</option>').join('');
    el.innerHTML =
      '<h4>Nouvelle capture</h4>' +
      (d.tool ? '' : '<p class="page-vide">tcpdump n’est pas installé sur le contrôleur : ' +
        'la capture est impossible tant qu’il n’y est pas.</p>') +
      // Le privilège manque plus souvent que l'outil, et son refus est illisible
      // (« socket : Operation not permitted ») : il se dit AVANT l'essai, avec
      // la commande qui débloque — sinon on croit s'être trompé d'interface.
      (d.tool && d.privilege
        ? '<p class="page-vide cap-priv" title="Ouvrir une interface en capture ' +
          'demande la capacité CAP_NET_RAW. Elle manque ici ; le message dit à qui ' +
          'la donner et comment.">' +
          '<b>Capture impossible en l’état :</b> ' + DW.escapeHtml(d.privilege) + '</p>'
        : '') +
      '<div class="cap-row">' +
        '<label>Interface<select class="cap-if" title="Interface à capturer. Les ' +
          'interfaces CAN se capturent comme les autres, avec leur propre type de lien.">' +
          options + '</select></label>' +
        '<label>Durée<select class="cap-dur" title="Durée maximale ; la capture ' +
          's’arrête d’elle-même. « Sans limite » reste soumise au quota.">' +
          '<option value="30">30 s</option><option value="60" selected>1 min</option>' +
          '<option value="300">5 min</option><option value="900">15 min</option>' +
          '<option value="3600">1 h</option><option value="0">sans limite</option>' +
        '</select></label>' +
        '<label class="cap-wide">Filtre<input class="cap-filter" type="text" ' +
          'placeholder="ex. host 10.0.0.5 and port 502" ' +
          'title="Expression de filtrage pcap, facultative. Elle réduit le volume ' +
          'capturé — utile quand le quota est serré."></label>' +
        '<button class="btn primary cap-go" type="button" ' +
          'title="Démarrer la capture sur cette interface">Démarrer</button>' +
      '</div>' +
      '<p class="m-note cap-quota"></p>';
    el.querySelector('.cap-go').addEventListener('click', async () => {
      try {
        await api('/api/capture/start', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            iface: el.querySelector('.cap-if').value,
            durationS: parseFloat(el.querySelector('.cap-dur').value),
            filter: el.querySelector('.cap-filter').value.trim(),
          }),
        });
        DW.app.toast('Capture démarrée.');
      } catch (e) { DW.app.toast('Capture refusée : ' + e.message, 'err'); }
      majTout(corps);
    });
  }

  function construireDeclencheur(el, d, ifs, corps) {
    const t = d.trigger || {};
    const options = ifs.map((i) =>
      '<option value="' + DW.escapeHtml(i.name) + '"' +
      (t.iface === i.name ? ' selected' : '') + '>' + DW.escapeHtml(i.name) + '</option>').join('');
    el.innerHTML =
      '<h4>Déclenchement par une variable</h4>' +
      '<div class="cap-row">' +
        '<label class="pop-check"><input type="checkbox" class="tr-on"' + (t.enabled ? ' checked' : '') +
          ' title="Armer le déclencheur : la capture suivra la variable"><span>Actif</span></label>' +
        '<label class="cap-wide">Variable<input class="tr-addr" type="text" ' +
          'value="' + DW.escapeHtml(t.addr || '') + '" placeholder="ex. S0.5 ou @banc.defaut" ' +
          'title="Adresse d’une variable de diagnostic. La capture démarre au front ' +
          'montant de la condition et s’arrête au front descendant."></label>' +
        '<label>Condition<select class="tr-mode" title="Condition évaluée sur la variable">' +
          '<option value="nonzero"' + (t.mode === 'nonzero' ? ' selected' : '') + '>non nulle</option>' +
          '<option value="above"' + (t.mode === 'above' ? ' selected' : '') + '>au-dessus de</option>' +
          '<option value="below"' + (t.mode === 'below' ? ' selected' : '') + '>en dessous de</option>' +
        '</select></label>' +
        '<label>Seuil<input class="tr-seuil" type="number" step="any" value="' +
          (t.threshold || 0) + '" title="Seuil comparé à la valeur de la variable"></label>' +
        '<label>Interface<select class="tr-if" title="Interface capturée au déclenchement">' +
          options + '</select></label>' +
        '<label>Durée max<input class="tr-dur" type="number" min="1" value="' +
          (t.durationS || 60) + '" title="Durée maximale d’une capture déclenchée (s)"></label>' +
        '<button class="btn tr-save" type="button" ' +
          'title="Enregistrer le déclencheur et le quota">Appliquer</button>' +
      '</div>' +
      '<div class="cap-row"><label>Quota global (Mo)<input class="cap-quota-in" type="number" ' +
        'min="1" value="' + Math.round((d.quotaBytes || 0) / 1048576) + '" ' +
        'title="Espace maximal occupé par l’ensemble des captures. Atteint, les ' +
        'captures en cours sont arrêtées."></label></div>';
    el.querySelector('.tr-save').addEventListener('click', async () => {
      try {
        await api('/api/capture/config', {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            quotaMB: parseFloat(el.querySelector('.cap-quota-in').value) || 100,
            trigger: {
              enabled: el.querySelector('.tr-on').checked,
              addr: el.querySelector('.tr-addr').value.trim(),
              mode: el.querySelector('.tr-mode').value,
              threshold: parseFloat(el.querySelector('.tr-seuil').value) || 0,
              iface: el.querySelector('.tr-if').value,
              durationS: parseFloat(el.querySelector('.tr-dur').value) || 60,
            },
          }),
        });
        DW.app.toast('Déclencheur et quota enregistrés.');
      } catch (e) { DW.app.toast('Réglage refusé : ' + e.message, 'err'); }
      majTout(corps);
    });
  }

  function majListe(el, d, corps) {
    const pc = d.quotaBytes ? Math.min(100, Math.round(100 * d.usedBytes / d.quotaBytes)) : 0;
    el.innerHTML =
      '<h4>Captures</h4>' +
      '<p class="m-note">Disque : ' + octets(d.usedBytes) + ' sur ' + octets(d.quotaBytes) +
      ' (' + pc + ' %)' + (d.message ? ' · ' + DW.escapeHtml(d.message) : '') + '</p>' +
      '<div class="cap-jauge"><i style="width:' + pc + '%"></i></div>' +
      tableau(['Fichier', 'Interface', 'État', 'Taille', 'Âge', ''],
        (d.runs || []).slice().reverse().map((r) => [
          DW.escapeHtml(r.id), DW.escapeHtml(r.iface),
          '<span class="cap-etat cap-' + (r.state === 'en cours' ? 'on' :
            r.state === 'échec' ? 'ko' : 'fin') + '">' + DW.escapeHtml(r.state) + '</span> ' +
            '<span class="cap-detail">' + DW.escapeHtml(r.detail || '') + '</span>',
          octets(r.bytes), duree(r.ageS),
          (r.state === 'en cours'
            ? '<button class="btn sm cap-stop" data-id="' + DW.escapeHtml(r.id) + '" ' +
              'title="Arrêter cette capture ; le fichier est refermé proprement">Arrêter</button>'
            : (r.simule
               // Une capture simulée n'a pas de trames derrière elle : offrir un
               // fichier reviendrait à en inventer.
               ? '<span class="cap-detail" title="Capture simulée : il n’y a pas ' +
                 'de trames derrière, donc pas de fichier à télécharger.">simulé</span> '
               : r.bytes > 24
               ? '<a class="btn sm" href="/api/capture/file?name=' + encodeURIComponent(r.id) +
                 '" title="Télécharger le fichier pcap">pcap</a> '
               : '') +
              '<button class="btn sm cap-del" data-id="' + DW.escapeHtml(r.id) + '" ' +
              'title="Supprimer ce fichier et libérer le quota">Supprimer</button>'),
        ]), 'Aucune capture pour l’instant.');

    for (const b of el.querySelectorAll('.cap-stop')) {
      b.addEventListener('click', async () => {
        try { await api('/api/capture/stop', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: b.dataset.id }) }); } catch (e) { DW.app.toast(e.message, 'err'); }
        majTout(corps);
      });
    }
    for (const b of el.querySelectorAll('.cap-del')) {
      b.addEventListener('click', async () => {
        try { await api('/api/capture/delete', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: b.dataset.id }) }); } catch (e) { DW.app.toast(e.message, 'err'); }
        majTout(corps);
      });
    }
  }

  async function majTout(corps) {
    const d = await api('/api/capture');
    majListe(corps.querySelector('.cap-list'), d, corps);
  }

  // ------------------------------------------------------------------- LLDP
  /**
   * Voisinage LLDP : ce qu'il y a EN FACE de chaque interface. Réception
   * seule — Diagweb n'émet aucune trame et ne se déclare donc pas au
   * voisinage.
   */
  function pageLldp() {
    ouvrirPage('Voisinage réseau (LLDP)',
      'Ce que les équipements voisins annoncent sur chaque interface : produit, ' +
      'port, adresse d’administration, VLAN. Écoute <b>passive</b> : Diagweb n’émet ' +
      'aucune trame LLDP et ne se déclare pas au voisinage. Une annonce non ' +
      'renouvelée disparaît au bout du délai réglé ci-dessous.',
      async (corps) => {
        const d = await api('/api/lldp');
        const parIface = new Map();
        for (const n of d.neighbors) {
          if (!parIface.has(n.iface)) parIface.set(n.iface, []);
          parIface.get(n.iface).push(n);
        }
        let html = '';
        if (!d.active) {
          html += '<p class="page-vide">Écoute LLDP inactive : ' +
            DW.escapeHtml(d.error || 'raison inconnue') + '</p>';
        }
        html += '<div class="net-sec"><label class="lldp-to">Oublier un voisin après ' +
          '<select class="lldp-timeout" title="Délai au-delà duquel un voisin qui ' +
          'n’émet plus disparaît du tableau. Une annonce LLDP est répétée toutes les ' +
          '30 s en général ; dix minutes laissent passer plusieurs manques.">' +
          [60, 300, 600, 1800, 3600].map((v) =>
            '<option value="' + v + '"' + (Math.round(d.timeoutS) === v ? ' selected' : '') +
            '>' + duree(v) + '</option>').join('') +
          '</select> sans nouvelle annonce</label></div>';

        for (const i of d.interfaces) {
          if (i.kind === 'boucle') continue;
          const l = parIface.get(i.name) || [];
          html += '<div class="net-sec"><h4>' + DW.escapeHtml(i.name) +
            ' <span class="lldp-if">' + i.kind + ' · ' + (i.up ? i.oper : 'éteinte') +
            (i.mac ? ' · ' + DW.escapeHtml(i.mac) : '') + '</span></h4>';
          if (!l.length) {
            html += '<p class="page-vide">Aucun voisin annoncé sur cette interface.</p>';
          } else {
            html += l.map((n) =>
              '<div class="lldp-card">' +
                '<div class="lldp-name">' + DW.escapeHtml(n.sysName || n.chassis || '(sans nom)') + '</div>' +
                '<div class="lldp-grid">' +
                  ligne('Port distant', (n.port || '—') + (n.portDesc ? ' — ' + n.portDesc : '')) +
                  ligne('Châssis', n.chassis + (n.chassisKind ? ' (' + n.chassisKind + ')' : '')) +
                  ligne('Administration', n.mgmtIp || '—') +
                  ligne('Description', n.sysDesc || '—') +
                  ligne('Capacités', n.caps || '—') +
                  ligne('VLAN natif', n.vlan || '—') +
                  ligne('MAC source', n.srcMac) +
                  ligne('TTL annoncé', n.ttl ? n.ttl + ' s' : '—') +
                  ligne('Vu depuis', duree(n.seenS) + ' · ' + n.frames + ' annonce(s)') +
                  ligne('Dernière annonce', 'il y a ' + duree(n.ageS)) +
                '</div></div>').join('');
          }
          html += '</div>';
        }
        corps.innerHTML = html;
        corps.querySelector('.lldp-timeout').addEventListener('change', async (e) => {
          await api('/api/lldp', {
            method: 'PUT', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ timeoutS: parseFloat(e.target.value) }),
          });
          DW.app.toast('Délai d’oubli réglé sur ' + duree(parseFloat(e.target.value)) + '.');
        });
      }, 5000);
  }

  const ligne = (k, v) => '<span class="lldp-k">' + k + '</span><span class="lldp-v">' +
                          DW.escapeHtml(String(v)) + '</span>';

  DW.network = { pageAudit, pageCapture, pageLldp };
})();

</script>
<script>
/* Diagweb — fenêtre « Liens réseau » : saisie de la configuration des
 * protocoles (Modbus, IEC 61850, IEC 60870-5-104, CAN, J1939, CANopen, SNMP,
 * OPC UA)
 * et des
 * points à lire, puis ajout de ces points au diagnostic.
 *
 * Fonction globale (indépendante des onglets) : elle vit dans le menu ☰.
 * Les descriptions de protocoles viennent de protocols.js ; cette fenêtre ne
 * connaît que des champs génériques (texte, entier, flottant, booléen, liste,
 * hexadécimal), ce qui permet d'ajouter un protocole sans toucher à l'UI.
 */
(function () {
  "use strict";
  const DW = (window.DW = window.DW || {});
  const P = DW.protocols;

  const esc = (s) => DW.escapeHtml(String(s == null ? '' : s));
  const STATE_LABEL = {
    up:   ['●', 'connecté', 'Lien établi : les points remontent des valeurs.'],
    down: ['⚠', 'en défaut', 'Équipement injoignable ou protocole en erreur — voir le détail.'],
    off:  ['○', 'désactivé', 'Lien désactivé : aucun échange réseau.'],
    sim:  ['~', 'simulé', 'Aucun serveur de diagnostic : les valeurs affichées sont simulées.'],
    todo: ['⋯', 'non branché', 'Protocole configurable, lecture pas encore implémentée (voir docs/PROTOCOLES.md).'],
  };

  let root = null, view = null, editing = null, noteEl = null, veille = null;

  // ---------------------------------------------------------------- champs
  function fieldRow(f, params, onInput) {
    const wrap = document.createElement('div');
    wrap.className = 'pf-row';
    const id = 'pf_' + f.key;
    const lab = document.createElement('label');
    lab.className = 'pf-label';
    lab.setAttribute('for', id);
    lab.textContent = f.label + (f.required ? ' *' : '');
    lab.title = f.help;
    wrap.appendChild(lab);

    let input;
    if (f.type === 'enum') {
      input = document.createElement('select');
      for (const [v, txt] of f.choices) {
        const o = document.createElement('option');
        o.value = String(v);
        o.textContent = txt;
        input.appendChild(o);
      }
      input.value = String(params[f.key] == null ? f.def : params[f.key]);
    } else if (f.type === 'bool') {
      input = document.createElement('input');
      input.type = 'checkbox';
      input.checked = params[f.key] === true || params[f.key] === 'true';
    } else {
      input = document.createElement('input');
      input.type = (f.type === 'int' || f.type === 'float') ? 'number' : 'text';
      if (f.type === 'float') input.step = 'any';
      if (f.type === 'hex') input.placeholder = '0x…';
      input.value = params[f.key] == null ? String(f.def) : String(params[f.key]);
      input.autocomplete = 'off';
      input.spellcheck = false;
    }
    input.id = id;
    input.className = 'pf-input' + (f.type === 'bool' ? ' pf-check' : '');
    input.title = f.help;
    input.addEventListener('input', () => {
      params[f.key] = f.type === 'bool' ? input.checked
        : (f.type === 'int' || f.type === 'float') ? numVal(input.value, f)
        : input.value;
      if (onInput) onInput();
    });
    if (f.type === 'enum' || f.type === 'bool') {
      input.addEventListener('change', () => {
        params[f.key] = f.type === 'bool' ? input.checked : input.value;
        if (onInput) onInput();
      });
    }
    wrap.appendChild(input);
    return wrap;
  }

  function numVal(raw, f) {
    const v = f.type === 'int' ? parseInt(raw, 10) : parseFloat(raw);
    return isFinite(v) ? v : (raw === '' || raw === '-' ? raw : f.def);
  }

  /**
   * Formulaire d'une liste de champs, redessiné quand une dépendance change.
   * `hors` est le contexte englobant (les paramètres du lien, quand on édite
   * un point) : certains champs d'un point ne valent que pour un mécanisme
   * choisi au niveau du lien.
   */
  function fieldsForm(fields, params, hors) {
    const box = document.createElement('div');
    box.className = 'pf-form';
    const draw = () => {
      box.innerHTML = '';
      for (const f of fields) {
        if (!P.fieldApplies(f, params, hors)) continue;
        box.appendChild(fieldRow(f, params, () => {
          // Un champ « when » a pu changer : on redessine le formulaire.
          if (fields.some((g) => g.when && Object.keys(g.when).includes(f.key))) draw();
        }));
      }
    };
    draw();
    return box;
  }

  // ----------------------------------------------------------------- vues
  function open() {
    close();
    root = document.getElementById('modalRoot');
    const back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML =
      '<div class="modal wide" role="dialog" aria-label="Liens réseau">' +
        '<header class="m-head"><h3 id="pxTitle">Liens réseau</h3>' +
        '<button class="iconbtn m-close" type="button" title="Fermer cette fenêtre">✕</button></header>' +
        '<div id="pxBody"></div>' +
        '<p class="m-note" id="pxNote"></p>' +
      '</div>';
    root.innerHTML = '';
    root.appendChild(back);
    back.querySelector('.m-close').addEventListener('click', close);
    back.addEventListener('pointerdown', (e) => { if (e.target === back) close(); });
    noteEl = back.querySelector('#pxNote');
    view = 'links';
    render();
    // Écran de diagnostic : il se rafraîchit tout seul. On regarde un lien
    // repartir sans avoir à refermer et rouvrir la fenêtre — et seules les
    // vues de LISTE sont redessinées, jamais un formulaire en cours de saisie.
    if (P.mode === 'server') {
      const majuscule = async () => {
        if (!root) return;
        await P.refreshStatus();
        if (root && (view === 'links' || view === 'points')) render();
      };
      majuscule();
      veille = setInterval(majuscule, 2000);
    }
  }

  function close() {
    const r = document.getElementById('modalRoot');
    if (r) r.innerHTML = '';
    if (veille) { clearInterval(veille); veille = null; }
    root = null; view = null; editing = null;
  }

  function body() { return document.getElementById('pxBody'); }
  function setTitle(t) { document.getElementById('pxTitle').textContent = t; }
  function note(t) { if (noteEl) noteEl.textContent = t; }

  function render() {
    if (!root) return;
    const b = body();
    b.innerHTML = '';
    if (view === 'links') renderLinks(b);
    else if (view === 'link') renderLink(b);
    else if (view === 'points') renderPoints(b);
    else if (view === 'point') renderPoint(b);
  }

  // ------------------------------------------------------- diagnostic
  /**
   * Âge en clair. Le serveur publie des SECONDES ÉCOULÉES et non des dates :
   * son horloge compte depuis son démarrage, et la page n'a pas à connaître
   * cette origine pour écrire « il y a 3 s ».
   */
  function age(s) {
    if (s == null || s < 0) return null;
    if (s < 1.5) return 'à l’instant';
    if (s < 90) return 'il y a ' + Math.round(s) + ' s';
    if (s < 5400) return 'il y a ' + Math.round(s / 60) + ' min';
    return 'il y a ' + Math.round(s / 3600) + ' h';
  }

  const pluriel = (n, mot) => n + ' ' + mot + (n > 1 ? 's' : '');

  /**
   * La phrase de diagnostic d'un lien — celle qui doit suffire à savoir quoi
   * faire. Elle est AFFICHÉE, pas seulement mise en infobulle : sur écran
   * tactile il n'y a pas de survol, et c'est justement là qu'on diagnostique.
   */
  function linkDiag(link, st) {
    if (P.mode !== 'server') {
      return 'Page ouverte hors du serveur de diagnostic : aucun lien n’est ouvert, ' +
             'les valeurs affichées sont simulées.';
    }
    if (link.enabled === false) return 'Lien désactivé : aucun échange réseau.';
    const bouts = [];
    if (st.detail) bouts.push(st.detail);
    if (st.state === 'down' && st.attempts > 1) {
      bouts.push(pluriel(st.attempts, 'tentative') + ' de connexion');
    }
    if (st.state === 'up' || st.state === 'sim') {
      const muets = (st.points || []).filter((p) => !p.samples).length;
      const total = (st.points || []).length;
      bouts.push(st.samples ? pluriel(st.samples, 'échantillon') + ' reçu' + (st.samples > 1 ? 's' : '')
                            : 'aucun échantillon reçu');
      const quand = age(st.lastS);
      if (quand) bouts.push('dernier ' + quand);
      if (muets && total) {
        bouts.push(muets === total
          ? 'AUCUN point ne remonte de valeur : vérifier l’adressage des points'
          : muets + ' point' + (muets > 1 ? 's' : '') + ' sur ' + total + ' sans aucune valeur');
      }
    }
    // L'avertissement est daté, et affiché À PART de l'état : une exception sur
    // une requête n'abat pas le lien, mais elle explique un point muet.
    if (st.warn) {
      bouts.push('⚠ ' + st.warn + (age(st.warnS) ? ' (' + age(st.warnS) + ')' : ''));
    }
    if (st.sinceS >= 0 && st.state !== 'sim') {
      const d = age(st.sinceS);
      if (d) bouts.push('dans cet état ' + d);
    }
    // Cible locale injoignable : la cause la plus fréquente est que le serveur
    // de test n'est pas démarré. Le dire vaut mieux que laisser chercher.
    const pre = st.state === 'down' ? presetIntact(link) : null;
    if (pre) {
      bouts.push('→ ce lien vise le ' + pre.via + ' de cette machine : le démarrer par ' +
                 '« ' + pre.cmd + ' »');
    }
    return bouts.join(' · ');
  }

  /** Le diagnostic d'un point : ce qu'il a réellement produit. */
  function pointDiag(link, pt) {
    const ps = P.pointState(link.id, pt.id);
    if (!ps) return null;
    if (!ps.samples) return 'aucune valeur reçue depuis la configuration de ce lien';
    return pluriel(ps.samples, 'valeur') + ' reçue' + (ps.samples > 1 ? 's' : '') +
           (age(ps.lastS) ? ' · dernière ' + age(ps.lastS) : '');
  }

  // ---- liste des liens ---------------------------------------------
  function renderLinks(b) {
    setTitle('Liens réseau');
    note(P.mode === 'server'
      ? 'Configuration détenue par le contrôleur : le serveur de diagnostic ouvre lui-même les liens et lit les points.'
      : 'Aucun serveur de diagnostic joignable : la configuration est mémorisée dans ce navigateur et les valeurs des points sont simulées.');

    const bar = document.createElement('div');
    bar.className = 'm-actions';
    bar.appendChild(btn('+ Nouveau lien', 'primary',
      'Déclarer une connexion vers un équipement ou un réseau (Modbus, IEC 61850, IEC 60870-5-104, CAN, J1939, CANopen, SNMP, OPC UA)',
      () => { editing = newLink(); view = 'link'; render(); }));
    bar.appendChild(btn('Exporter', '',
      'Télécharger toute la configuration des liens réseau au format JSON',
      () => DW.store.download('liens-reseau', JSON.stringify(P.config, null, 2), 'json', 'application/json')));
    bar.appendChild(btn('Importer', '',
      'Charger une configuration de liens réseau depuis un fichier JSON',
      importConfig));
    b.appendChild(bar);

    const list = document.createElement('div');
    list.className = 'px-list';
    const links = P.links();
    if (!links.length) {
      const none = document.createElement('p');
      none.className = 'm-note';
      none.textContent = 'Aucun lien déclaré. « + Nouveau lien » ajoute une connexion ; ' +
        'ses points deviennent ensuite des variables ordinaires du diagnostic (@lien.point).';
      list.appendChild(none);
    }
    for (const link of links) {
      const proto = P.descriptor(link.protocol);
      const st = link.enabled === false ? { key: 'off' } :
                 (proto && proto.state === 'declared' && P.mode === 'server') ? { key: 'todo' } :
                 P.linkState(link.id);
      const [icon, label, help] = STATE_LABEL[st.key] || STATE_LABEL.off;
      const row = document.createElement('div');
      row.className = 'px-row';
      row.innerHTML =
        '<div class="px-head">' +
          '<span class="badge fam-NET" title="Protocole du lien">' + esc(proto ? proto.label : link.protocol) + '</span>' +
          '<b class="px-name"></b>' +
          '<span class="px-state st-' + st.key + '"></span>' +
        '</div>' +
        '<div class="px-sub"></div>';
      row.querySelector('.px-name').textContent = link.label || link.id;
      row.querySelector('.px-name').title = 'Nom du lien — les points s’adressent par @' + link.id + '.<point>';
      const stEl = row.querySelector('.px-state');
      stEl.textContent = icon + ' ' + label;
      stEl.title = (st.detail || help);
      row.querySelector('.px-sub').textContent =
        target(link) + ' · ' + (link.points || []).length + ' point(s)';
      row.querySelector('.px-sub').title = 'Cible du lien et nombre de points configurés';

      // Le motif en clair, sous la ligne — pas seulement dans l'infobulle de
      // l'état : c'est la phrase qu'on vient chercher quand rien n'arrive.
      const diag = document.createElement('div');
      diag.className = 'px-diag st-' + st.key;
      diag.textContent = linkDiag(link, st);
      diag.title = 'Ce que le serveur de diagnostic constate sur ce lien : motif, ' +
                   'compteurs et ancienneté. « Tester » rejoue une connexion à la demande.';
      if (diag.textContent) row.appendChild(diag);

      const acts = document.createElement('div');
      acts.className = 'm-actions px-acts';
      acts.appendChild(btn('Points', '', 'Voir, ajouter ou modifier les variables lues sur ce lien',
        () => { editing = link; view = 'points'; render(); }));
      acts.appendChild(btn('Modifier', '', 'Modifier le protocole et les paramètres de connexion de ce lien',
        () => { editing = link; view = 'link'; render(); }));
      acts.appendChild(btn('Tester', '', 'Demander au serveur de diagnostic d’ouvrir ce lien et de signaler le résultat',
        async (ev) => {
          const el = ev.currentTarget;
          el.disabled = true;
          try {
            const r = await P.test(link.id);
            DW.app.toast((r.ok ? '✓ ' : '✗ ') + (link.label || link.id) + ' : ' + r.detail, r.ok ? '' : 'err');
            if (P.mode === 'server') { await P.refreshStatus(); render(); }
          } finally { el.disabled = false; }
        }));
      acts.appendChild(btn(link.enabled === false ? 'Activer' : 'Désactiver', '',
        'Suspendre ou reprendre les échanges réseau de ce lien, sans perdre sa configuration',
        async () => { link.enabled = link.enabled === false; await persist(); render(); }));
      acts.appendChild(btn('Supprimer', 'danger', 'Supprimer ce lien et tous ses points',
        async () => {
          if (!window.confirm('Supprimer le lien « ' + (link.label || link.id) + ' » et ses ' +
              (link.points || []).length + ' point(s) ?')) return;
          P.config.links = P.links().filter((l) => l !== link);
          await persist();
          render();
        }));
      row.appendChild(acts);
      list.appendChild(row);
    }
    b.appendChild(list);
  }

  function target(link) {
    const p = link.params || {};
    if (p.host) return p.host + ':' + (p.port || '');
    if (p.device) return p.device + ' · ' + (p.baud || '') + ' bauds';
    if (p.iface) return 'interface ' + p.iface + (p.nodeId ? ' · nœud ' + p.nodeId : '');
    return '—';
  }

  // ---- édition d'un lien -------------------------------------------
  /** Le lien porte-t-il encore, à l'identique, le pré-remplissage du banc ? */
  function presetIntact(link) {
    const pre = P.localPreset(link.protocol);
    if (!pre) return null;
    const params = link.params || {};
    for (const k in pre.params) {
      if (String(params[k]) !== String(pre.params[k])) return null;
    }
    return pre;
  }

  function newLink() {
    const proto = DW.PROTOCOLS[0];
    let n = 1;
    while (P.link('lien' + n)) n++;
    return {
      id: 'lien' + n, label: 'Lien ' + n, protocol: proto.id, enabled: true,
      params: P.linkDefaults(proto), points: [], _new: true,
    };
  }

  function renderLink(b) {
    const link = editing;
    const proto = P.descriptor(link.protocol);
    setTitle(link._new ? 'Nouveau lien réseau' : 'Lien « ' + (link.label || link.id) + ' »');
    note(proto.help + (proto.state === 'declared'
      ? ' — pilote déclaré : la configuration est acceptée et conservée, la lecture viendra avec la pile protocolaire.'
      : ''));

    b.appendChild(textRow('Identifiant', link.id,
      'Identifiant court du lien, utilisé dans les adresses : @' + link.id + '.<point>. ' +
      'Lettres, chiffres, tiret et souligné, 24 caractères maximum.',
      (v) => { link.id = v; }));
    b.appendChild(textRow('Nom', link.label,
      'Nom lisible affiché dans la liste des liens et dans les libellés de points.',
      (v) => { link.label = v; }));

    const protoRow = document.createElement('div');
    protoRow.className = 'pf-row';
    const pl = document.createElement('label');
    pl.className = 'pf-label';
    pl.textContent = 'Protocole';
    pl.setAttribute('for', 'pxProto');
    pl.title = 'Protocole utilisé par le serveur de diagnostic pour lire les points de ce lien';
    const sel = document.createElement('select');
    sel.id = 'pxProto';
    sel.className = 'pf-input';
    sel.title = pl.title;
    for (const p of DW.PROTOCOLS) {
      const o = document.createElement('option');
      o.value = p.id;
      o.textContent = p.label + ' — ' + p.transport + (p.state === 'declared' ? ' (non branché)' : '');
      sel.appendChild(o);
    }
    sel.value = link.protocol;
    sel.addEventListener('change', () => {
      link.protocol = sel.value;
      const np = P.descriptor(link.protocol);
      link.params = P.linkDefaults(np);
      for (const pt of link.points || []) pt.params = P.defaults(np.pointFields);
      render();
    });
    protoRow.appendChild(pl);
    protoRow.appendChild(sel);
    b.appendChild(protoRow);

    const form = fieldsForm(proto.linkFields, link.params);
    b.appendChild(form);

    // Pré-remplissage : le dire, et seulement tant que c'est vrai. La mention
    // s'efface dès qu'un champ s'écarte du banc — sans quoi elle finirait par
    // désigner une adresse qui n'est plus la sienne, ce qui est pire que de
    // n'avoir rien dit.
    const preNote = document.createElement('p');
    preNote.className = 'm-note';
    preNote.title = 'Poste de développement (Codespace ou machine locale) : les champs de ' +
                    'connexion d’un lien neuf partent avec les coordonnées des serveurs de ' +
                    'test qui tournent ici. Sur un contrôleur en exploitation, rien n’est ' +
                    'pré-rempli.';
    const majPreNote = () => {
      const pre = presetIntact(link);
      preNote.textContent = pre
        ? 'Pré-rempli pour le ' + pre.via + ' de cette machine — à remplacer par ' +
          'l’adresse de l’équipement réel.'
        : '';
      preNote.hidden = !pre;
    };
    majPreNote();
    form.addEventListener('input', majPreNote);
    form.addEventListener('change', majPreNote);
    b.appendChild(preNote);

    const acts = document.createElement('div');
    acts.className = 'm-actions';
    acts.appendChild(btn('Enregistrer', 'primary', 'Valider ce lien et revenir à la liste', async () => {
      const err = validateLink(link);
      if (err) { DW.app.toast(err, 'err'); return; }
      if (link._new) { delete link._new; P.config.links.push(link); }
      await persist();
      view = 'links'; render();
    }));
    acts.appendChild(btn('Points…', '', 'Configurer les variables lues sur ce lien', () => {
      const err = validateLink(link);
      if (err) { DW.app.toast(err, 'err'); return; }
      if (link._new) { delete link._new; P.config.links.push(link); }
      persist().then(() => { view = 'points'; render(); });
    }));
    acts.appendChild(btn('Annuler', '', 'Revenir à la liste sans conserver les modifications', () => {
      P.load().then(() => { view = 'links'; render(); });
    }));
    b.appendChild(acts);
  }

  function validateLink(link) {
    if (!/^[A-Za-z][A-Za-z0-9_-]{0,23}$/.test(link.id)) {
      return 'Identifiant de lien invalide : une lettre puis lettres, chiffres, « - » ou « _ » (24 max).';
    }
    if (P.links().some((l) => l !== link && l.id === link.id)) {
      return 'Un autre lien porte déjà l’identifiant « ' + link.id +' ».';
    }
    const proto = P.descriptor(link.protocol);
    for (const f of proto.linkFields) {
      if (!f.required || !P.fieldApplies(f, link.params)) continue;
      const v = link.params[f.key];
      if (v === '' || v == null) return 'Champ obligatoire non renseigné : ' + f.label + '.';
    }
    return null;
  }

  // ---- points d'un lien ---------------------------------------------
  function renderPoints(b) {
    const link = editing;
    const proto = P.descriptor(link.protocol);
    setTitle('Points de « ' + (link.label || link.id) + ' »');
    note('Chaque point devient une variable du diagnostic, adressée @' + link.id + '.<point>, ' +
         'utilisable au tableau, en courbe et dans le journal.');

    const bar = document.createElement('div');
    bar.className = 'm-actions';
    bar.appendChild(btn('+ Nouveau point', 'primary', 'Déclarer une variable à lire sur ce lien',
      () => { editing = { link, point: newPoint(link, proto) }; view = 'point'; render(); }));
    bar.appendChild(btn('← Liens', '', 'Revenir à la liste des liens réseau',
      () => { editing = null; view = 'links'; render(); }));
    b.appendChild(bar);

    const list = document.createElement('div');
    list.className = 'px-list';
    if (!(link.points || []).length) {
      const none = document.createElement('p');
      none.className = 'm-note';
      none.textContent = 'Aucun point sur ce lien.';
      list.appendChild(none);
    }
    for (const pt of link.points || []) {
      const row = document.createElement('div');
      row.className = 'px-row';
      row.innerHTML =
        '<div class="px-head"><span class="badge fam-NET" title="Variable réseau">NET</span>' +
        '<b class="px-name mono"></b><span class="px-unit"></span></div>' +
        '<div class="px-sub"></div>';
      row.querySelector('.px-name').textContent = P.addrOf(link, pt);
      row.querySelector('.px-name').title = 'Adresse à saisir dans la barre de recherche';
      row.querySelector('.px-unit').textContent = pt.unit || '';
      row.querySelector('.px-unit').title = 'Unité affichée dans le tableau et sur les axes';
      const sub = row.querySelector('.px-sub');
      sub.textContent = (pt.label || pt.id) + ' · ' + P.pointSummary(link, pt) + ' · ' + pt.periodMs + ' ms';
      sub.title = 'Libellé, adressage protocole et période de lecture';

      // Un lien « connecté » dont un point reste muet est le cas le plus
      // trompeur : la ligne ci-dessous répond point par point.
      const dg = pointDiag(link, pt);
      if (dg) {
        const d = document.createElement('div');
        const ps = P.pointState(link.id, pt.id);
        d.className = 'px-diag' + (ps && ps.samples ? ' st-up' : ' st-down');
        d.textContent = dg;
        d.title = 'Ce que CE point a produit depuis que le lien est configuré. ' +
                  'Zéro valeur sur un lien connecté désigne son adressage, pas la connexion.';
        row.appendChild(d);
      }

      const acts = document.createElement('div');
      acts.className = 'm-actions px-acts';
      acts.appendChild(btn('Ajouter au diagnostic', 'primary',
        'Ajouter cette variable à la destination choisie dans la barre du haut (tableau ou graphique)',
        () => {
          if (DW.app.addVariable(P.addrOf(link, pt), pt.periodMs)) close();
        }));
      acts.appendChild(btn('Modifier', '', 'Modifier l’adressage, l’unité ou la période de ce point',
        () => { editing = { link, point: pt }; view = 'point'; render(); }));
      acts.appendChild(btn('Dupliquer', '', 'Créer un point identique, à ajuster (registre suivant, autre bit…)',
        async () => {
          const copy = JSON.parse(JSON.stringify(pt));
          let n = 2;
          while ((link.points || []).some((q) => q.id === pt.id + '_' + n)) n++;
          copy.id = pt.id + '_' + n;
          link.points.push(copy);
          await persist();
          render();
        }));
      acts.appendChild(btn('Supprimer', 'danger', 'Supprimer ce point de la configuration',
        async () => {
          link.points = link.points.filter((q) => q !== pt);
          await persist();
          render();
        }));
      row.appendChild(acts);
      list.appendChild(row);
    }
    b.appendChild(list);
  }

  function newPoint(link, proto) {
    let n = 1;
    while ((link.points || []).some((p) => p.id === 'point' + n)) n++;
    return {
      id: 'point' + n, label: '', unit: '', periodMs: 200, kind: 'float',
      params: P.defaults(proto.pointFields), _new: true,
    };
  }

  function renderPoint(b) {
    const { link, point } = editing;
    const proto = P.descriptor(link.protocol);
    setTitle(point._new ? 'Nouveau point' : 'Point ' + P.addrOf(link, point));
    note('Adresse dans Diagweb : @' + link.id + '.' + point.id +
         ' — protocole ' + proto.label + '.');

    b.appendChild(textRow('Identifiant', point.id,
      'Identifiant court du point : il complète l’adresse @' + link.id + '.<identifiant>.',
      (v) => { point.id = v; }));
    b.appendChild(textRow('Libellé', point.label,
      'Description affichée dans le tableau, les suggestions et les légendes de courbes.',
      (v) => { point.label = v; }));
    b.appendChild(textRow('Unité', point.unit,
      'Unité physique après application du gain et du décalage (bar, °C, tr/min…). ' +
      'Les courbes de même unité partagent une échelle.',
      (v) => { point.unit = v; }));
    b.appendChild(fieldRow(
      { key: 'periodMs', label: 'Période de lecture (ms)', type: 'int', def: 200, required: true,
        help: 'Cadence à laquelle le serveur de diagnostic lit ce point (10 ms à 60 s). ' +
              'Une période courte sur un lien lent peut saturer l’équipement.' },
      point));
    b.appendChild(fieldRow(
      { key: 'kind', label: 'Type de variable', type: 'enum', def: 'float', required: false,
        help: 'Présentation dans le diagnostic : bit (LED 0/1), mot 16 bits (décimal + hexadécimal) ou grandeur flottante.',
        choices: [['bit', 'Bit (0/1)'], ['word', 'Mot 16 bits'], ['float', 'Grandeur flottante']] },
      point));

    const h = document.createElement('h4');
    h.className = 'help-h';
    h.textContent = 'Adressage ' + proto.label;
    h.title = 'Paramètres propres au protocole de ce lien';
    b.appendChild(h);
    b.appendChild(fieldsForm(proto.pointFields, point.params, link.params));

    const acts = document.createElement('div');
    acts.className = 'm-actions';
    acts.appendChild(btn('Enregistrer', 'primary', 'Valider ce point et revenir à la liste', async () => {
      const err = validatePoint(link, point, proto);
      if (err) { DW.app.toast(err, 'err'); return; }
      if (point._new) { delete point._new; link.points.push(point); }
      await persist();
      editing = link; view = 'points'; render();
    }));
    acts.appendChild(btn('Annuler', '', 'Revenir à la liste des points sans conserver les modifications',
      () => { P.load().then(() => { editing = P.link(link.id); view = 'points'; render(); }); }));
    b.appendChild(acts);
  }

  function validatePoint(link, point, proto) {
    if (!/^[A-Za-z][A-Za-z0-9_-]{0,23}$/.test(point.id)) {
      return 'Identifiant de point invalide : une lettre puis lettres, chiffres, « - » ou « _ » (24 max).';
    }
    if ((link.points || []).some((p) => p !== point && p.id === point.id)) {
      return 'Ce lien a déjà un point « ' + point.id + ' ».';
    }
    const per = parseInt(point.periodMs, 10);
    if (!isFinite(per) || per < 10 || per > 60000) {
      return 'Période de lecture attendue entre 10 ms et 60 000 ms.';
    }
    for (const f of proto.pointFields) {
      if (!f.required || !P.fieldApplies(f, point.params, link.params)) continue;
      const v = point.params[f.key];
      if (v === '' || v == null) return 'Champ obligatoire non renseigné : ' + f.label + '.';
    }
    return null;
  }

  // ------------------------------------------------------------- outils

        const raw = typeof localStorage === 'undefined' ? null : localStorage.getItem(STORE_KEY);
        if (raw) this.config = normalize(JSON.parse(raw));
      } catch (e) { /* stockage indisponible */ }
      // Rien de configuré, et une machine de développement : on part avec les
      // liens vers les serveurs de test locaux plutôt qu'avec une liste vide.
      // Ce n'est PAS enregistré tant que rien n'est modifié — une valeur par
      // défaut ne doit pas devenir une configuration à laquelle on tient sans
      // l'avoir voulu.
      if (!this.config.links.length) this.config = normalize(localLinks());
      return this.config;
    },

    async save() {
      // On envoie une copie remise en forme, sans remplacer les objets vivants :
      // la fenêtre de configuration garde ses références (un remplacement ferait
      // écrire les modifications suivantes dans des objets orphelins).
      const payload = normalize(this.config);
      if (this.mode === 'server') {
        const r = await fetch('/api/protocols', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        if (!r.ok) throw new Error('le serveur de diagnostic a refusé la configuration');
        const j = await r.json().catch(() => ({}));
        this.status = indexStatus(j.status);
      } else {
        try {
          localStorage.setItem(STORE_KEY, JSON.stringify(payload));
        } catch (e) {
          throw new Error('stockage local indisponible');
        }
      }
      if (typeof this.onChange === 'function') this.onChange();
    },

    async refreshStatus() {
      if (this.mode !== 'server') return this.status;
      try {
        const r = await fetch('/api/protocols/status', { cache: 'no-store' });
        if (r.ok) this.status = indexStatus(await r.json());
      } catch (e) { /* lien serveur perdu : on garde le dernier état connu */ }
      return this.status;
    },

    /** Teste un lien côté serveur ; en mode local, réponse explicite. */
    async test(linkId) {
      if (this.mode !== 'server') {
        return { ok: false, detail: 'Aucun serveur de diagnostic : la configuration est ' +
                 'mémorisée dans le navigateur et les valeurs sont simulées.' };
      }
      const r = await fetch('/api/protocols/test', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: linkId }),
      });
      const j = await r.json().catch(() => ({}));
      return { ok: !!j.ok, detail: j.detail || (j.ok ? 'connexion établie' : 'échec') };
    },

    /**
     * État d'un lien, TOUJOURS sous la même forme — c'est `key` que
     * l'interface lit. Le serveur, lui, envoie le champ `state` : rendre son
     * objet tel quel laissait `key` indéfini, et tout lien réellement servi
     * s'affichait « ○ désactivé », y compris quand il communiquait. Le motif,
     * lui, était bien là mais caché dans une infobulle.
     */
    linkState(id) {
      if (this.mode !== 'server') {
        return { key: 'sim', state: 'sim', label: 'simulé',
                 detail: 'Valeurs simulées (pas de serveur de diagnostic).' };
      }
      const st = this.status[id];
      if (!st) {
        return { key: 'off', state: 'off', label: 'inconnu',
                 detail: 'État pas encore communiqué par le serveur de diagnostic.' };
      }
      return Object.assign({ key: st.state }, st);
    },

    /**
     * Ce qu'un point a réellement produit : nombre d'échantillons et âge du
     * dernier. `null` quand le serveur ne le dit pas (page hors serveur, ou
     * état pas encore reçu) — on n'invente pas un « 0 » qui se lirait comme
     * « le serveur affirme que ce point est muet ».
     */
    pointState(linkId, pointId) {
      const st = this.mode === 'server' ? this.status[linkId] : null;
      if (!st || !Array.isArray(st.points)) return null;
      return st.points.find((p) => p.id === pointId) || null;
    },

    addrOf, pointSummary, kindOf, defaults, fieldApplies, linkDefaults, localPreset,
    // Exposée pour tools/check-drivers.mjs, qui compare ces ports à ceux que
    // tools/bench.mjs ouvre réellement.
    localBench: BANC_LOCAL,
    localLinks,
  };

  function indexStatus(list) {
    const o = {};
    for (const s of list || []) o[s.id] = s;
    return o;
  }

  /** Remet une configuration lue (fichier, serveur, stockage) en forme sûre. */
  function normalize(cfg) {
    const out = { version: 1, links: [] };
    if (!cfg || typeof cfg !== 'object') return out;
    for (const l of cfg.links || []) {
      const proto = DW.PROTO_INDEX.get(l.protocol);
      if (!proto || !ID_RE.test(String(l.id || ''))) continue;
      const link = {
        id: String(l.id),
        label: String(l.label || l.id).slice(0, 60),
        protocol: proto.id,
        enabled: l.enabled !== false,
        params: Object.assign(defaults(proto.linkFields), l.params || {}),
        points: [],
      };
      for (const p of l.points || []) {
        if (!ID_RE.test(String(p.id || ''))) continue;
        if (link.points.some((q) => q.id === p.id)) continue;
        const point = {
          id: String(p.id),
          label: String(p.label || p.id).slice(0, 60),
          unit: String(p.unit || '').slice(0, 12),
          periodMs: Math.max(10, Math.min(60000, parseInt(p.periodMs, 10) || 200)),
          params: Object.assign(defaults(proto.pointFields), p.params || {}),
        };
        point.kind = ['bit', 'word', 'float'].includes(p.kind) ? p.kind : kindOf(proto, point);
        link.points.push(point);
      }
      if (!out.links.some((x) => x.id === link.id)) out.links.push(link);
    }
    return out;
  }
  api.normalize = normalize;

  DW.protocols = api;
  DW.protocolsReady = api.load();
})();

</script>
<script>
/* Diagweb — source de données simulée.
 *
 * Implémente le contrat DataSource (voir docs/SPECS.md §7) : le back-end
 * réel (WebSocket vers le contrôleur) devra exposer la même interface.
 */
(function () {
  "use strict";
  const DW = window.DW;
  const CFG = DW.CONFIG;

  // --- PRNG déterministe par adresse (comportement stable entre rechargements)
  function hash32(s) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // --- Générateurs -----------------------------------------------------
  function makeGen(meta, addr) {
    const rnd = mulberry32(hash32(addr));
    const phase = rnd() * 1000;
    let sim = meta.sim;
    if (!sim) sim = defaultSim(meta.kind, rnd);

    switch (sim.type) {
      case 'sine': {
        const round = meta.kind === 'word';
        return (t) => {
          let v = sim.base + sim.amp * Math.sin((t + phase) * 2 * Math.PI / sim.period) +
                  (sim.noise || 0) * (rnd() - 0.5) * 2;
          if (round) v = Math.max(0, Math.min(65535, Math.round(v)));
          return v;
        };
      }
      case 'walk': {
        let v = sim.base;
        return () => {
          v += (rnd() - 0.5) * 2 * sim.step + (sim.drift || 0);
          if (v < sim.min) v = sim.min + (sim.min - v);
          if (v > sim.max) v = sim.max - (v - sim.max);
          v = Math.max(sim.min, Math.min(sim.max, v));
          return v;
        };
      }
      case 'steps': {
        let cur = sim.values[Math.floor(rnd() * sim.values.length)];
        let nextAt = null;   // initialisé au premier appel (le pré-remplissage part de t négatif)
        const round = meta.kind === 'word';
        return (t) => {
          if (nextAt === null) nextAt = t + sim.period * (0.5 + rnd());
          if (t >= nextAt) {
            cur = sim.values[Math.floor(rnd() * sim.values.length)];
            nextAt = t + sim.period * (0.5 + rnd());
          }
          let v = cur + (sim.noise || 0) * (rnd() - 0.5) * 2;
          return round ? Math.round(v) : v;
        };
      }
      case 'square':
        return (t) => (((t + phase) % sim.period) < sim.period * sim.duty ? 1 : 0);
      case 'bit': {
        // Chaîne de Markov : temps de séjour moyens t0 (état 0) et t1 (état 1)
        let v = rnd() < sim.t1 / (sim.t0 + sim.t1) ? 1 : 0;
        let flipAt = null;   // initialisé au premier appel (t peut être négatif)
        return (t) => {
          if (flipAt === null) flipAt = t + (v ? sim.t1 : sim.t0) * (0.3 + rnd() * 1.4);
          if (t >= flipAt) {
            v = v ? 0 : 1;
            flipAt = t + (v ? sim.t1 : sim.t0) * (0.3 + rnd() * 1.4);
          }
          return v;
        };
      }
      case 'counter': {
        return (t) => ((Math.round(sim.rate * t) % 65536) + 65536) % 65536;
      }
      case 'jitter': {
        return () => {
          let v = sim.base + (rnd() - 0.5) * 2 * sim.noise;
          if (rnd() < sim.spikeP) v += sim.spikeAmp * rnd();
          return v;
        };
      }
      default:
        return () => 0;
    }
  }

  function defaultSim(kind, rnd) {
    if (kind === 'bit') return { type: 'bit', t0: 4 + rnd() * 30, t1: 4 + rnd() * 30 };
    if (kind === 'word') {
      const base = Math.round(500 + rnd() * 40000);
      return { type: 'sine', base, amp: base * 0.06 + 20, period: 8 + rnd() * 60, noise: 25 };
    }
    const base = Math.round((rnd() * 200 - 40) * 10) / 10;
    return { type: 'sine', base, amp: 2 + rnd() * 25, period: 8 + rnd() * 50, noise: 0.4 };
  }

  // --- Registre des abonnements ---------------------------------------
  // addr -> { meta, gen, ts:[], vs:[], tss, refs, periodS, nextK }
  // Les instants d'échantillonnage sont les multiples ENTIERS de la période
  // (t = k·période) : toutes les variables de même période tombent aux mêmes
  // instants — sur des secondes entières quand la période divise la seconde.
  // Sans ce calage, deux variables de même période écrivaient leurs lignes en
  // quinconce dans le journal téléchargé trié par horodatage.
  const regs = new Map();
  // Valeurs forcées (diagnostic) : tant qu'une adresse y figure, la simulation
  // sert cette valeur au lieu du générateur (voir DW.source.write).
  const forced = new Map();
  const t0 = performance.now() / 1000;
  const brut = () => performance.now() / 1000 - t0;

  /**
   * Acquisition : marche ou arrêt, et origine de la capture courante.
   *
   * À l'arrêt, l'HORLOGE de la source se fige elle aussi. Sans cela le temps
   * continuerait d'avancer sans qu'aucun échantillon n'arrive : les vues en
   * direct défileraient dans le vide, et les retards afficheraient un
   * vieillissement que rien ne justifie.
   */
  let enMarche = true;
  let arreteA = 0;          // instant du dernier arrêt (horloge figée)
  // La simulation pré-remplit l'historique sur un horizon complet à
  // l'abonnement : l'origine de la première capture est donc le début de ces
  // données, pas l'instant du chargement de la page — sinon le curseur
  // afficherait des temps négatifs, ramenés à zéro, sur les trois quarts du
  // tracé.
  let captureT0 = -CFG.horizonS;
  const now = () => (enMarche ? brut() : arreteA);

  function clampPeriodMs(p) {
    p = parseInt(p, 10);
    if (!isFinite(p) || p <= 0) p = CFG.defaultPeriodMs;
    return Math.min(10000, Math.max(CFG.defaultPeriodMs, p));
  }

  /**
   * @param opts {periodMs?} — période de rafraîchissement (défaut 10 ms).
   * Une souscription supplémentaire avec une période plus courte resserre
   * le flux existant (un seul flux par variable).
   */
  /**
   * Le point réseau simulé suit-il l'horloge de « l'équipement » ?
   * Miroir du réglage « Horodatage » du point (défaut : source). La
   * simulation fabrique alors un horodatage source — l'équipement simulé a
   * une horloge parfaitement à l'heure — pour que le journal téléchargé
   * montre ses deux colonnes de dates comme avec un vrai lien.
   */
  function netSourceTs(addr) {
    const P = DW.protocols;
    if (!P || !P.config || addr[0] !== '@') return false;
    const dot = addr.indexOf('.');
    const l = (P.config.links || []).find((x) => x.id === addr.slice(1, dot));
    const p = l && (l.points || []).find((x) => x.id === addr.slice(dot + 1));
    return !!p && (p.params && p.params.timestamp) !== 'server';
  }
  // Horloge murale de t = 0, figée au chargement (horodatages source simulés).
  const wall0 = Date.now() / 1000 - brut();

  function subscribe(addr, opts) {
    const periodS = clampPeriodMs(opts && opts.periodMs) / 1000;
    let rec = regs.get(addr);
    if (rec) {
      rec.refs++;
      if (periodS < rec.periodS) {
        // Période resserrée : repartir sur la grille de la nouvelle période.
        rec.periodS = periodS;
        rec.nextK = Math.floor(now() / periodS) + 1;
      }
      return rec;
    }
    const meta = DW.resolveMeta(addr);
    if (!meta) return null;
    rec = { meta, gen: makeGen(meta, addr), ts: [], vs: [],
            tss: netSourceTs(addr) ? [] : null, refs: 1, periodS, nextK: 0 };
    // Pré-remplissage de tout l'horizon (les t négatifs sont autorisés)
    // pour que les courbes soient pleines dès l'ajout d'une variable.
    const tNow = now();
    let k = Math.ceil((tNow - CFG.horizonS) / periodS - 1e-9);
    const kEnd = Math.floor(tNow / periodS + 1e-9);
    for (; k <= kEnd; k++) {
      const t = k * periodS;
      rec.ts.push(t); rec.vs.push(rec.gen(t));
      if (rec.tss) rec.tss.push(wall0 + t);
    }
    rec.nextK = kEnd + 1;
    regs.set(addr, rec);
    return rec;
  }

  function unsubscribe(addr) {
    const rec = regs.get(addr);
    if (!rec) return;
    rec.refs--;
    if (rec.refs <= 0) regs.delete(addr);
  }

  /** Instant en deçà duquel l'historique ne doit pas être purgé (vue figée). */
  let holdT = null;

  function tick() {
    if (!enMarche) return;
    const t = now();
    let minT = t - CFG.horizonS;
    if (holdT != null) minT = Math.min(minT, Math.max(holdT, t - CFG.holdMaxS));
    for (const [addr, rec] of regs) {
      // Rattrapage borné : si l'onglet a été suspendu, on saute en avant —
      // en restant sur la grille de la période.
      if (t - rec.nextK * rec.periodS > 2) rec.nextK = Math.ceil(t / rec.periodS);
      const held = forced.has(addr) ? forced.get(addr) : null;
      while (rec.nextK * rec.periodS <= t) {
        const tk = rec.nextK * rec.periodS;
        rec.ts.push(tk);
        rec.vs.push(held != null ? held : rec.gen(tk));
        if (rec.tss) rec.tss.push(wall0 + tk);
        rec.nextK++;
      }
      // Purge de l'historique au-delà de l'horizon
      let cut = 0;
      while (cut < rec.ts.length && rec.ts[cut] < minT) cut++;
      if (cut > 400) {
        rec.ts.splice(0, cut); rec.vs.splice(0, cut);
        if (rec.tss) rec.tss.splice(0, cut);
      }
    }
  }
  setInterval(tick, CFG.defaultPeriodMs);

  DW.sources = DW.sources || {};
  DW.sources.sim = {
    name: 'Simulation locale',
    // Même contrat que source-ws.js : ici tout est simulé, et le nom le dit
    // déjà — la barre d'état n'a donc rien à ajouter (voir app.js).
    controllerSimulated: true,
    links: null,
    /**
     * Retient l'historique jusqu'à cet instant, au-delà de l'horizon ordinaire.
     * Appelé par l'application quand une tuile est figée : ce qu'on regarde ne
     * doit pas être jeté sous nos yeux. `null` rend la purge à l'horizon.
     */
    setHold(t) { holdT = (typeof t === 'number' && isFinite(t)) ? t : null; },

    // ---- Capture (marche / arrêt de l'acquisition) -------------------
    running: () => enMarche,
    captureStart: () => captureT0,

    /** Arrête l'acquisition : l'historique et la vue restent en l'état. */
    stop() {
      if (!enMarche) return;
      arreteA = brut();
      enMarche = false;
    },

    /**
     * Démarre une NOUVELLE capture : l'origine des temps repart de zéro et
     * l'historique précédent est effacé. Sans cet effacement, « temps depuis
     * le début de la capture » n'aurait pas de sens pour les échantillons
     * d'avant.
     */
    start() {
      enMarche = true;
      captureT0 = brut();
      for (const rec of regs.values()) {
        rec.ts.length = 0; rec.vs.length = 0;
        if (rec.tss) rec.tss.length = 0;
        rec.nextK = Math.ceil(captureT0 / rec.periodS - 1e-9);
      }
    },
    defaultPeriodMs: CFG.defaultPeriodMs,
    now,
    subscribe,
    unsubscribe,
    count: () => regs.size,
    latest(addr) {
      const rec = regs.get(addr);
      if (!rec || !rec.ts.length) return null;
      const i = rec.ts.length - 1;
      return { t: rec.ts[i], v: rec.vs[i] };
    },
    /** Valeur ~delta secondes en arrière (pour la tendance). */
    past(addr, delta) {
      const rec = regs.get(addr);
      if (!rec || !rec.ts.length) return null;
      const target = rec.ts[rec.ts.length - 1] - delta;
      for (let i = rec.ts.length - 1; i >= 0; i--) {
        if (rec.ts[i] <= target) return rec.vs[i];
      }
      return rec.vs[0];
    },
    data(addr) {
      const rec = regs.get(addr);
      // tss : horodatages source (secondes UTC), seulement pour les points
      // réseau qui en portent — même contrat que source-ws.js.
      return rec ? { ts: rec.ts, vs: rec.vs, tss: rec.tss || null }
                 : { ts: [], vs: [], tss: null };
    },
    meta(addr) {
      const rec = regs.get(addr);
      return rec ? rec.meta : DW.resolveMeta(addr);
    },

    /**
     * Force (ou relâche, si value == null) la valeur d'une variable.
     * Les points réseau (@lien.point) sont en lecture seule : refusés.
     * @returns {Promise<{ok, error?}>}
     */
    write(addr, value) {
      const p = DW.parseAddr(addr);
      if (!p.ok) return Promise.resolve({ ok: false, error: 'Adresse invalide : ' + addr });
      if (p.family === 'NET') {
        return Promise.resolve({ ok: false, error: 'Point réseau en lecture seule — forçage impossible.' });
      }
      if (value == null) forced.delete(p.addr);
      else forced.set(p.addr, p.kind === 'bit' ? (value >= 0.5 ? 1 : 0) : value);
      // Effet immédiat sur le dernier échantillon (retour visuel instantané)
      const rec = regs.get(p.addr);
      if (rec && value != null && rec.ts.length) rec.vs[rec.vs.length - 1] = forced.get(p.addr);
      return Promise.resolve({ ok: true });
    },
    /** Valeur forcée d'une variable, ou null si elle suit son générateur. */
    forced(addr) {
      const p = DW.parseAddr(addr);
      const key = p.ok ? p.addr : addr;
      return forced.has(key) ? forced.get(key) : null;
    },
  };

  // Source par défaut ; source.js peut lui substituer le flux du serveur
  // de diagnostic avant le démarrage de l'application.
  DW.source = DW.sources.sim;
})();

</script>
<script>
/* Diagweb — source de données WebSocket (serveur de diagnostic).
 *
 * Implémente le même contrat que la simulation (voir docs/SPECS.md §7) :
 * subscribe(addr, {periodMs}) / unsubscribe / latest / past / data / meta /
 * now / count. Le reste de l'application ignore laquelle des deux sources
 * est active.
 *
 * Protocole (trames texte JSON, voir server/src/main.cpp) :
 *   → {"c":"sub","addr":"MB414","periodMs":10} · {"c":"unsub","addr":…}
 *   ← {"e":"hello"|"meta"|"err"|"d", …}
 */
(function () {
  "use strict";
  const DW = (window.DW = window.DW || {});
  const CFG = DW.CONFIG;

  DW.sources = DW.sources || {};

  function createWsSource() {
    const chans = new Map();     // addr -> {meta, ts:[], vs:[], refs, periodMs}
    const forced = new Map();    // adresses forcées (diagnostic) → valeur
    const pendingWrites = new Map();   // adresse → résolveur en attente de confirmation
    let ws = null;
    let skew = 0, haveSkew = false;
    let horizonS = CFG.horizonS;
    let srcName = 'Serveur de diagnostic';
    let retry = 0, retryTimer = null, closed = false;

    const localSec = () => performance.now() / 1000;
    const brut = () => localSec() + skew;

    // Capture : même contrat que la source simulée (voir sim.js). À l'arrêt,
    // les échantillons reçus sont ignorés et l'horloge se fige — le serveur,
    // lui, continue d'émettre : c'est bien une commande de l'AFFICHAGE, pas un
    // ordre donné au contrôleur.
    let enMarche = true;
    let arreteA = 0;
    let captureT0 = 0;
    const now = () => (enMarche ? brut() : arreteA);

    function setStatus(msg, isErr) {
      if (typeof api.onStatus === 'function') api.onStatus(msg, isErr);
    }

    function send(obj) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(obj));
        return true;
      }
      return false;
    }

    function trim(ch) {
      let minT = now() - horizonS;
      if (holdT != null) minT = Math.min(minT, Math.max(holdT, now() - CFG.holdMaxS));
      let cut = 0;
      while (cut < ch.ts.length && ch.ts[cut] < minT) cut++;
      if (cut > 400) {
        ch.ts.splice(0, cut); ch.vs.splice(0, cut);
        if (ch.tss) ch.tss.splice(0, cut);
      }
    }

    // Instant retenu par une vue figée : l'historique qu'elle montre survit à
    // l'horizon ordinaire (voir sim.js, même contrat).
    let holdT = null;

    let onHello = null;   // renseigné par connect() : la session n'est prête
                          // qu'une fois « hello » reçu (nom, horizon, horloge)

    function onMessage(ev) {
      let m;
      try { m = JSON.parse(ev.data); } catch (e) { return; }

      if (m.e === 'hello') {
        // Recalage d'horloge D'ABORD : tout ce qui suit se date dans le temps
        // du serveur. L'inverse donnait une origine de capture prise sur
        // l'horloge locale (≈ 0 au chargement) puis relue sur celle du serveur
        // (son temps de fonctionnement) : une page fraîchement ouverte
        // annonçait une capture aussi vieille que le serveur.
        skew = m.now - localSec();
        haveSkew = true;
        horizonS = m.horizonS || horizonS;
        srcName = m.source || srcName;
        api.name = srcName;
        api.defaultPeriodMs = m.defaultPeriodMs || CFG.defaultPeriodMs;
        // Nature des données, dite par le serveur plutôt que devinée d'un nom :
        // les variables internes peuvent être simulées pendant que les liens
        // réseau acquièrent réellement. La barre d'état énonce les deux.
        api.controllerSimulated = m.controllerSimulated !== false;
        api.links = m.links || null;
        // Redémarrage du serveur : son horloge (t depuis le démarrage) repart
        // près de zéro. Sans purge, la déduplication (t ≤ dernier t) rejetterait
        // tout échantillon neuf et les courbes gèleraient définitivement. Si
        // l'horloge a reculé, on vide l'historique avant de repartir.
        let maxT = -Infinity;
        for (const ch of chans.values()) if (ch.ts.length) maxT = Math.max(maxT, ch.ts[ch.ts.length - 1]);
        if (isFinite(maxT) && m.now < maxT - 1) {
          for (const ch of chans.values()) {
            ch.ts.length = 0; ch.vs.length = 0;
            if (ch.tss) ch.tss.length = 0;
          }
          setStatus('Serveur redémarré — historique réinitialisé.');
        }
        // Origine de la capture = le plus ancien échantillon encore détenu, à
        // défaut l'instant présent (tampon vide : première connexion, ou purge
        // ci-dessus). Une reconnexion garde ainsi l'origine de ce qui est déjà
        // à l'écran, au lieu de remettre les temps affichés à zéro.
        let minT = Infinity;
        for (const ch of chans.values()) if (ch.ts.length) minT = Math.min(minT, ch.ts[0]);
        captureT0 = isFinite(minT) ? minT : brut();
        if (onHello) { const f = onHello; onHello = null; f(); }
        return;
      }
      if (m.e === 'meta') {
        const ch = chans.get(m.addr);
        if (ch) {
          // Les métadonnées du contrôleur font autorité sur celles déduites
          // localement : on complète l'objet en place (déjà référencé par l'UI).
          if (m.label) ch.meta.label = m.label;
          if (m.unit != null) ch.meta.unit = m.unit;
          if (m.kind) ch.meta.kind = m.kind;
          if (m.family) ch.meta.family = m.family;
          ch.meta.known = !!m.known;
        }
        return;
      }
      if (m.e === 'err') {
        setStatus(m.addr ? m.addr + ' : ' + m.msg : m.msg, true);
        return;
      }
      if (m.e === 'set') {
        // Confirmation de forçage : le serveur fait autorité sur l'état forcé.
        if (m.ok) {
          if (m.value == null) forced.delete(m.addr);
          else forced.set(m.addr, m.value);
        }
        const w = pendingWrites.get(m.addr);
        if (w) { pendingWrites.delete(m.addr); w(m.ok ? { ok: true } : { ok: false, error: m.msg || 'refusé' }); }
        return;
      }
      if (m.e === 'd') {
        // Recalage d'horloge lissé (le réseau introduit de la gigue)
        const target = m.now - localSec();
        skew = haveSkew ? skew + (target - skew) * 0.1 : target;
        haveSkew = true;
        // Acquisition arrêtée : le serveur continue d'émettre, l'affichage
        // n'enregistre plus. Le recalage d'horloge, lui, reste fait — sinon
        // la reprise repartirait sur une horloge dérivée.
        if (!enMarche) return;
        for (const addr in m.s) {
          const ch = chans.get(addr);
          if (!ch) continue;
          for (const s of m.s[addr]) {
            const t = s[0];
            if (ch.ts.length && t <= ch.ts[ch.ts.length - 1]) continue;
            // 3ᵉ élément facultatif : horodatage de l'équipement (secondes
            // UTC). Le tableau tss n'existe qu'à partir du premier reçu.
            const tsrc = s[2] || 0;
            if (tsrc && !ch.tss) ch.tss = new Array(ch.ts.length).fill(0);
            ch.ts.push(t); ch.vs.push(s[1]);
            if (ch.tss) ch.tss.push(tsrc);
          }
          trim(ch);
        }
      }
    }

    function connect() {
      return new Promise((resolve, reject) => {
        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        let settled = false;
        try {
          ws = new WebSocket(proto + '//' + location.host + '/ws');
        } catch (e) { reject(e); return; }

        const timer = setTimeout(() => {
          if (!settled) { settled = true; try { ws.close(); } catch (e) { /* déjà fermé */ } reject(new Error('délai dépassé')); }
        }, 4000);

        onHello = () => {
          clearTimeout(timer);
          if (!settled) { settled = true; resolve(api); }
          else setStatus('Flux temps réel rétabli.');
        };
        ws.addEventListener('open', () => {
          retry = 0;
          // Réabonnement après reconnexion
          for (const [addr, ch] of chans) send({ c: 'sub', addr, periodMs: ch.periodMs });
        });
        ws.addEventListener('message', onMessage);
        ws.addEventListener('error', () => { /* traité par close */ });
        ws.addEventListener('close', () => {
          clearTimeout(timer);
          if (!settled) { settled = true; reject(new Error('connexion refusée')); return; }
          if (closed) return;
          setStatus('Flux temps réel interrompu — reconnexion…', true);
          const delay = Math.min(8000, 500 * Math.pow(2, retry++));
          clearTimeout(retryTimer);
          retryTimer = setTimeout(() => { connect().catch(() => {}); }, delay);
        });
      });
    }

    const api = {
      name: srcName,
      defaultPeriodMs: CFG.defaultPeriodMs,
      // Renseignés par « hello » ; par défaut on suppose le pire (simulé),
      // pour ne jamais annoncer du réel qu'on n'a pas constaté.
      controllerSimulated: true,
      links: null,
      onStatus: null,
      now,
      connect,
      isLive: () => !!ws && ws.readyState === WebSocket.OPEN,

      subscribe(addr, opts) {
        const p = DW.parseAddr(addr);
        if (!p.ok) return null;
        const periodMs = Math.max(1, parseInt((opts && opts.periodMs) || api.defaultPeriodMs, 10) || api.defaultPeriodMs);
        let ch = chans.get(p.addr);
        if (ch) {
          ch.refs++;
          if (periodMs < ch.periodMs) { ch.periodMs = periodMs; send({ c: 'sub', addr: p.addr, periodMs }); }
          return ch;
        }
        // Métadonnées provisoires issues du catalogue local ; le serveur les
        // confirme (ou les corrige) par un message « meta ».
        const meta = DW.resolveMeta(p.addr, p);
        if (!meta) return null;
        ch = { meta, ts: [], vs: [], refs: 1, periodMs };
        chans.set(p.addr, ch);
        send({ c: 'sub', addr: p.addr, periodMs });
        return ch;
      },

      unsubscribe(addr) {
        const p = DW.parseAddr(addr);
        const key = p.ok ? p.addr : addr;
        const ch = chans.get(key);
        if (!ch) return;
        if (--ch.refs <= 0) {
          chans.delete(key);
          send({ c: 'unsub', addr: key });
        }
      },

      count: () => chans.size,

      running: () => enMarche,
      captureStart: () => captureT0,
      stop() {
        if (!enMarche) return;
        arreteA = brut();
        enMarche = false;
      },
      start() {
        enMarche = true;
        captureT0 = brut();
        for (const ch of chans.values()) {
          ch.ts.length = 0; ch.vs.length = 0;
          if (ch.tss) ch.tss.length = 0;
        }
      },

      /** Voir sim.js : retient l'historique d'une vue figée au-delà de l'horizon. */
      setHold(t) { holdT = (typeof t === 'number' && isFinite(t)) ? t : null; },

      latest(addr) {
        const ch = chans.get(addr);
        if (!ch || !ch.ts.length) return null;
        const i = ch.ts.length - 1;
        return { t: ch.ts[i], v: ch.vs[i] };
      },

      past(addr, delta) {
        const ch = chans.get(addr);
        if (!ch || !ch.ts.length) return null;
        const target = ch.ts[ch.ts.length - 1] - delta;
        for (let i = ch.ts.length - 1; i >= 0; i--) {
          if (ch.ts[i] <= target) return ch.vs[i];
        }
        return ch.vs[0];
      },

      data(addr) {
        const ch = chans.get(addr);
        // tss : horodatages source (secondes UTC), présent dès qu'un point en
        // a reçu un — même contrat que sim.js.
        return ch ? { ts: ch.ts, vs: ch.vs, tss: ch.tss || null }
                  : { ts: [], vs: [], tss: null };
      },

      meta(addr) {
        const ch = chans.get(addr);
        return ch ? ch.meta : DW.resolveMeta(addr);
      },

      /**
       * Demande au serveur de forcer (ou relâcher) une variable.
       * Les points réseau sont refusés côté serveur (lecture seule).
       * @returns {Promise<{ok, error?}>}
       */
      write(addr, value) {
        const p = DW.parseAddr(addr);
        if (!p.ok) return Promise.resolve({ ok: false, error: 'Adresse invalide : ' + addr });
        if (p.family === 'NET') {
          return Promise.resolve({ ok: false, error: 'Point réseau en lecture seule — forçage impossible.' });
        }
        // release en entier (1) : l'analyseur JSON léger du serveur ne lit
        // pas les booléens (voir server/src/json.hpp).
        const msg = value == null ? { c: 'set', addr: p.addr, release: 1 }
                                  : { c: 'set', addr: p.addr, value };
        if (!send(msg)) return Promise.resolve({ ok: false, error: 'Serveur de diagnostic injoignable.' });
        return new Promise((resolve) => {
          const prev = pendingWrites.get(p.addr);
          if (prev) prev({ ok: false, error: 'remplacé par une nouvelle demande' });
          const timer = setTimeout(() => {
            if (pendingWrites.get(p.addr) === wrap) {
              pendingWrites.delete(p.addr);
              resolve({ ok: false, error: 'pas de confirmation du serveur (délai dépassé)' });
            }
          }, 3000);
          const wrap = (res) => { clearTimeout(timer); resolve(res); };
          pendingWrites.set(p.addr, wrap);
        });
      },
      forced(addr) {
        const p = DW.parseAddr(addr);
        const key = p.ok ? p.addr : addr;
        return forced.has(key) ? forced.get(key) : null;
      },

      close() {
        closed = true;
        clearTimeout(retryTimer);
        if (ws) try { ws.close(); } catch (e) { /* déjà fermé */ }
      },
    };

    return api;
  }

  DW.sources.ws = createWsSource();
})();

</script>
<script>
/* Diagweb — choix de la source de données.
 *
 * Par défaut (« auto ») : si la page est servie par le serveur de diagnostic
 * du contrôleur, on utilise son flux temps réel ; sinon on retombe sur la
 * simulation locale. Forçage possible par l'URL : ?src=ws ou ?src=sim.
 *
 * DW.sourceReady est attendue par app.js avant de construire l'interface,
 * pour que les premiers abonnements partent sur la bonne source.
 */
(function () {
  "use strict";
  const DW = window.DW;

  function wanted() {
    try {
      const v = new URLSearchParams(location.search).get('src');
      return v === 'ws' || v === 'sim' ? v : 'auto';
    } catch (e) {
      return 'auto';
    }
  }

  /** Le serveur de diagnostic répond-il ? (court, pour ne pas retarder le démarrage) */
  async function probe() {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 1200);
    try {
      // Chemin absolu : la page peut être servie depuis /web/ en développement
      // comme depuis la racine sur le contrôleur (cf. store.js).
      const r = await fetch('/api/health', { signal: ctl.signal, cache: 'no-store' });
      if (!r.ok) return false;
      const j = await r.json();
      return j && j.role === 'diag-server';
    } catch (e) {
      return false;
    } finally {
      clearTimeout(timer);
    }
  }

  DW.sourceReady = (async () => {
    const want = wanted();
    const httpish = location.protocol === 'http:' || location.protocol === 'https:';
    DW.sourceMode = 'sim';

    if (want !== 'sim' && httpish && typeof WebSocket !== 'undefined') {
      const available = want === 'ws' ? true : await probe();
      if (available) {
        try {
          await DW.sources.ws.connect();
          DW.source = DW.sources.ws;
          DW.sourceMode = 'ws';
          return DW.source;
        } catch (e) {
          DW.sourceFallbackReason = e && e.message ? e.message : 'connexion impossible';
        }
      }
    }
    DW.source = DW.sources.sim;
    return DW.source;
  })();
})();

</script>
<script>
/* Diagweb — mosaïque : placement et dimensionnement LIBRES des tuiles.
 *
 * Une « tuile » est une carte de l'espace de travail : un tableau numérique ou
 * un graphique. Elle occupe un rectangle de la grille, décrit par quatre
 * entiers — `x` (colonne), `y` (rangée), `w` (largeur en colonnes), `h`
 * (hauteur en rangées) — sur **12 colonnes** et des rangées de hauteur fixe.
 *
 * Pourquoi une grille explicite : la version précédente laissait la grille CSS
 * placer les cartes toute seule (`auto-fit`), avec une largeur exprimée en
 * « colonnes naturelles » dont le nombre changeait avec la fenêtre. On ne
 * pouvait donc que **ranger** les cartes les unes après les autres, jamais en
 * poser une à un endroit choisi, et la même carte n'avait pas la même largeur
 * d'un écran à l'autre. Ici, `x/y/w/h` disent exactement où va la tuile, et
 * douze colonnes fractionnaires font que la disposition se transpose telle
 * quelle d'un écran à l'autre.
 *
 * Deux règles de comportement, celles qu'on attend d'un tableau de bord :
 *   1. **poussée** — une tuile posée sur une autre la repousse vers le bas,
 *      jamais sur le côté (le côté ferait valser toute la ligne) ;
 *   2. **gravité** — les tuiles remontent tant qu'il y a de la place au-dessus,
 *      donc pas de trou involontaire après un déplacement ou une suppression.
 *
 * Sous 700 px (téléphone), la mosaïque s'efface : la grille repasse à une
 * colonne et les tuiles s'empilent dans l'ordre (y, x). Le modèle, lui, est
 * conservé — la disposition d'un poste de travail se retrouve intacte au
 * retour sur grand écran.
 */
(function () {
  "use strict";
  const DW = (window.DW = window.DW || {});

  const COLS = 12;          // largeur de la mosaïque, en colonnes
  const ROW_H = 30;         // hauteur d'une rangée (px) — doit suivre le CSS
  const GAP = 12;           // gouttière (px) — idem
  const MIN_W = 2, MIN_H = 3, MAX_H = 60;

  /** Taille de départ d'une tuile neuve, par nature. */
  const DEFAUTS = {
    chart: { w: 6, h: 9 },   // deux graphiques par rangée sur un grand écran
    table: { w: 12, h: 7 },  // un tableau prend toute la largeur par défaut
  };

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const kindOf = (t) => (t && t.entries ? 'table' : 'chart');

  /** La mosaïque est-elle active ? (désactivée sur téléphone) */
  function actif() {
    try { return window.matchMedia('(min-width: 700px)').matches; }
    catch (e) { return true; }
  }

  /** Deux rectangles se chevauchent-ils ? */
  function hit(a, b) {
    return a.x < b.x + b.w && b.x < a.x + a.w &&
           a.y < b.y + b.h && b.y < a.y + a.h;
  }

  /** Ramène une tuile dans les bornes de la mosaïque. */
  function borner(t) {
    const d = DEFAUTS[kindOf(t)];
    t.w = clamp(Math.round(Number(t.w) || d.w), MIN_W, COLS);
    t.h = clamp(Math.round(Number(t.h) || d.h), MIN_H, MAX_H);
    t.x = clamp(Math.round(Number(t.x) || 0), 0, COLS - t.w);
    t.y = Math.max(0, Math.round(Number(t.y) || 0));
    return t;
  }

  /**
   * Écarte les chevauchements en poussant vers le BAS. `tenue` est la tuile
   * que l'utilisateur a sous la main : elle ne bouge jamais, ce sont les
   * autres qui lui font place — sans quoi la tuile fuirait le curseur.
   */
  function ecarter(tuiles, tenue) {
    for (let passe = 0; passe < 200; passe++) {
      const ordre = [...tuiles].sort((a, b) => a.y - b.y || a.x - b.x);
      let bouge = false;
      for (let i = 0; i < ordre.length; i++) {
        for (let j = i + 1; j < ordre.length; j++) {
          const a = ordre[i], b = ordre[j];
          if (!hit(a, b)) continue;
          const victime = (b === tenue) ? a : b;
          const autre = (victime === b) ? a : b;
          victime.y = autre.y + autre.h;
          bouge = true;
        }
      }
      if (!bouge) return;
    }
  }

  /** Gravité : chaque tuile remonte tant que la place est libre au-dessus. */
  function tasser(tuiles) {
    const ordre = [...tuiles].sort((a, b) => a.y - b.y || a.x - b.x);
    for (const t of ordre) {
      while (t.y > 0) {
        const essai = { x: t.x, y: t.y - 1, w: t.w, h: t.h };
        if (ordre.some((o) => o !== t && hit(o, essai))) break;
        t.y--;
      }
    }
  }

  /** Bornes + poussée + gravité : l'état d'équilibre de la mosaïque. */
  function normaliser(tuiles, tenue) {
    for (const t of tuiles) borner(t);
    ecarter(tuiles, tenue || null);
    tasser(tuiles);
    return tuiles;
  }

  /** Première place libre pour une tuile de w×h (balayage haut → bas). */
  function placeLibre(tuiles, w, h) {
    for (let y = 0; y < 400; y++) {
      for (let x = 0; x <= COLS - w; x++) {
        const essai = { x, y, w, h };
        if (!tuiles.some((o) => hit(o, essai))) return { x, y };
      }
    }
    return { x: 0, y: 0 };
  }

  /** Géométrie de la grille à l'écran : largeur de colonne, hauteur de rangée. */
  function metrique(grid) {
    const rect = grid.getBoundingClientRect();
    const cs = getComputedStyle(grid);
    const gap = parseFloat(cs.columnGap) || GAP;
    const gapY = parseFloat(cs.rowGap) || GAP;
    const rowH = parseFloat(cs.gridAutoRows) || ROW_H;
    return { rect, gap, gapY, rowH, colW: (rect.width - gap * (COLS - 1)) / COLS };
  }

  /**
   * Cellule visée par un point de l'écran. `arrondi` vaut 'proche' pendant un
   * déplacement (la tuile se cale sur la cellule la plus proche) et 'bas'
   * pendant un redimensionnement (on ne veut pas que le bord recule d'une
   * cellule dès qu'on repasse le milieu).
   */
  function cellule(grid, cx, cy, arrondi) {
    const m = metrique(grid);
    const f = arrondi === 'bas' ? Math.floor : Math.round;
    return {
      x: clamp(f((cx - m.rect.left) / (m.colW + m.gap)), 0, COLS - 1),
      y: Math.max(0, f((cy - m.rect.top) / (m.rowH + m.gapY))),
    };
  }

  /** Applique la géométrie d'une tuile à sa carte (variables CSS). */
  function poser(t) {
    const el = t.cardEl;
    if (!el) return;
    el.style.setProperty('--tx', String(t.x + 1));
    el.style.setProperty('--ty', String(t.y + 1));
    el.style.setProperty('--tw', String(t.w));
    el.style.setProperty('--th', String(t.h));
  }

  /**
   * Ordre du DOM aligné sur (y, x) : c'est lui qui donne l'empilement sur
   * téléphone et l'ordre de tabulation. **Seuls les nœuds mal placés bougent** :
   * réinsérer une carte déjà bien placée annulerait la capture du pointeur en
   * cours (le redimensionnement décrochait à la première cellule franchie) et
   * ferait clignoter les canevas.
   */
  function rangerDom(grid, tuiles) {
    const ordre = [...tuiles].sort((a, b) => a.y - b.y || a.x - b.x)
      .map((t) => t.cardEl).filter((el) => el && el.parentElement === grid);
    let apres = null;
    for (let i = ordre.length - 1; i >= 0; i--) {
      const el = ordre[i];
      if (el.nextElementSibling !== apres) grid.insertBefore(el, apres);
      apres = el;
    }
  }

  /**
   * Range la mosaïque et l'applique à l'écran.
   * `opts.dom === false` pendant un geste : seules les variables CSS changent,
   * l'ordre du DOM est resynchronisé à la fin.
   */
  function agencer(grid, tuiles, tenue, opts) {
    if (!grid) return tuiles;
    normaliser(tuiles, tenue);
    for (const t of tuiles) poser(t);
    if (!opts || opts.dom !== false) rangerDom(grid, tuiles);
    return tuiles;
  }

  // ------------------------------------------------------------- fantôme
  /**
   * Rectangle d'atterrissage montré pendant un déplacement. Il vit DANS la
   * grille, placé comme une tuile : ce qu'on voit est exactement la place que
   * la tuile prendra — pas une approximation dessinée par-dessus.
   */
  let ghostEl = null;
  function fantome(grid, t) {
    if (!grid) return;
    if (!ghostEl) {
      ghostEl = document.createElement('div');
      ghostEl.className = 'tile-ghost';
      ghostEl.setAttribute('aria-hidden', 'true');
    }
    ghostEl.style.setProperty('--tx', String(t.x + 1));
    ghostEl.style.setProperty('--ty', String(t.y + 1));
    ghostEl.style.setProperty('--tw', String(t.w));
    ghostEl.style.setProperty('--th', String(t.h));
    if (ghostEl.parentElement !== grid) grid.appendChild(ghostEl);
  }
  function fantomeOff() {
    if (ghostEl && ghostEl.parentElement) ghostEl.remove();
  }

  // -------------------------------------------------- poignée ◢ (taille)
  /**
   * Poignée bas-droite : largeur ET hauteur, par cellules entières. Le
   * réagencement est appliqué à chaque cellule franchie — on voit la place
   * que les voisines cèdent pendant qu'on tire, pas seulement à la fin.
   *
   * @param tuile   objet portant x/y/w/h et cardEl
   * @param ctx     {grid(), tiles(), onChange(), onLive()}
   */
  function poigneeTaille(tuile, ctx) {
    const grip = tuile.cardEl && tuile.cardEl.querySelector('.resize-grip');
    if (!grip) return;
    let g = null;

    grip.addEventListener('pointerdown', (e) => {
      if (e.button > 0 || !actif()) return;
      const grid = ctx.grid();
      if (!grid) return;
      g = { id: e.pointerId, x: e.clientX, y: e.clientY,
            w: tuile.w, h: tuile.h, m: metrique(grid) };
      try { grip.setPointerCapture(e.pointerId); } catch (err) { /* facultatif */ }
      tuile.cardEl.classList.add('resizing');
      e.preventDefault();
      e.stopPropagation();
    });

    grip.addEventListener('pointermove', (e) => {
      if (!g || e.pointerId !== g.id) return;
      const dw = Math.round((e.clientX - g.x) / (g.m.colW + g.m.gap));
      const dh = Math.round((e.clientY - g.y) / (g.m.rowH + g.m.gapY));
      const w = clamp(g.w + dw, MIN_W, COLS - tuile.x);
      const h = clamp(g.h + dh, MIN_H, MAX_H);
      if (w === tuile.w && h === tuile.h) return;
      tuile.w = w; tuile.h = h;
      // dom:false — l'ordre du DOM est figé le temps du geste, sinon la carte
      // serait réinsérée sous la main et la capture du pointeur perdue.
      agencer(ctx.grid(), ctx.tiles(), tuile, { dom: false });
      if (ctx.onLive) ctx.onLive();
      e.preventDefault();
    });

    const fin = (e) => {
      if (!g || (e && e.pointerId !== g.id)) return;
      g = null;
      tuile.cardEl.classList.remove('resizing');
      agencer(ctx.grid(), ctx.tiles(), tuile);   // remise en ordre du DOM
      if (ctx.onChange) ctx.onChange();
    };
    grip.addEventListener('pointerup', fin);
    grip.addEventListener('pointercancel', fin);

    // Double-clic : retour à la taille de départ de cette nature de tuile.
    grip.addEventListener('dblclick', (e) => {
      e.preventDefault();
      const d = DEFAUTS[kindOf(tuile)];
      tuile.w = d.w; tuile.h = d.h;
      agencer(ctx.grid(), ctx.tiles(), tuile);
      if (ctx.onLive) ctx.onLive();
      if (ctx.onChange) ctx.onChange();
    });
  }

  DW.mosaic = {
    COLS, ROW_H, GAP, MIN_W, MIN_H, MAX_H, DEFAUTS,
    actif, hit, borner, normaliser, tasser, placeLibre,
    metrique, cellule, poser, agencer, rangerDom, fantome, fantomeOff, poigneeTaille,
    defaut(kind) { return Object.assign({}, DEFAUTS[kind] || DEFAUTS.chart); },
  };
})();

</script>
<script>
/* Diagweb — moteur de graphiques temps réel (canvas).
 *
 * Multi-échelles : courbes regroupées par unité (ou isolées via « échelle
 * dédiée ») ; chaque groupe possède son axe Y, tracé en alternance
 * gauche/droite, coloré comme sa courbe quand il n'en porte qu'une.
 *
 * Échelles : automatiques et stabilisées (extension immédiate, rétraction
 * différée de 2 s, transitions lissées) ou manuelles (🔒) après un geste
 * sur la règle de l'axe. Retour auto : double-appui sur la règle ou menu ⋮.
 *
 * Gestes — par zone, prévisibles :
 *   tracé   : glisser ↔ = historique · glisser ↕ = déplacer l'échelle
 *             principale · pincement / molette = zoom temporel · appui
 *             bref = curseur épinglé · double-appui = retour Direct ;
 *   règle   : glisser = déplacer cette échelle · molette = zoomer cette
 *             échelle · double-appui = re-automatique ;
 *   légende : menu par courbe (masquer, échelle dédiée, décaler, retirer).
 * Décalage d'une courbe : mode explicite (bandeau) via le menu de sa
 * pastille — glisser verticalement, terminer par OK.
 */
(function () {
  "use strict";
  const DW = window.DW;
  const CFG = DW.CONFIG;

  const MIN_WINDOW_S = 2;
  const MAX_WINDOW_S = 300;
  const SHRINK_DELAY_S = 2;      // hystérésis de rétraction des échelles
  const SHRINK_OCCUPANCY = 0.55; // rétraction si les données occupent < 55 %
  // Anciennes hauteurs préréglées : ne subsistent que pour relire les
  // dispositions enregistrées avant la mosaïque (voir DW.mosaic).
  const HAUTEURS_V2 = { M: 9, L: 12, XL: 15 };

  // ---------- Formatage ------------------------------------------------
  DW.fmtVal = function (v, meta) {
    if (v == null || !isFinite(v)) return '—';
    if (meta && meta.kind === 'bit') return v >= 0.5 ? '1' : '0';
    if (meta && meta.kind === 'word') return String(Math.round(v));
    const a = Math.abs(v);
    if (a >= 1000) return v.toFixed(0);
    if (a >= 100) return v.toFixed(1);
    if (a >= 1) return v.toFixed(2);
    if (a === 0) return '0';
    return v.toFixed(3);
  };
  DW.fmtTick = function (v) {
    const a = Math.abs(v);
    if (a >= 100000) return Math.round(v / 1000) + 'k';
    if (a >= 10000) return (v / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
    if (a >= 100) return String(Math.round(v));
    if (a >= 10) return String(Math.round(v * 10) / 10);
    if (a >= 1) return String(Math.round(v * 100) / 100);
    if (a === 0) return '0';
    return String(Math.round(v * 1000) / 1000);
  };
  function fmtAxisTick(v, step) {
    if (Math.abs(v) >= 10000) {
      const kStep = step / 1000;
      const dec = Math.max(0, -Math.floor(Math.log10(Math.max(kStep, 1e-12))));
      return (v / 1000).toFixed(Math.min(dec, 4)) + 'k';
    }
    const dec = step >= 1 ? 0 : Math.max(0, -Math.floor(Math.log10(Math.max(step, 1e-12))));
    return v.toFixed(Math.min(dec, 6));
  }
  function fmtTimeTick(negS, windowS) {
    if (Math.abs(negS) < 1e-9) return '0';
    const a = Math.abs(negS);
    if (windowS <= 90) return '-' + (a < 10 && a % 1 ? a.toFixed(1) : Math.round(a)) + ' s';
    const m = Math.floor(a / 60), s = Math.round(a % 60);
    return '-' + m + ':' + String(s).padStart(2, '0');
  }
  function fmtWindow(w) {
    if (w < 60) return (w < 10 && w % 1 ? w.toFixed(1) : Math.round(w)) + ' s';
    const m = Math.floor(w / 60), s = Math.round(w % 60);
    return s ? m + ':' + String(s).padStart(2, '0') : m + ' min';
  }
  function niceStep(rough) {
    const pow = Math.pow(10, Math.floor(Math.log10(rough)));
    const f = rough / pow;
    return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * pow;
  }
  const TIME_STEPS = [0.5, 1, 2, 5, 10, 15, 30, 60, 120, 300];
  function niceTimeStep(rough) {
    for (const s of TIME_STEPS) if (s >= rough) return s;
    return 300;
  }
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

  /** Couleur d'une courbe : teinte personnalisée si l'utilisateur en a choisi
   *  une, sinon l'emplacement de palette (qui, lui, suit le thème). */
  function colorOf(s) { return s.color || DW.seriesColor(s.colorIdx); }
  DW.seriesColorOf = colorOf;

  /** Garantit une plage exploitable : span plancher relatif (anti-gel au
   *  zoom extrême et données quasi constantes en arithmétique flottante). */
  function sanitizeRange(min, max) {
    if (!isFinite(min) || !isFinite(max)) { min = 0; max = 1; }
    const scale = Math.max(Math.abs(min), Math.abs(max), 1e-12);
    const minSpan = Math.max(1e-9, scale * 1e-6);
    if (!(max - min >= minSpan)) {
      const c = (min + max) / 2;
      min = c - minSpan / 2;
      max = c + minSpan / 2;
    }
    return { min, max };
  }

  // ---------- Encre du thème (lue depuis les variables CSS) -----------
  let inkCache = null;
  DW.invalidateChartTheme = function () { inkCache = null; };
  function ink() {
    if (inkCache) return inkCache;
    const cs = getComputedStyle(document.documentElement);
    const get = (n, fb) => (cs.getPropertyValue(n) || fb).trim();
    inkCache = {
      ink: get('--ink', '#e6edf5'),
      muted: get('--muted', '#8494a8'),
      faint: get('--faint', '#5b6a7e'),
      line: get('--line', '#26303f'),
      panel: get('--panel', '#141a24'),
      accent: get('--accent', '#2dd4bf'),
    };
    return inkCache;
  }

  const MAX_AXES = 4;

  /**
   * Valeur d'une variable à un INSTANT ABSOLU (tuile figée). `past()` recule
   * d'un délai depuis le dernier échantillon reçu : le repère bouge donc avec
   * les échantillons qui continuent d'arriver, et la valeur affichée sautait
   * d'un cran de temps en temps sous une pause. Ici le repère est le temps.
   */
  DW.valeurA = function (addr, t) {
    const d = DW.source.data(addr);
    if (!d || !d.ts || !d.ts.length) return null;
    let lo = 0, hi = d.ts.length - 1;
    if (d.ts[0] > t) return null;
    while (lo < hi) {
      const m = (lo + hi + 1) >> 1;
      if (d.ts[m] <= t) lo = m; else hi = m - 1;
    }
    return d.vs[lo];
  };

  /** Durée courte et lisible : « 12,4 s », « 3 min 20 s », « 1 h 05 ». */
  DW.fmtDuree = function (s) {
    if (!isFinite(s) || s < 0) s = 0;
    if (s < 60) return (s < 10 ? s.toFixed(1) : Math.round(s)) + ' s';
    if (s < 3600) {
      const m = Math.floor(s / 60);
      return m + ' min ' + String(Math.round(s - m * 60)).padStart(2, '0') + ' s';
    }
    const h = Math.floor(s / 3600);
    return h + ' h ' + String(Math.round((s - h * 3600) / 60)).padStart(2, '0');
  };

  // ---------- Popover partagé (légende & menu ⋮) ----------------------
  let popEl = null, popOwner = null, popAnchor = null;
  // Bascule : un appui sur l'ancre du menu ouvert le ferme sans le rouvrir.
  // N'est armé QUE par cet appui — fermer en choisissant une entrée ne doit
  // pas empêcher de rouvrir le menu juste après.
  let suppressOwner = null, suppressAt = 0;
  let popClosedPointer = -1;   // pointeur ayant fermé un popover (à consommer)
  function closePopover() {
    if (popEl) {
      popEl.remove();
      popEl = null;
      popOwner = null;
      popAnchor = null;
    }
  }
  document.addEventListener('pointerdown', (e) => {
    if (popEl && !popEl.contains(e.target)) {
      const onAnchor = popAnchor && popAnchor.contains(e.target);
      const owner = popOwner;
      closePopover();
      if (onAnchor) { suppressOwner = owner; suppressAt = performance.now(); }
      // Le tap qui ferme un menu ne doit pas démarrer un geste sur le canvas
      else popClosedPointer = e.pointerId;
    }
  }, true);
  // Le marqueur ne vaut que pour l'interaction en cours : la souris réutilise
  // toujours le même pointerId, il ne doit pas contaminer le geste suivant.
  const clearPopClose = () => { popClosedPointer = -1; };
  document.addEventListener('pointerup', clearPopClose, true);
  document.addEventListener('pointercancel', clearPopClose, true);
  /** À appeler au pointerdown du canvas : vrai si ce pointeur vient de fermer un menu. */
  function consumePopClose(pointerId) {
    if (popClosedPointer === pointerId) { popClosedPointer = -1; return true; }
    return false;
  }
  function openPopover(owner, anchorEl, build) {
    // Re-cliquer l'ancre du menu qui vient d'être fermé = bascule (rester fermé)
    if (suppressOwner === owner && performance.now() - suppressAt < 500) {
      suppressOwner = null;
      return;
    }
    suppressOwner = null;
    closePopover();
    popOwner = owner;
    popAnchor = anchorEl;
    popEl = document.createElement('div');
    popEl.className = 'popmenu';
    build((label, fn, cls, title) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.innerHTML = label;
      if (cls) b.classList.add(cls);
      if (title) b.title = title;
      b.addEventListener('click', () => { closePopover(); fn(); });
      popEl.appendChild(b);
      return b;
    }, (node) => { popEl.appendChild(node); return node; });
    document.body.appendChild(popEl);
    const r = anchorEl.getBoundingClientRect();
    const pw = popEl.offsetWidth;
    const mh = popEl.offsetHeight;
    popEl.style.left = Math.max(8, Math.min(r.left, window.innerWidth - pw - 8)) + 'px';
    // Sous l'ancre si la place le permet, sinon au-dessus. Trop haut pour les
    // deux : il DÉFILE, borné au côté le plus large — un menu qui recouvrirait
    // son ancre empêcherait de le refermer par un second appui, et c'est ce
    // qui arrivait sur téléphone dès que le menu s'allongeait.
    const bas = window.innerHeight - r.bottom - 14;
    const haut = r.top - 14;
    let top, maxH;
    if (mh <= bas) { top = r.bottom + 6; maxH = bas; }
    else if (mh <= haut) { top = r.top - mh - 6; maxH = haut; }
    else if (bas >= haut) { top = r.bottom + 6; maxH = bas; }
    else { top = 8; maxH = haut; }
    popEl.style.maxHeight = Math.max(120, maxH) + 'px';
    popEl.style.overflowY = 'auto';
    popEl.style.top = (top + window.scrollY) + 'px';
  }

  /**
   * Menu contextuel réutilisable, ancré sur un bouton. Exposé parce que les
   * tableaux numériques ont le même besoin que les graphiques : un menu ⋮ au
   * même endroit, avec la même mécanique de fermeture.
   */
  DW.popup = function (anchorEl, build) { openPopover(anchorEl, anchorEl, build); };

  // ---------- Classe Chart --------------------------------------------
  let uid = 0;

  class Chart {
    /**
     * @param app  { acquire(addr, periodMs), release(addr), onChange(),
     *               toast(msg), removeChart(chart), refreshTargets() }
     */
    constructor(app, opts) {
      opts = opts || {};
      this.app = app;
      this.id = 'c' + (++uid);
      this.windowS = clamp(opts.windowS || CFG.defaultWindowS, MIN_WINDOW_S, MAX_WINDOW_S);
      this.viewEnd = null;         // null = direct ; sinon temps absolu figé
      this.pinT = null;            // curseur épinglé (temps absolu)
      this.cursor = null;          // curseur transitoire {x} (survol souris)
      this.series = [];            // {addr, meta, colorIdx, axisMode, visible, periodMs, offsetY}
      // Tuile de la mosaïque : colonne, rangée, largeur, hauteur (cf. mosaic.js).
      // C'est le seul modèle de taille — plus de préréglage M/L/XL en parallèle,
      // qui donnait deux vérités pour une même carte.
      const d = DW.mosaic.defaut('chart');
      this.x = opts.x; this.y = opts.y;
      this.w = opts.w || d.w;
      this.h = opts.h || (opts.heightMode ? HAUTEURS_V2[opts.heightMode] : 0) || d.h;
      this.fullscreen = false;
      this.moveSeries = null;      // adresse en cours de décalage (mode explicite)
      this.measureMode = null;     // null | 'val' | 'temps' (vue arrêtée seulement)
      this.measure = null;         // mesure en cours ou posée
      this.axisState = new Map();  // clé de groupe -> état d'échelle
      this.axisNames = Object.assign({}, opts.axisNames);  // clé -> nom donné
      // Ce qu'on lit sur les pastilles : l'adresse (repère de l'automaticien)
      // ou le libellé (repère de l'exploitant). Les deux publics existent,
      // d'où la bascule plutôt qu'un choix imposé.
      this.chipLabel = opts.chipLabel === 'label';
      this._cw = 0; this._ch = 0; this._dpr = 0;
      this._ptrs = new Map();
      this._gesture = null;
      this._plot = null;
      this._bands = [];            // zones des règles d'axes (hit-test)
      this._yFns = {};
      this._lastTap = 0; this._lastTapX = 0; this._lastTapBand = null;

      this.root = document.createElement('section');
      this.root.className = 'card chart-card';
      // Nom commun aux deux natures de tuile (tableau et graphique) : la
      // mosaïque n'a pas à savoir laquelle elle manipule.
      this.cardEl = this.root;
      // Lien inverse carte → graphique : l'état interne (mesure en cours,
      // échelles) devient inspectable depuis le DOM, ce dont les tests et le
      // débogage ont besoin sans exposer de registre global.
      this.root.__dwChart = this;
      this.root.innerHTML =
        '<header class="chart-head">' +
          '<span class="drag-handle" draggable="true" ' +
            'title="Déplacer ce graphique : le glisser où l’on veut dans la page (il se pose ' +
            'à l’emplacement montré et écarte ce qui gêne), sur un onglet, ou dans une autre ' +
            'fenêtre du navigateur">⠿</span>' +
          '<input class="chart-title" maxlength="48" aria-label="Titre du graphique" ' +
            'title="Nom du graphique — cliquez pour le modifier ; il sert aussi de destination d’ajout">' +
          '<span class="lag hide" title="Retard sur le temps réel : la vue et les ' +
            'valeurs affichées sont celles de cet instant passé"></span>' +
          '<div class="chart-tools">' +
            '<button class="iconbtn card-add" type="button" ' +
              'title="Ajouter des courbes à ce graphique : ouvre le catalogue complet, ' +
              'avec filtres et sélection multiple">+</button>' +
            '<select class="chart-window" aria-label="Fenêtre de temps" ' +
              'title="Durée affichée — modifiable aussi par pincement ou molette sur le tracé"></select>' +
            '<button class="iconbtn chart-pause" type="button" ' +
              'title="Figer ce graphique sur l’instant courant, ou revenir au temps réel">⏸</button>' +
            // Mesures : elles n'ont de sens que sur un tracé qui ne bouge plus
            // — sur une vue qui défile, le point d'appui aurait déjà glissé au
            // relâchement. Les boutons apparaissent donc dès que le tracé est
            // immobile : tuile figée, OU acquisition arrêtée (⏹).
            '<button class="iconbtn mes-val hide" type="button" ' +
              'title="Mesurer un écart de VALEUR : glisser verticalement sur le tracé. ' +
              'L’écart porte sur la courbe désignée au point d’appui (à défaut, la ' +
              'première affichée), et sur elle seule.">↕</button>' +
            '<button class="iconbtn mes-t hide" type="button" ' +
              'title="Mesurer un écart de TEMPS : glisser horizontalement sur le tracé, ' +
              'dans un sens ou dans l’autre. Le relevé donne la durée ET la variation ' +
              'signée de chaque courbe affichée sur l’intervalle.">↔</button>' +
            '<button class="iconbtn card-fs" type="button" ' +
              'title="Afficher cette tuile seule sur toute la page, ou revenir à la ' +
              'mosaïque (sortie aussi par Échap)">⛶</button>' +
            '<button class="iconbtn chart-more" type="button" ' +
              'title="Options : dupliquer, échelles automatiques, taille, plein écran, déplacer, fermer">⋮</button>' +
          '</div>' +
        '</header>' +
        '<div class="chart-body">' +
          '<canvas aria-label="Courbes du graphique" ' +
            'title="Glisser ↔ : remonter le temps · glisser ↕ : déplacer l’échelle · ' +
            'pincer ou molette : zoom · appui bref : curseur de mesure · double-appui : retour au direct. ' +
            'Sur une règle d’axe (curseur ↕ sur les bords) : clic pour saisir les bornes exactes ' +
            '— une échelle ou toutes — glisser ou molette pour la régler à la volée, ' +
            'double-clic pour revenir à l’automatique."></canvas>' +
          '<div class="chart-tip hide"></div>' +
          '<button class="chart-live hide" type="button" ' +
            'title="Revenir au temps réel (la vue est figée dans l’historique)">▶ Direct</button>' +
          '<div class="chart-move hide"><span class="mv-txt"></span>' +
            '<button class="btn sm" type="button" title="Terminer le décalage de cette courbe">OK</button></div>' +
          '<div class="chart-hint">Ajoutez une variable via la barre de recherche, cible « ' +
            '<b class="hint-name"></b> ».</div>' +
        '</div>' +
        '<div class="chart-legend" role="list"></div>' +
        '<span class="resize-grip" role="separator" aria-label="Redimensionner le graphique" ' +
          'title="Glisser pour redimensionner ce graphique : ↕ hauteur libre, ↔ largeur en nombre ' +
          'de colonnes de la grille — double-clic pour revenir à la taille automatique"></span>';

      this.titleEl = this.root.querySelector('.chart-title');
      this.titleEl.value = opts.title || 'Graphique';
      this.canvas = this.root.querySelector('canvas');
      this.ctx = this.canvas.getContext('2d');
      this.tipEl = this.root.querySelector('.chart-tip');
      this.hintEl = this.root.querySelector('.chart-hint');
      this.legendEl = this.root.querySelector('.chart-legend');
      this.winSel = this.root.querySelector('.chart-window');
      this.pauseBtn = this.root.querySelector('.chart-pause');
      this.liveBtn = this.root.querySelector('.chart-live');
      this.moveEl = this.root.querySelector('.chart-move');
      this._customOpt = null;

      for (const w of CFG.windows) {
        const o = document.createElement('option');
        o.value = w;
        o.textContent = w < 60 ? w + ' s' : (w / 60) + ' min';
        this.winSel.appendChild(o);
      }
      this.syncWinSel();

      this.root.querySelector('.hint-name').textContent = this.titleEl.value;

      this.titleEl.addEventListener('change', () => {
        this.root.querySelector('.hint-name').textContent = this.title;
        app.onChange();
        app.refreshTargets();
      });
      this.winSel.addEventListener('change', () => {
        const v = parseFloat(this.winSel.value);
        if (isFinite(v)) { this.windowS = v; this.syncWinSel(); app.onChange(); }
      });
      this.pauseBtn.addEventListener('click', () => this.setPaused(this.viewEnd === null));
      this.root.querySelector('.mes-val').addEventListener('click', () =>
        this.setMeasureMode(this.measureMode === 'val' ? null : 'val'));
      this.root.querySelector('.mes-t').addEventListener('click', () =>
        this.setMeasureMode(this.measureMode === 'temps' ? null : 'temps'));
      this.liveBtn.addEventListener('click', () => this.goLive());
      this.root.querySelector('.card-add').addEventListener('click', () => {
        if (DW.openVarPicker) DW.openVarPicker({ kind: 'chart', chart: this });
      });
      this.root.querySelector('.card-fs').addEventListener('click', () =>
        this.setFullscreen(!this.fullscreen));
      this.root.querySelector('.chart-more').addEventListener('click', (e) =>
        this.openChartMenu(e.currentTarget));
      this.moveEl.querySelector('button').addEventListener('click', () => this.endMoveMode());

      // Glisser le graphique (avec sa configuration) vers un autre onglet
      // ou une autre fenêtre du navigateur.
      const handle = this.root.querySelector('.drag-handle');
      handle.addEventListener('dragstart', (e) => {
        if (!DW.dnd) return;
        e.dataTransfer.setDragImage(this.root, 40, 20);
        DW.dnd.startDrag(e, { kind: 'chart', chartId: this.id, chart: this.serialize(),
                              w: this.w, h: this.h },
          () => this.app.removeChart(this));
      });

      // Une fenêtre ouverte prend Escape pour elle (voir app.js) : sans cette
      // garde, fermer une fenêtre depuis un graphique en plein écran ferait
      // les deux d'un coup.
      this._escHandler = (e) => {
        if (e.key !== 'Escape' || !this.fullscreen) return;
        if (document.querySelector('#modalRoot .m-close')) return;
        this.setFullscreen(false);
      };
      document.addEventListener('keydown', this._escHandler);

      this.bindCanvasGestures();
      // Poignée ◢ : largeur ET hauteur, en cellules de la mosaïque, partagée
      // avec les tableaux numériques — même carte, même geste.
      DW.mosaic.poigneeTaille(this, {
        grid: () => this.root.parentElement,
        tiles: () => this.app.tilesOfCard(this.root),
        onChange: () => this.app.onChange(),
      });
      // Un graphique créé alors que l'acquisition est déjà arrêtée doit naître
      // avec ses outils de mesure — l'état de la source ne dépend pas de lui.
      this.syncPauseUi();
    }

    get title() { return this.titleEl.value.trim() || 'Graphique'; }
    get paused() { return this.viewEnd !== null; }

    // ---------- Direct / figé ------------------------------------------
    setPaused(p) {
      this.viewEnd = p ? DW.source.now() : null;
      this.syncPauseUi();
    }
    goLive() {
      this.viewEnd = null;
      this.syncPauseUi();
    }
    /**
     * Vrai quand le tracé ne bouge plus, donc quand une cote posée dessus
     * garde son sens : soit la tuile est figée, soit l'acquisition est arrêtée
     * (⏹). Dans ce second cas le graphique est encore « en direct » — mais
     * l'horloge de la source ne tourne plus et aucun échantillon n'arrive :
     * refuser les mesures là serait refuser de mesurer une capture terminée,
     * qui est justement le moment où l'on mesure.
     */
    get measurable() {
      if (this.viewEnd !== null) return true;
      return !!(DW.source && DW.source.running && !DW.source.running());
    }

    syncPauseUi() {
      const frozen = this.viewEnd !== null;
      const mesurable = this.measurable;
      this.pauseBtn.textContent = frozen ? '▶' : '⏸';
      this.pauseBtn.classList.toggle('on', frozen);
      this.liveBtn.classList.toggle('hide', !frozen);
      for (const sel of ['.mes-val', '.mes-t']) {
        const b = this.root.querySelector(sel);
        if (b) b.classList.toggle('hide', !mesurable);
      }
      // Le tracé se remet à défiler : la mesure posée ne veut plus rien dire,
      // ce qu'elle annotait ayant repris sa course.
      if (!mesurable && (this.measureMode || this.measure)) this.setMeasureMode(null);
      this.majRetard();
    }

    /**
     * Arme (ou désarme) un mode de mesure. Les deux modes s'excluent, et
     * quitter un mode efface la mesure posée : une cote laissée seule sur un
     * tracé qu'on recommence à manipuler serait fausse au premier geste.
     */
    setMeasureMode(mode) {
      this.measureMode = mode || null;
      this.measure = null;
      const bv = this.root.querySelector('.mes-val');
      const bt = this.root.querySelector('.mes-t');
      if (bv) bv.classList.toggle('on', this.measureMode === 'val');
      if (bt) bt.classList.toggle('on', this.measureMode === 'temps');
      this.canvas.style.cursor = this.measureMode === 'val' ? 'ns-resize'
        : this.measureMode === 'temps' ? 'ew-resize' : '';
    }

    /**
     * Courbe la plus proche d'un point du tracé — c'est elle que la mesure de
     * valeur prend pour référence, et son unité qui s'affiche. Choisir par
     * proximité évite d'inventer une notion de « courbe sélectionnée » : on
     * désigne la courbe en appuyant dessus.
     */
    /** Valeur correspondant à une ordonnée écran, sur l'échelle d'une courbe. */
    valeurAuPixel(s, yPx) {
      const pl = this._plot;
      if (!s || !pl) return null;
      const st = this.axisState.get(this.axisKey(s));
      if (!st || !st.cur) return null;
      const { min, max } = st.cur;
      return min + ((pl.mT + pl.ph - yPx) / Math.max(1, pl.ph)) * (max - min);
    }

    /** Ordonnée écran d'une valeur, sur l'échelle d'une courbe. */
    pixelDeValeur(s, v) {
      const pl = this._plot;
      if (!s || !pl || v == null) return null;
      const st = this.axisState.get(this.axisKey(s));
      if (!st || !st.cur) return null;
      const { min, max } = st.cur;
      if (!(max > min)) return null;
      return pl.mT + pl.ph * (1 - (v - min) / (max - min));
    }

    seriesAt(xPx, yPx) {
      const t = this.timeAt(xPx);
      let best = null, bestD = Infinity;
      for (const s of this.series) {
        if (!s.visible) continue;
        const fn = this._yFns[s.addr];
        if (!fn) continue;
        const v = DW.valeurA(s.addr, t);
        if (v == null) continue;
        const d = Math.abs(fn(v) - yPx);
        if (d < bestD) { bestD = d; best = s; }
      }
      return best;
    }

    /** Retard sur le temps réel, affiché dans l'en-tête quand la vue est figée. */
    majRetard() {
      const el = this.root.querySelector('.lag');
      if (!el) return;
      if (this.viewEnd === null) { el.classList.add('hide'); return; }
      el.classList.remove('hide');
      const retard = Math.max(0, DW.source.now() - this.viewEnd);
      el.textContent = '⏱ −' + DW.fmtDuree(retard) +
        (this.horizonAtteint ? ' · historique épuisé' : '');
      el.classList.toggle('lag-fin', !!this.horizonAtteint);
      el.title = this.horizonAtteint
        ? 'Historique épuisé : les données de cet instant ne sont plus conservées, ' +
          'la vue suit donc le plus ancien échantillon disponible.'
        : 'Retard sur le temps réel : la vue et les valeurs affichées sont celles ' +
          'de cet instant passé';
    }

    syncWinSel() {
      const preset = CFG.windows.find((w) => Math.abs(w - this.windowS) < 0.25);
      if (preset) {
        if (this._customOpt) { this._customOpt.remove(); this._customOpt = null; }
        this.winSel.value = String(preset);
      } else {
        if (!this._customOpt) {
          this._customOpt = document.createElement('option');
          this.winSel.appendChild(this._customOpt);
        }
        this._customOpt.value = String(this.windowS);
        this._customOpt.textContent = fmtWindow(this.windowS);
        this.winSel.value = String(this.windowS);
      }
    }

    // ---------- Taille & plein écran ------------------------------------
    /** Retour à la taille de départ d'un graphique (mosaïque). */
    resetSize() {
      const d = DW.mosaic.defaut('chart');
      if (this.w === d.w && this.h === d.h) return;
      this.w = d.w; this.h = d.h;
      this.app.relayout(this.root);
      this.app.onChange();
      this.app.toast('Taille de départ rétablie.');
    }

    setFullscreen(on) {
      this.fullscreen = on;
      this.root.classList.toggle('fs', on);
      document.body.classList.toggle('has-fs', on);
      const b = this.root.querySelector('.card-fs');
      if (b) {
        b.textContent = on ? '⛶' : '⛶';
        b.classList.toggle('on', on);
        b.title = on ? 'Revenir à la mosaïque (Échap)'
                     : 'Afficher cette tuile seule sur toute la page, ou revenir à la ' +
                       'mosaïque (sortie aussi par Échap)';
      }
    }

    openChartMenu(anchor) {
      openPopover(this, anchor, (mk) => {
        mk('Dupliquer ce graphique', () => this.app.duplicateChart(this), null,
          'Créer une copie avec les mêmes courbes, couleurs, échelles et fenêtre de temps, juste après celui-ci');
        mk('Échelles automatiques', () => this.resetAxes(), null,
          'Remettre toutes les échelles de ce graphique en cadrage automatique (annule les réglages manuels 🔒)');
        mk((this.chipLabel ? '✓ ' : '') + 'Légende : description plutôt qu’adresse', () => {
          this.chipLabel = !this.chipLabel;
          this.rebuildLegend();
          this.app.onChange();
        }, null, 'Afficher sur les pastilles la description de la variable (repère de ' +
          'l’exploitant) au lieu de son adresse (repère de l’automaticien)');
        // Tout masquer d'un coup : les pastilles restent, on rallume celles
        // qu'on veut suivre — d'un double-appui.
        if (this.series.length) {
          const visibles = this.series.filter((x) => x.visible).length;
          mk(visibles ? 'Masquer toutes les courbes' : 'Afficher toutes les courbes',
            () => this.setToutesVisibles(!visibles), null,
            visibles
              ? 'Retirer toutes les courbes du tracé sans les supprimer ; les pastilles ' +
                'restent, un double-appui rallume celle qu’on veut suivre'
              : 'Remettre toutes les courbes sur le tracé');
        }
        mk('Taille de départ', () => this.resetSize(), null,
          'Annuler le dimensionnement fait à la poignée ◢ et revenir à la taille de départ ' +
          'd’un graphique (une demi-largeur)');
        mk(this.fullscreen ? 'Quitter le plein écran' : 'Plein écran', () =>
          this.setFullscreen(!this.fullscreen), null,
          'Afficher ce graphique seul sur tout l’écran (sortie par Échap)');
        // Déplacements (indispensables au tact : pas de glisser-déposer HTML5)
        for (const t of this.app.otherTabs()) {
          mk('Déplacer vers l’onglet « ' + DW.escapeHtml(t.name) + ' »', () => {
            this.app.moveChartToTab(this, t);
          }, null, 'Transférer ce graphique et sa configuration dans l’onglet « ' + t.name + ' »');
        }
        mk('Ouvrir dans une nouvelle fenêtre', () => {
          if (this.fullscreen) this.setFullscreen(false);
          DW.dnd.openInNewWindow({ kind: 'chart', chart: this.serialize() },
            () => this.app.removeChart(this));
        }, null, 'Sortir ce graphique dans une fenêtre séparée, à poser sur un autre écran');
        mk('Fermer le graphique', () => {
          if (this.fullscreen) this.setFullscreen(false);
          this.app.removeChart(this);
        }, 'danger', 'Supprimer ce graphique et libérer ses variables');
      });
    }

    resetAxes() {
      for (const st of this.axisState.values()) { st.mode = 'auto'; st.snap = true; }
    }

    // ---------- Échelles verticales : réglage explicite -------------------
    /**
     * Ancre pour le menu d'une règle d'axe. Le popover se positionne sur un
     * élément ; une règle n'en est pas un — elle est peinte dans le canvas. On
     * en pose donc une, de taille nulle, à l'endroit visé.
     */
    axisAnchor(band) {
      if (!this._axisAnchorEl) {
        this._axisAnchorEl = document.createElement('span');
        this._axisAnchorEl.className = 'axis-anchor';
        this.canvas.parentNode.appendChild(this._axisAnchorEl);
      }
      const el = this._axisAnchorEl;
      // Le canvas n'est pas collé au bord de son parent (marge intérieure) :
      // sans son décalage, le menu se poserait à côté de la règle visée.
      el.style.left = (this.canvas.offsetLeft + band.x0) + 'px';
      el.style.top = this.canvas.offsetTop + 'px';
      el.style.width = (band.x1 - band.x0) + 'px';
      el.style.height = this.canvas.clientHeight + 'px';
      return el;
    }

    /** Libellé d'une échelle : son unité, ou les courbes qui la partagent. */
    axisTitle(key) {
      // Un nom donné par l'utilisateur l'emporte : « Températures four »
      // dit ce que l'axe regroupe, là où « Échelle « °C » » ne dit que l'unité.
      if (this.axisNames && this.axisNames[key]) return this.axisNames[key];
      const series = this.series.filter((s) => this.axisKey(s) === key);
      if (!series.length) return 'Échelle';
      const unit = series[0].meta.unit;
      if (key.startsWith('solo:') && series.length === 1) {
        return (series[0].name || series[0].addr) + (unit ? ' (' + unit + ')' : '');
      }
      return unit ? 'Échelle « ' + unit + ' »' : 'Échelle sans unité';
    }

    /**
     * Nom court d'une échelle, pour les entrées de menu : sans l'habillage
     * « Échelle « … » », qui donnerait des guillemets imbriqués.
     */
    axisShort(key) {
      if (this.axisNames && this.axisNames[key]) return this.axisNames[key];
      const series = this.series.filter((s) => this.axisKey(s) === key);
      if (!series.length) return 'échelle';
      const unit = series[0].meta.unit;
      if (key.startsWith('solo:') && series.length === 1) {
        return (series[0].name || series[0].addr);
      }
      return unit || (series[0].name || series[0].addr);
    }

    /** Applique des bornes à une échelle, ou à toutes (réglage groupé). */
    setAxisRange(key, min, max, toutes) {
      const r = sanitizeRange(min, max);
      const cles = toutes ? [...this.axisState.keys()] : [key];
      for (const k of cles) {
        const st = this.axisState.get(k);
        if (!st) continue;
        st.mode = 'manual';
        st.cur = { min: r.min, max: r.max };
      }
      this.app.onChange();
    }

    /**
     * Menu d'une échelle verticale : bornes exactes, retour à l'automatique,
     * et le même réglage appliqué à toutes les échelles du graphique.
     *
     * Le glisser et la molette sur la règle font déjà le réglage à la volée ;
     * ils ne se voient pas et ne permettent pas de saisir une valeur. Ce menu
     * est le chemin explicite, à la souris comme au doigt.
     */
    openAxisMenu(key, anchorEl) {
      const st = this.axisState.get(key);
      if (!st) return;
      openPopover('axis:' + this.id + ':' + key, anchorEl, (mk, add) => {
        const t = document.createElement('div');
        t.className = 'pop-title';
        t.textContent = this.axisTitle(key);
        add(t);

        const form = document.createElement('div');
        form.className = 'pop-range';
        form.innerHTML =
          '<label>Max<input type="number" step="any" class="ax-max" ' +
            'title="Valeur en haut de l’axe"></label>' +
          '<label>Min<input type="number" step="any" class="ax-min" ' +
            'title="Valeur en bas de l’axe"></label>' +
          '<label class="pop-check"><input type="checkbox" class="ax-all" ' +
            'title="Donner ces mêmes bornes à toutes les échelles de ce graphique">' +
            '<span>Toutes les échelles</span></label>' +
          '<button type="button" class="btn sm ax-ok" ' +
            'title="Appliquer ces bornes (l’axe passe en réglage manuel 🔒)">Appliquer</button>';
        const fMin = form.querySelector('.ax-min');
        const fMax = form.querySelector('.ax-max');
        // Quatre chiffres significatifs : de quoi retoucher sans recopier
        // les décimales d'un cadrage automatique.

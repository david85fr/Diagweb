<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Diagweb — diagnostic en ligne des variables et signaux internes d'un contrôleur embarqué : mapping PLC, mots de bus, signaux modèles Simulink (C API).">
<title>Diagweb — Diagnostic contrôleur</title>
<style>
/* Diagweb — styles (mobile-first, thèmes clair/sombre) */

:root {
  --bg: #0b0e14;
  --panel: #141a24;
  --panel-2: #1c2431;
  --line: #26303f;
  --ink: #e6edf5;
  --muted: #8494a8;
  --faint: #5b6a7e;
  --accent: #2dd4bf;
  --accent-dim: #1b8b7e;
  --good: #46d17f;
  --warn: #f5b942;
  --crit: #ff5f56;
  --shadow: 0 1px 0 rgba(255,255,255,.03), 0 12px 32px -18px rgba(0,0,0,.8);
  --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #eef1f5;
    --panel: #ffffff;
    --panel-2: #f4f6f9;
    --line: #dde3ea;
    --ink: #131922;
    --muted: #5a6675;
    --faint: #8b98a8;
    --accent: #0d9488;
    --accent-dim: #14b8a6;
    --good: #12924f;
    --warn: #b7791f;
    --crit: #d64535;
    --shadow: 0 1px 0 rgba(255,255,255,.6), 0 14px 30px -20px rgba(20,30,45,.35);
  }
}
:root[data-theme="dark"] {
  --bg: #0b0e14; --panel: #141a24; --panel-2: #1c2431; --line: #26303f;
  --ink: #e6edf5; --muted: #8494a8; --faint: #5b6a7e;
  --accent: #2dd4bf; --accent-dim: #1b8b7e; --good: #46d17f; --warn: #f5b942; --crit: #ff5f56;
  --shadow: 0 1px 0 rgba(255,255,255,.03), 0 12px 32px -18px rgba(0,0,0,.8);
}
:root[data-theme="light"] {
  --bg: #eef1f5; --panel: #ffffff; --panel-2: #f4f6f9; --line: #dde3ea;
  --ink: #131922; --muted: #5a6675; --faint: #8b98a8;
  --accent: #0d9488; --accent-dim: #14b8a6; --good: #12924f; --warn: #b7791f; --crit: #d64535;
  --shadow: 0 1px 0 rgba(255,255,255,.6), 0 14px 30px -20px rgba(20,30,45,.35);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(1100px 500px at 85% -10%, color-mix(in srgb, var(--accent) 7%, transparent), transparent 60%),
    var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
.wrap { max-width: 2300px; margin: 0 auto; padding: 10px 12px 60px; }
.hide { display: none !important; }
button { font-family: var(--sans); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Barre supérieure ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-areas:
    "tabs icons"
    "search search";
  gap: 8px 10px;
  align-items: center;
  padding: 8px 0 10px;
  margin-bottom: 12px;
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.logo {
  width: 30px; height: 30px; border-radius: 8px; flex: none;
  background: linear-gradient(145deg, var(--accent), var(--accent-dim));
  display: grid; place-items: center;
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent);
}
.logo svg { width: 18px; height: 18px; display: block; }

.topIcons {
  grid-area: icons;
  position: relative;
  display: flex; gap: 6px; align-items: center;
}
.menu-panel {
  position: absolute; top: calc(100% + 6px); right: 0; z-index: 80;
  display: grid; gap: 2px;
  min-width: 230px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: var(--shadow);
  padding: 6px;
}
.menu-panel button {
  display: flex; align-items: center; gap: 6px;
  text-align: left;
  font: 500 13.5px var(--sans);
  color: var(--ink);
  background: none; border: 0; border-radius: 8px;
  padding: 11px 12px;
  cursor: pointer;
}
.menu-panel button:hover:not(:disabled) { background: var(--panel-2); }
.menu-panel button:disabled { color: var(--faint); cursor: default; }

/* Actions liées au contenu de l'onglet actif */
.tabActions {
  display: flex; flex-wrap: wrap; gap: 6px;
  margin-bottom: 12px;
}
.tabActions .btn { font-size: 12.5px; padding: 7px 11px; }

.build-tag {
  font: 10.5px var(--mono);
  color: var(--faint);
  text-align: right;
  line-height: 1.3;
  white-space: nowrap;
  margin-right: 2px;
}

.searchrow {
  position: relative;
  grid-area: search;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto auto;
  gap: 6px;
}
.searchrow .searchbox { grid-column: 1 / -1; }
.searchbox { position: relative; min-width: 0; }
#searchInput {
  width: 100%;
  font: 16px/1.2 var(--mono);
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 9px 12px;
}
#searchInput::placeholder { color: var(--faint); font-family: var(--sans); font-size: 14px; }
#searchInput:focus { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); outline: none; }

.suggest {
  position: absolute; top: calc(100% + 4px); left: 0; z-index: 60;
  width: min(100%, 560px);
  max-height: min(46vh, 380px); overflow-y: auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: var(--shadow);
  padding: 4px;
}
.sug {
  display: grid;
  grid-template-columns: auto auto minmax(0, 1fr) auto;
  gap: 8px; align-items: baseline;
  width: 100%; text-align: left;
  background: none; border: 0; border-radius: 7px;
  padding: 8px 8px; cursor: pointer;
  color: var(--ink);
}
.sug:hover, .sug.sel { background: var(--panel-2); }
.sug-addr { font-family: var(--mono); font-size: 13px; }
.sug-label { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sug-unit { color: var(--faint); font-family: var(--mono); font-size: 11px; }
.sug-filters {
  display: flex; gap: 6px; flex-wrap: wrap;
  padding: 6px 8px 8px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 4px;
}
.fbtn {
  font: 600 11.5px var(--sans);
  color: var(--muted);
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 11px;
  cursor: pointer;
}
.fbtn.on {
  color: #04201d;
  background: linear-gradient(145deg, var(--accent), var(--accent-dim));
  border-color: transparent;
}
.sug-none { padding: 10px; font-size: 12.5px; color: var(--faint); }
.sug-help { padding: 8px 10px 6px; font-size: 11.5px; color: var(--muted); border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.sug-help code { font-family: var(--mono); background: var(--panel-2); border-radius: 4px; padding: 1px 4px; font-size: 11px; }

#targetSel, #periodSel {
  font: 13px var(--sans);
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 0 8px;
  min-height: 38px;
  max-width: 44vw;
}
#targetSel { min-width: 0; }
#periodSel { max-width: 32vw; }

/* ---------- Boutons ---------- */
.btn {
  font-size: 13px; font-weight: 560;
  color: var(--ink); background: var(--panel-2);
  border: 1px solid var(--line); border-radius: 9px;
  padding: 8px 12px; cursor: pointer;
  transition: border-color .15s, background .15s;
  white-space: nowrap;
}
.btn:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
.btn.primary {
  background: linear-gradient(145deg, var(--accent), var(--accent-dim));
  color: #04201d; border-color: transparent; font-weight: 640;
}
.btn.sm { padding: 5px 10px; font-size: 12px; }
.iconbtn {
  width: 34px; height: 34px; flex: none;
  display: inline-grid; place-items: center;
  font-size: 14px; color: var(--muted);
  background: var(--panel-2);
  border: 1px solid var(--line); border-radius: 9px;
  cursor: pointer;
}
.iconbtn:hover { color: var(--ink); border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
.iconbtn.on { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); }

/* ---------- Badges de famille ---------- */
.badge {
  display: inline-block; flex: none;
  font-family: var(--mono); font-size: 10px; font-weight: 700;
  padding: 2px 6px; border-radius: 5px;
  border: 1px solid var(--line);
  color: var(--muted); background: var(--panel-2);
  align-self: center;
}
.badge.fam-I    { color: #3987e5; border-color: color-mix(in srgb, #3987e5 40%, var(--line)); }
.badge.fam-Q    { color: #d95926; border-color: color-mix(in srgb, #d95926 40%, var(--line)); }
.badge.fam-M    { color: #9085e9; border-color: color-mix(in srgb, #9085e9 40%, var(--line)); }
.badge.fam-S    { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.badge.fam-MB   { color: #c98500; border-color: color-mix(in srgb, #c98500 45%, var(--line)); }
.badge.fam-CAPI { color: #199e70; border-color: color-mix(in srgb, #199e70 45%, var(--line)); }

/* ---------- Cartes ---------- */
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 13px;
  box-shadow: var(--shadow);
}
.card > h3, .table-card h3 {
  margin: 0; padding: 12px 14px 8px;
  font-size: 11px; text-transform: uppercase; letter-spacing: .11em;
  color: var(--muted); font-weight: 650;
}
.table-card h3 span { text-transform: none; letter-spacing: 0; color: var(--faint); font-weight: 500; margin-left: 6px; }

/* ---------- Tableau numérique ---------- */
.table-card { margin-bottom: 12px; }
#tableRows { padding: 2px 6px 8px; }
.vrow {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto auto;
  gap: 10px; align-items: center;
  padding: 7px 8px;
  border-radius: 9px;
}
.vrow:nth-child(odd) { background: color-mix(in srgb, var(--panel-2) 55%, transparent); }
.v-id { display: grid; min-width: 0; }
.v-addr { font-family: var(--mono); font-size: 13px; }
.v-label { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.v-val {
  display: flex; align-items: baseline; gap: 6px;
  font-family: var(--mono); font-variant-numeric: tabular-nums;
  justify-content: flex-end;
}
.v-val .val { font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.v-unit { color: var(--faint); font-size: 11px; }
.v-hex { color: var(--faint); font-size: 11px; }
.v-trend { width: 14px; text-align: center; font-size: 12px; }
.v-trend.up { color: var(--good); }
.v-trend.down { color: #d95926; }
.v-trend.flat { color: var(--faint); }
/* Flash : variable immobile depuis ≥ 2 s qui change à nouveau */
@keyframes vrow-flash {
  from { box-shadow: inset 0 0 0 999px color-mix(in srgb, var(--accent) 30%, transparent); }
  to   { box-shadow: inset 0 0 0 999px transparent; }
}
.vrow.vflash { animation: vrow-flash 1.1s ease-out; }

.led {
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--panel-2); border: 1px solid var(--line);
  display: inline-block;
}
.led.on { background: var(--good); border-color: var(--good); box-shadow: 0 0 6px color-mix(in srgb, var(--good) 60%, transparent); }
.v-del {
  width: 28px; height: 28px;
  display: grid; place-items: center;
  color: var(--faint); background: none;
  border: 0; border-radius: 7px; cursor: pointer; font-size: 12px;
}
.v-del:hover { color: var(--crit); background: var(--panel-2); }

/* ---------- Grille de graphiques ---------- */
.charts-grid { display: grid; gap: 12px; grid-template-columns: 1fr; }

.chart-card { display: flex; flex-direction: column; min-width: 0; }
.chart-head {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px 6px;
}
.chart-title {
  flex: 1; min-width: 0;
  font: 600 13.5px var(--sans);
  color: var(--ink);
  background: none; border: 1px solid transparent; border-radius: 7px;
  padding: 5px 8px;
}
.chart-title:hover { border-color: var(--line); }
.chart-title:focus { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); outline: none; background: var(--panel-2); }
.chart-tools { display: flex; gap: 6px; align-items: center; }
.chart-window {
  font: 12px var(--mono);
  color: var(--muted);
  background: var(--panel-2);
  border: 1px solid var(--line); border-radius: 8px;
  height: 34px; padding: 0 6px;
}
.chart-body { position: relative; height: clamp(220px, 32vh, 420px); padding: 0 4px; }
.chart-card.size-L .chart-body { height: clamp(300px, 48vh, 640px); }
.chart-card.size-XL { grid-column: 1 / -1; }
.chart-card.size-XL .chart-body { height: clamp(340px, 56vh, 780px); }

/* Plein écran par graphique */
.chart-card.fs {
  position: fixed; inset: 0; z-index: 140;
  margin: 0; border-radius: 0; border: 0;
  display: flex; flex-direction: column;
}
.chart-card.fs .chart-body { flex: 1 1 0; height: auto; min-height: 0; }
.chart-card.fs .chart-legend { flex: none; }
body.has-fs { overflow: hidden; }

/* Bandeau du mode « décaler une courbe » */
.chart-move {
  position: absolute; left: 50%; top: 8px; transform: translateX(-50%);
  z-index: 26;
  display: flex; align-items: center; gap: 10px;
  background: color-mix(in srgb, var(--panel) 94%, transparent);
  border: 1px solid color-mix(in srgb, var(--warn) 55%, var(--line));
  border-radius: 999px;
  padding: 5px 6px 5px 13px;
  font-size: 12px;
  box-shadow: var(--shadow);
  white-space: nowrap; max-width: 96%;
  overflow: hidden;
}
.chart-move .mv-txt { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.chart-move .btn { flex: none; }
.chip.moving { border-color: var(--warn); }
.chart-body canvas {
  width: 100%; height: 100%;
  display: block;
  touch-action: none;   /* gestes du graphique : zoom, navigation, décalage */
  cursor: crosshair;
}
.chart-live {
  position: absolute; right: 10px; bottom: 28px; z-index: 25;
  font: 640 12px var(--sans);
  color: #04201d;
  background: linear-gradient(145deg, var(--accent), var(--accent-dim));
  border: 0; border-radius: 999px;
  padding: 6px 12px;
  cursor: pointer;
  box-shadow: var(--shadow);
}
.chip-off {
  color: var(--warn);
  font-size: 10px; font-weight: 700;
}
.chart-tip {
  position: absolute; z-index: 30;
  pointer-events: none;
  background: color-mix(in srgb, var(--panel) 94%, transparent);
  border: 1px solid var(--line); border-radius: 8px;
  box-shadow: var(--shadow);
  padding: 6px 8px;
  font-family: var(--mono); font-size: 11px;
  min-width: 130px;
}
.tip-time { color: var(--faint); margin-bottom: 4px; }
.tip-row { display: flex; align-items: center; gap: 6px; padding: 1px 0; }
.tip-row i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.tip-row .tip-addr { color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; }
.tip-row b { font-weight: 600; font-variant-numeric: tabular-nums; }
.chart-hint {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  color: var(--faint); font-size: 12.5px;
  text-align: center; padding: 20px;
  pointer-events: none;
}
.chart-hint b { color: var(--muted); }

.chart-legend {
  display: flex; flex-wrap: wrap; gap: 6px;
  padding: 4px 10px 10px;
  min-height: 18px;
}
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: 11.5px;
  color: var(--ink);
  background: var(--panel-2);
  border: 1px solid var(--line); border-radius: 999px;
  padding: 4px 9px; cursor: pointer;
  max-width: 100%;
}
.chip:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.chip .sw { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.chip-addr { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 34vw; }
.chip-val { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip-axis { color: var(--faint); font-size: 10px; }
.chip.off { opacity: .45; }
.chip.off .sw { background: transparent !important; border: 1.5px solid var(--faint); }

.popmenu {
  position: absolute; z-index: 200;   /* au-dessus du plein écran (140) */
  display: grid; gap: 2px;
  background: var(--panel);
  border: 1px solid var(--line); border-radius: 10px;
  box-shadow: var(--shadow);
  padding: 5px;
  min-width: 190px;
}
.popmenu button {
  text-align: left;
  font-size: 13px; color: var(--ink);
  background: none; border: 0; border-radius: 7px;
  padding: 9px 10px; cursor: pointer;
}
.popmenu button:hover { background: var(--panel-2); }
.popmenu button.danger { color: var(--crit); }

/* ---------- Onglets (dans la barre supérieure, à la place du titre) ---------- */
.tabbar {
  grid-area: tabs;
  display: flex; gap: 8px; align-items: center;
  min-width: 0;
}
.tabs {
  display: flex; gap: 6px;
  flex: 1; min-width: 0;
  overflow-x: auto;
  padding-bottom: 2px;
  -webkit-overflow-scrolling: touch;
}
.tab {
  flex: none;
  display: inline-flex; align-items: center; gap: 7px;
  font: 600 13px var(--sans);
  color: var(--muted);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 7px 9px 7px 12px;
  cursor: pointer;
  max-width: 230px;
}
.tab.on {
  color: var(--ink);
  border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
  background: color-mix(in srgb, var(--accent) 9%, var(--panel));
}
.tab-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tab-name-input {
  font: 600 13px var(--sans);
  width: 120px;
  color: var(--ink);
  background: var(--panel-2);
  border: 1px solid var(--accent);
  border-radius: 6px;
  padding: 2px 6px;
}
.tab-close {
  color: var(--faint);
  font-size: 12px; line-height: 1;
  padding: 3px 4px; border-radius: 5px;
}
.tab-close:hover { color: var(--crit); background: var(--panel-2); }

.recdot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--crit);
  display: inline-block;
  margin-left: 6px;
  animation: recblink 1.6s infinite;
}
@keyframes recblink { 50% { opacity: .3; } }

.tabpane { display: none; }
.tabpane.on { display: block; }

/* ---------- Journal (modal) ---------- */
.log-status {
  font: 12px var(--mono);
  color: var(--muted);
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 9px 11px;
  margin: 10px 0;
  line-height: 1.6;
}
.log-opts { display: grid; gap: 9px; margin: 10px 0 4px; }
.log-opts label { display: flex; gap: 9px; align-items: center; font-size: 13.5px; cursor: pointer; }
.log-opts input[type="radio"] { accent-color: var(--accent); width: 16px; height: 16px; }
.log-opts .opt-note { color: var(--faint); font-size: 11.5px; }

/* ---------- État vide ---------- */
.empty {
  text-align: center;
  padding: 42px 18px;
  border: 1px dashed var(--line); border-radius: 14px;
  background: color-mix(in srgb, var(--panel) 55%, transparent);
  margin-bottom: 12px;
}
.empty h2 { margin: 0 0 8px; font-size: 19px; letter-spacing: -.02em; }
.empty p { margin: 0 auto 6px; color: var(--muted); max-width: 52ch; font-size: 13.5px; }
.empty .cta { margin-top: 18px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

/* ---------- Modal ---------- */
.modal-back {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(4, 8, 14, .55);
  display: grid; place-items: end center;
  padding: 0;
}
.modal {
  width: 100%; max-width: 560px;
  max-height: 88vh; overflow-y: auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px 16px 0 0;
  padding: 14px 16px 22px;
}
.m-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }

}
.m-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.acc-row { margin-top: 4px; }
.acc-btn.on {
  color: #04201d;
  background: linear-gradient(145deg, var(--accent), var(--accent-dim));
  border-color: transparent;
  font-weight: 640;
}
.acc-panel {
  margin-top: 10px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: color-mix(in srgb, var(--panel-2) 55%, transparent);
}

.m-row h4 { margin: 0; font-size: 12.5px; color: var(--muted); font-weight: 600; }

.m-note { font-size: 11.5px; color: var(--faint); margin: 12px 0 0; }

.lay-actions { display: flex; gap: 5px; flex: none; }

.star.on { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); }

/* ---------- Toasts ---------- */
#toasts {
  position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
  z-index: 200;
  display: grid; gap: 8px;
  width: min(94vw, 480px);
  pointer-events: none;
}

<script>
/* Diagweb — analyse et validation des adresses de variables */
(function () {
  "use strict";
  const DW = (window.DW = window.DW || {});

  const FAMILIES = {
    I:    { label: 'Entrée TOR',            kind: 'bit' },
    Q:    { label: 'Sortie TOR',            kind: 'bit' },
    M:    { label: 'Bit mémoire',           kind: 'bit' },
    S:    { label: 'Variable système',      kind: 'bit' },
    MB:   { label: 'Mot de bus (registre)', kind: 'word' },
    CAPI: { label: 'Signal modèle (C API)', kind: 'float' },
  };
  DW.FAMILIES = FAMILIES;

  const HELP = "Formats acceptés : I1.2.3.4, Q14.15, M1.14, S0.4 (bits), " +
               "MB414 (mot de bus), Modele.sous_systeme.signal (C API Simulink, " +
               "premier champ = nom du modèle).";

  /**
   * Analyse une saisie utilisateur.
   * Les familles PLC (I/Q/M/S/MB) sont prioritaires sur les chemins C API ;
   * l'ancien séparateur « / » est toléré et normalisé en « . ».
   * @returns {ok:true, addr, family, kind} | {ok:false, error}
   */
  DW.parseAddr = function (raw) {
    const input = String(raw == null ? '' : raw).trim().replace(/\//g, '.');
    if (!input) return { ok: false, error: 'Saisissez une adresse de variable. ' + HELP };

    // Mot de bus : MB<registre>
    let m = /^mb\s*(\d{1,5})$/i.exec(input);
    if (m) {
      const reg = parseInt(m[1], 10);
      if (reg > 65535) return { ok: false, error: 'Registre hors plage : MB0 à MB65535.' };
      return { ok: true, addr: 'MB' + reg, family: 'MB', kind: 'word' };
    }

    // Bits PLC : I / Q / M / S suivi de 1 à 4 niveaux numériques
    m = /^([iqms])\s*(\d{1,4}(?:\.\d{1,4}){0,3})$/i.exec(input);
    if (m) {
      const family = m[1].toUpperCase();
      return { ok: true, addr: family + m[2], family, kind: 'bit' };
    }

    // Signal C API : Modele.sous_systeme.signal — segments identifiants
    // séparés par des points, au moins deux (modèle + signal).
    m = /^[A-Za-z_][A-Za-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*)+$/.exec(input);
    if (m) return { ok: true, addr: input, family: 'CAPI', kind: 'float' };

    // Diagnostics ciblés pour les erreurs fréquentes
    if (/^[iqms]/i.test(input)) {
      return { ok: false, error: 'Adresse ' + input[0].toUpperCase() + '… incomplète ou mal formée. Exemple : ' +
        (input[0].toUpperCase() === 'I' ? 'I1.2.3.4' : input[0].toUpperCase() + '1.4') + '.' };
    }
    return { ok: false, error: 'Format non reconnu pour « ' + input + ' ». ' + HELP };
  };

  /** Métadonnées d'une variable : catalogue si connue, sinon générées. */
  DW.resolveMeta = function (addr, parsed) {
    const p = parsed || DW.parseAddr(addr);
    if (!p.ok) return null;
    const known = DW.CATALOG_INDEX.get(p.addr.toUpperCase());
    if (known) return Object.assign({ family: p.family, known: true }, known);
    return {
      addr: p.addr,
      family: p.family,
      kind: p.kind,
      unit: '',
      label: FAMILIES[p.family].label + ' (hors catalogue)',
      known: false,
      sim: null,
    };
  };
})();

</script>
<script>
/* Diagweb — source de données simulée.
 *
 * Implémente le contrat DataSource (voir docs/SPECS.md §7) : le back-end
 * réel (WebSocket vers le contrôleur) devra exposer la même interface.
 */
(function () {
  "use strict";
  const DW = window.DW;
  const CFG = DW.CONFIG;

  // --- PRNG déterministe par adresse (comportement stable entre rechargements)
  function hash32(s) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // --- Générateurs -----------------------------------------------------
  function makeGen(meta, addr) {
    const rnd = mulberry32(hash32(addr));
    const phase = rnd() * 1000;
    let sim = meta.sim;
    if (!sim) sim = defaultSim(meta.kind, rnd);

    switch (sim.type) {
      case 'sine': {
        const round = meta.kind === 'word';
        return (t) => {
          let v = sim.base + sim.amp * Math.sin((t + phase) * 2 * Math.PI / sim.period) +
                  (sim.noise || 0) * (rnd() - 0.5) * 2;
          if (round) v = Math.max(0, Math.min(65535, Math.round(v)));
          return v;
        };
      }
      case 'walk': {
        let v = sim.base;
        return () => {
          v += (rnd() - 0.5) * 2 * sim.step + (sim.drift || 0);
          if (v < sim.min) v = sim.min + (sim.min - v);
          if (v > sim.max) v = sim.max - (v - sim.max);
          v = Math.max(sim.min, Math.min(sim.max, v));
          return v;
        };
      }
      case 'steps': {
        let cur = sim.values[Math.floor(rnd() * sim.values.length)];
        let nextAt = null;   // initialisé au premier appel (le pré-remplissage part de t négatif)
        const round = meta.kind === 'word';
        return (t) => {
          if (nextAt === null) nextAt = t + sim.period * (0.5 + rnd());
          if (t >= nextAt) {
            cur = sim.values[Math.floor(rnd() * sim.values.length)];
            nextAt = t + sim.period * (0.5 + rnd());
          }
          let v = cur + (sim.noise || 0) * (rnd() - 0.5) * 2;
          return round ? Math.round(v) : v;
        };
      }
      case 'square':
        return (t) => (((t + phase) % sim.period) < sim.period * sim.duty ? 1 : 0);
      case 'bit': {
        // Chaîne de Markov : temps de séjour moyens t0 (état 0) et t1 (état 1)
        let v = rnd() < sim.t1 / (sim.t0 + sim.t1) ? 1 : 0;
        let flipAt = null;   // initialisé au premier appel (t peut être négatif)
        return (t) => {
          if (flipAt === null) flipAt = t + (v ? sim.t1 : sim.t0) * (0.3 + rnd() * 1.4);
          if (t >= flipAt) {
            v = v ? 0 : 1;
            flipAt = t + (v ? sim.t1 : sim.t0) * (0.3 + rnd() * 1.4);
          }
          return v;
        };
      }
      case 'counter': {
        return (t) => ((Math.round(sim.rate * t) % 65536) + 65536) % 65536;
      }
      case 'jitter': {
        return () => {
          let v = sim.base + (rnd() - 0.5) * 2 * sim.noise;
          if (rnd() < sim.spikeP) v += sim.spikeAmp * rnd();
          return v;
        };
      }
      default:
        return () => 0;
    }
  }

  function defaultSim(kind, rnd) {
    if (kind === 'bit') return { type: 'bit', t0: 4 + rnd() * 30, t1: 4 + rnd() * 30 };
    if (kind === 'word') {
      const base = Math.round(500 + rnd() * 40000);
      return { type: 'sine', base, amp: base * 0.06 + 20, period: 8 + rnd() * 60, noise: 25 };
    }
    const base = Math.round((rnd() * 200 - 40) * 10) / 10;
    return { type: 'sine', base, amp: 2 + rnd() * 25, period: 8 + rnd() * 50, noise: 0.4 };
  }

  // --- Registre des abonnements ---------------------------------------
  // addr -> { meta, gen, ts:[], vs:[], refs, periodS, nextT }
  const regs = new Map();
  const t0 = performance.now() / 1000;
  const now = () => performance.now() / 1000 - t0;

  function clampPeriodMs(p) {
    p = parseInt(p, 10);
    if (!isFinite(p) || p <= 0) p = CFG.defaultPeriodMs;
    return Math.min(10000, Math.max(CFG.defaultPeriodMs, p));
  }

  /**
   * @param opts {periodMs?} — période de rafraîchissement (défaut 10 ms).
   * Une souscription supplémentaire avec une période plus courte resserre
   * le flux existant (un seul flux par variable).
   */
  function subscribe(addr, opts) {
    const periodS = clampPeriodMs(opts && opts.periodMs) / 1000;
    let rec = regs.get(addr);
    if (rec) {
      rec.refs++;
      if (periodS < rec.periodS) rec.periodS = periodS;
      return rec;
    }
    const meta = DW.resolveMeta(addr);
    if (!meta) return null;
    rec = { meta, gen: makeGen(meta, addr), ts: [], vs: [], refs: 1, periodS, nextT: 0 };
    // Pré-remplissage de tout l'horizon (les t négatifs sont autorisés)
    // pour que les courbes soient pleines dès l'ajout d'une variable.
    const tNow = now();
    for (let t = tNow - CFG.horizonS; t <= tNow; t += periodS) {
      rec.ts.push(t); rec.vs.push(rec.gen(t));
    }
    rec.nextT = tNow + periodS;
    regs.set(addr, rec);
    return rec;
  }

  function unsubscribe(addr) {
    const rec = regs.get(addr);
    if (!rec) return;
    rec.refs--;
    if (rec.refs <= 0) regs.delete(addr);
  }

  function tick() {
    const t = now();
    const minT = t - CFG.horizonS;
    for (const rec of regs.values()) {
      // Rattrapage borné : si l'onglet a été suspendu, on saute en avant.
      if (t - rec.nextT > 2) rec.nextT = t;
      while (rec.nextT <= t) {
        rec.ts.push(rec.nextT);
        rec.vs.push(rec.gen(rec.nextT));
        rec.nextT += rec.periodS;
      }
      // Purge de l'historique au-delà de l'horizon
      let cut = 0;
      while (cut < rec.ts.length && rec.ts[cut] < minT) cut++;
      if (cut > 400) { rec.ts.splice(0, cut); rec.vs.splice(0, cut); }
    }
  }
  setInterval(tick, CFG.defaultPeriodMs);

  DW.sources = DW.sources || {};
  DW.sources.sim = {
    name: 'Simulation locale',
    defaultPeriodMs: CFG.defaultPeriodMs,
    now,
    subscribe,
    unsubscribe,
    count: () => regs.size,
    latest(addr) {
      const rec = regs.get(addr);
      if (!rec || !rec.ts.length) return null;
      const i = rec.ts.length - 1;
      return { t: rec.ts[i], v: rec.vs[i] };
    },
    /** Valeur ~delta secondes en arrière (pour la tendance). */
    past(addr, delta) {
      const rec = regs.get(addr);
      if (!rec || !rec.ts.length) return null;
      const target = rec.ts[rec.ts.length - 1] - delta;
      for (let i = rec.ts.length - 1; i >= 0; i--) {
        if (rec.ts[i] <= target) return rec.vs[i];
      }
      return rec.vs[0];
    },
    data(addr) {
      const rec = regs.get(addr);
      return rec ? { ts: rec.ts, vs: rec.vs } : { ts: [], vs: [] };
    },
    meta(addr) {
      const rec = regs.get(addr);
      return rec ? rec.meta : DW.resolveMeta(addr);
    },
  };

  // Source par défaut ; source.js peut lui substituer le flux du serveur
  // de diagnostic avant le démarrage de l'application.
  DW.source = DW.sources.sim;
})();

</script>
<script>
/* Diagweb — source de données WebSocket (serveur de diagnostic).
 *
 * Implémente le même contrat que la simulation (voir docs/SPECS.md §7) :
 * subscribe(addr, {periodMs}) / unsubscribe / latest / past / data / meta /
 * now / count. Le reste de l'application ignore laquelle des deux sources
 * est active.
 *
 * Protocole (trames texte JSON, voir server/src/main.cpp) :
 *   → {"c":"sub","addr":"MB414","periodMs":10} · {"c":"unsub","addr":…}
 *   ← {"e":"hello"|"meta"|"err"|"d", …}
 */
(function () {
  "use strict";
  const DW = (window.DW = window.DW || {});
  const CFG = DW.CONFIG;

  DW.sources = DW.sources || {};

  function createWsSource() {
    const chans = new Map();     // addr -> {meta, ts:[], vs:[], refs, periodMs}
    let ws = null;
    let skew = 0, haveSkew = false;
    let horizonS = CFG.horizonS;
    let srcName = 'Serveur de diagnostic';
    let retry = 0, retryTimer = null, closed = false;

    const localSec = () => performance.now() / 1000;
    const now = () => localSec() + skew;

    function setStatus(msg, isErr) {
      if (typeof api.onStatus === 'function') api.onStatus(msg, isErr);
    }

    function send(obj) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(obj));
        return true;
      }
      return false;
    }

    function trim(ch) {
      const minT = now() - horizonS;
      let cut = 0;
      while (cut < ch.ts.length && ch.ts[cut] < minT) cut++;
      if (cut > 400) { ch.ts.splice(0, cut); ch.vs.splice(0, cut); }
    }

    let onHello = null;   // renseigné par connect() : la session n'est prête
                          // qu'une fois « hello » reçu (nom, horizon, horloge)

    function onMessage(ev) {
      let m;
      try { m = JSON.parse(ev.data); } catch (e) { return; }

      if (m.e === 'hello') {
        horizonS = m.horizonS || horizonS;
        srcName = m.source || srcName;
        api.name = srcName;
        api.defaultPeriodMs = m.defaultPeriodMs || CFG.defaultPeriodMs;
        skew = m.now - localSec();
        haveSkew = true;
        if (onHello) { const f = onHello; onHello = null; f(); }
        return;
      }
      if (m.e === 'meta') {
        const ch = chans.get(m.addr);
        if (ch) {
          // Les métadonnées du contrôleur font autorité sur celles déduites
          // localement : on complète l'objet en place (déjà référencé par l'UI).
          if (m.label) ch.meta.label = m.label;
          if (m.unit != null) ch.meta.unit = m.unit;
          if (m.kind) ch.meta.kind = m.kind;
          if (m.family) ch.meta.family = m.family;
          ch.meta.known = !!m.known;
        }
        return;
      }
      if (m.e === 'err') {
        setStatus(m.addr ? m.addr + ' : ' + m.msg : m.msg, true);
        return;
      }
      if (m.e === 'd') {
        // Recalage d'horloge lissé (le réseau introduit de la gigue)
        const target = m.now - localSec();
        skew = haveSkew ? skew + (target - skew) * 0.1 : target;
        haveSkew = true;
        for (const addr in m.s) {
          const ch = chans.get(addr);
          if (!ch) continue;
          for (const [t, v] of m.s[addr]) {
            if (ch.ts.length && t <= ch.ts[ch.ts.length - 1]) continue;
            ch.ts.push(t); ch.vs.push(v);
          }
          trim(ch);
        }
      }
    }

    function connect() {
      return new Promise((resolve, reject) => {
        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        let settled = false;
        try {
          ws = new WebSocket(proto + '//' + location.host + '/ws');
        } catch (e) { reject(e); return; }

        const timer = setTimeout(() => {
          if (!settled) { settled = true; try { ws.close(); } catch (e) { /* déjà fermé */ } reject(new Error('délai dépassé')); }
        }, 4000);

        onHello = () => {
          clearTimeout(timer);
          if (!settled) { settled = true; resolve(api); }
          else setStatus('Flux temps réel rétabli.');
        };
        ws.addEventListener('open', () => {
          retry = 0;
          // Réabonnement après reconnexion
          for (const [addr, ch] of chans) send({ c: 'sub', addr, periodMs: ch.periodMs });
        });
        ws.addEventListener('message', onMessage);
        ws.addEventListener('error', () => { /* traité par close */ });
        ws.addEventListener('close', () => {
          clearTimeout(timer);
          if (!settled) { settled = true; reject(new Error('connexion refusée')); return; }
          if (closed) return;
          setStatus('Flux temps réel interrompu — reconnexion…', true);
          const delay = Math.min(8000, 500 * Math.pow(2, retry++));
          clearTimeout(retryTimer);
          retryTimer = setTimeout(() => { connect().catch(() => {}); }, delay);
        });
      });
    }

    const api = {
      name: srcName,
      defaultPeriodMs: CFG.defaultPeriodMs,
      onStatus: null,
      now,
      connect,
      isLive: () => !!ws && ws.readyState === WebSocket.OPEN,

      subscribe(addr, opts) {
        const p = DW.parseAddr(addr);
        if (!p.ok) return null;
        const periodMs = Math.max(1, parseInt((opts && opts.periodMs) || api.defaultPeriodMs, 10) || api.defaultPeriodMs);
        let ch = chans.get(p.addr);
        if (ch) {
          ch.refs++;
          if (periodMs < ch.periodMs) { ch.periodMs = periodMs; send({ c: 'sub', addr: p.addr, periodMs }); }
          return ch;
        }
        // Métadonnées provisoires issues du catalogue local ; le serveur les
        // confirme (ou les corrige) par un message « meta ».
        const meta = DW.resolveMeta(p.addr, p);
        if (!meta) return null;
        ch = { meta, ts: [], vs: [], refs: 1, periodMs };
        chans.set(p.addr, ch);
        send({ c: 'sub', addr: p.addr, periodMs });
        return ch;
      },

      unsubscribe(addr) {
        const p = DW.parseAddr(addr);
        const key = p.ok ? p.addr : addr;
        const ch = chans.get(key);
        if (!ch) return;
        if (--ch.refs <= 0) {
          chans.delete(key);
          send({ c: 'unsub', addr: key });
        }
      },

      count: () => chans.size,

      latest(addr) {
        const ch = chans.get(addr);
        if (!ch || !ch.ts.length) return null;
        const i = ch.ts.length - 1;
        return { t: ch.ts[i], v: ch.vs[i] };
      },

      past(addr, delta) {
        const ch = chans.get(addr);
        if (!ch || !ch.ts.length) return null;
        const target = ch.ts[ch.ts.length - 1] - delta;
        for (let i = ch.ts.length - 1; i >= 0; i--) {
          if (ch.ts[i] <= target) return ch.vs[i];
        }
        return ch.vs[0];
      },

      data(addr) {
        const ch = chans.get(addr);
        return ch ? { ts: ch.ts, vs: ch.vs } : { ts: [], vs: [] };
      },

      meta(addr) {
        const ch = chans.get(addr);
        return ch ? ch.meta : DW.resolveMeta(addr);
      },

      close() {
        closed = true;
        clearTimeout(retryTimer);
        if (ws) try { ws.close(); } catch (e) { /* déjà fermé */ }
      },
    };

    return api;
  }

  DW.sources.ws = createWsSource();
})();

</script>
<script>
/* Diagweb — choix de la source de données.
 *
 * Par défaut (« auto ») : si la page est servie par le serveur de diagnostic
 * du contrôleur, on utilise son flux temps réel ; sinon on retombe sur la
 * simulation locale. Forçage possible par l'URL : ?src=ws ou ?src=sim.
 *
 * DW.sourceReady est attendue par app.js avant de construire l'interface,
 * pour que les premiers abonnements partent sur la bonne source.
 */
(function () {
  "use strict";
  const DW = window.DW;

  function wanted() {
    try {
      const v = new URLSearchParams(location.search).get('src');
      return v === 'ws' || v === 'sim' ? v : 'auto';
    } catch (e) {
      return 'auto';
    }
  }

  /** Le serveur de diagnostic répond-il ? (court, pour ne pas retarder le démarrage) */
  async function probe() {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 1200);
    try {
      // Chemin absolu : la page peut être servie depuis /web/ en développement
      // comme depuis la racine sur le contrôleur (cf. store.js).
      const r = await fetch('/api/health', { signal: ctl.signal, cache: 'no-store' });
      if (!r.ok) return false;
      const j = await r.json();
      return j && j.role === 'diag-server';
    } catch (e) {
      return false;
    } finally {
      clearTimeout(timer);
    }
  }

  DW.sourceReady = (async () => {
    const want = wanted();
    const httpish = location.protocol === 'http:' || location.protocol === 'https:';
    DW.sourceMode = 'sim';

    if (want !== 'sim' && httpish && typeof WebSocket !== 'undefined') {
      const available = want === 'ws' ? true : await probe();
      if (available) {
        try {
          await DW.sources.ws.connect();
          DW.source = DW.sources.ws;
          DW.sourceMode = 'ws';
          return DW.source;
        } catch (e) {
          DW.sourceFallbackReason = e && e.message ? e.message : 'connexion impossible';
        }
      }
    }
    DW.source = DW.sources.sim;
    return DW.source;
  })();
})();

</script>
<script>
/* Diagweb — moteur de graphiques temps réel (canvas).
 *
 * Multi-échelles : courbes regroupées par unité (ou isolées via « échelle
 * dédiée ») ; chaque groupe possède son axe Y, tracé en alternance
 * gauche/droite, coloré comme sa courbe quand il n'en porte qu'une.
 *
 * Échelles : automatiques et stabilisées (extension immédiate, rétraction
 * différée de 2 s, transitions lissées) ou manuelles (🔒) après un geste
 * sur la règle de l'axe. Retour auto : double-appui sur la règle ou menu ⋮.
 *
 * Gestes — par zone, prévisibles :
 *   tracé   : glisser ↔ = historique · glisser ↕ = déplacer l'échelle
 *             principale · pincement / molette = zoom temporel · appui
 *             bref = curseur épinglé · double-appui = retour Direct ;
 *   règle   : glisser = déplacer cette échelle · molette = zoomer cette
 *             échelle · double-appui = re-automatique ;
 *   légende : menu par courbe (masquer, échelle dédiée, décaler, retirer).
 * Décalage d'une courbe : mode explicite (bandeau) via le menu de sa
 * pastille — glisser verticalement, terminer par OK.
 */
(function () {
  "use strict";
  const DW = window.DW;
  const CFG = DW.CONFIG;

  const MIN_WINDOW_S = 2;
  const MAX_WINDOW_S = 300;
  const SHRINK_DELAY_S = 2;      // hystérésis de rétraction des échelles
  const SHRINK_OCCUPANCY = 0.55; // rétraction si les données occupent < 55 %
  const HEIGHT_MODES = ['M', 'L', 'XL'];

  // ---------- Formatage ------------------------------------------------
  DW.fmtVal = function (v, meta) {
    if (v == null || !isFinite(v)) return '—';
    if (meta && meta.kind === 'bit') return v >= 0.5 ? '1' : '0';
    if (meta && meta.kind === 'word') return String(Math.round(v));
    const a = Math.abs(v);
    if (a >= 1000) return v.toFixed(0);
    if (a >= 100) return v.toFixed(1);
    if (a >= 1) return v.toFixed(2);
    if (a === 0) return '0';
    return v.toFixed(3);
  };
  DW.fmtTick = function (v) {
    const a = Math.abs(v);
    if (a >= 100000) return Math.round(v / 1000) + 'k';
    if (a >= 10000) return (v / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
    if (a >= 100) return String(Math.round(v));
    if (a >= 10) return String(Math.round(v * 10) / 10);
    if (a >= 1) return String(Math.round(v * 100) / 100);
    if (a === 0) return '0';
    return String(Math.round(v * 1000) / 1000);
  };
  function fmtAxisTick(v, step) {
    if (Math.abs(v) >= 10000) {
      const kStep = step / 1000;
      const dec = Math.max(0, -Math.floor(Math.log10(Math.max(kStep, 1e-12))));
      return (v / 1000).toFixed(Math.min(dec, 4)) + 'k';
    }
    const dec = step >= 1 ? 0 : Math.max(0, -Math.floor(Math.log10(Math.max(step, 1e-12))));
    return v.toFixed(Math.min(dec, 6));
  }
  function fmtTimeTick(negS, windowS) {
    if (Math.abs(negS) < 1e-9) return '0';
    const a = Math.abs(negS);
    if (windowS <= 90) return '-' + (a < 10 && a % 1 ? a.toFixed(1) : Math.round(a)) + ' s';
    const m = Math.floor(a / 60), s = Math.round(a % 60);
    return '-' + m + ':' + String(s).padStart(2, '0');
  }
  function fmtWindow(w) {
    if (w < 60) return (w < 10 && w % 1 ? w.toFixed(1) : Math.round(w)) + ' s';
    const m = Math.floor(w / 60), s = Math.round(w % 60);
    return s ? m + ':' + String(s).padStart(2, '0') : m + ' min';
  }
  function niceStep(rough) {
    const pow = Math.pow(10, Math.floor(Math.log10(rough)));
    const f = rough / pow;
    return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * pow;
  }
  const TIME_STEPS = [0.5, 1, 2, 5, 10, 15, 30, 60, 120, 300];
  function niceTimeStep(rough) {
    for (const s of TIME_STEPS) if (s >= rough) return s;
    return 300;
  }
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

  /** Garantit une plage exploitable : span plancher relatif (anti-gel au
   *  zoom extrême et données quasi constantes en arithmétique flottante). */
  function sanitizeRange(min, max) {
    if (!isFinite(min) || !isFinite(max)) { min = 0; max = 1; }
    const scale = Math.max(Math.abs(min), Math.abs(max), 1e-12);
    const minSpan = Math.max(1e-9, scale * 1e-6);
    if (!(max - min >= minSpan)) {
      const c = (min + max) / 2;
      min = c - minSpan / 2;
      max = c + minSpan / 2;
    }
    return { min, max };
  }

  // ---------- Encre du thème (lue depuis les variables CSS) -----------
  let inkCache = null;
  DW.invalidateChartTheme = function () { inkCache = null; };
  function ink() {
    if (inkCache) return inkCache;
    const cs = getComputedStyle(document.documentElement);
    const get = (n, fb) => (cs.getPropertyValue(n) || fb).trim();
    inkCache = {
      ink: get('--ink', '#e6edf5'),
      muted: get('--muted', '#8494a8'),
      faint: get('--faint', '#5b6a7e'),
      line: get('--line', '#26303f'),
      panel: get('--panel', '#141a24'),
      accent: get('--accent', '#2dd4bf'),
    };
    return inkCache;
  }

  const MAX_AXES = 4;

  // ---------- Popover partagé (légende & menu ⋮) ----------------------
  let popEl = null, popOwner = null, popAnchor = null;
  // Bascule : un appui sur l'ancre du menu ouvert le ferme sans le rouvrir.
  // N'est armé QUE par cet appui — fermer en choisissant une entrée ne doit
  // pas empêcher de rouvrir le menu juste après.
  let suppressOwner = null, suppressAt = 0;
  let popClosedPointer = -1;   // pointeur ayant fermé un popover (à consommer)
  function closePopover() {
    if (popEl) {
      popEl.remove();
      popEl = null;
      popOwner = null;
      popAnchor = null;
    }
  }
  document.addEventListener('pointerdown', (e) => {
    if (popEl && !popEl.contains(e.target)) {
      const onAnchor = popAnchor && popAnchor.contains(e.target);
      const owner = popOwner;
      closePopover();
      if (onAnchor) { suppressOwner = owner; suppressAt = performance.now(); }
      // Le tap qui ferme un menu ne doit pas démarrer un geste sur le canvas
      else popClosedPointer = e.pointerId;
    }
  }, true);
  // Le marqueur ne vaut que pour l'interaction en cours : la souris réutilise
  // toujours le même pointerId, il ne doit pas contaminer le geste suivant.
  const clearPopClose = () => { popClosedPointer = -1; };
  document.addEventListener('pointerup', clearPopClose, true);
  document.addEventListener('pointercancel', clearPopClose, true);
  /** À appeler au pointerdown du canvas : vrai si ce pointeur vient de fermer un menu. */
  function consumePopClose(pointerId) {
    if (popClosedPointer === pointerId) { popClosedPointer = -1; return true; }
    return false;
  }
  function openPopover(owner, anchorEl, build) {
    // Re-cliquer l'ancre du menu qui vient d'être fermé = bascule (rester fermé)
    if (suppressOwner === owner && performance.now() - suppressAt < 500) {
      suppressOwner = null;
      return;
    }
    suppressOwner = null;
    closePopover();
    popOwner = owner;
    popAnchor = anchorEl;
    popEl = document.createElement('div');
    popEl.className = 'popmenu';
    build((label, fn, cls) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.innerHTML = label;
      if (cls) b.classList.add(cls);
      b.addEventListener('click', () => { closePopover(); fn(); });
      popEl.appendChild(b);
      return b;
    });
    document.body.appendChild(popEl);
    const r = anchorEl.getBoundingClientRect();
    const pw = popEl.offsetWidth;
    const mh = popEl.offsetHeight;
    popEl.style.left = Math.max(8, Math.min(r.left, window.innerWidth - pw - 8)) + 'px';
    // Sous l'ancre si la place le permet, sinon au-dessus (jamais hors écran)
    let top = r.bottom + 6;
    if (top + mh > window.innerHeight - 8) top = Math.max(8, r.top - mh - 6);
    popEl.style.top = (top + window.scrollY) + 'px';
  }

  // ---------- Classe Chart --------------------------------------------
  let uid = 0;

  class Chart {
    /**
     * @param app  { acquire(addr, periodMs), release(addr), onChange(),
     *               toast(msg), removeChart(chart), refreshTargets() }
     */
    constructor(app, opts) {
      opts = opts || {};
      this.app = app;
      this.id = 'c' + (++uid);
      this.windowS = clamp(opts.windowS || CFG.defaultWindowS, MIN_WINDOW_S, MAX_WINDOW_S);
      this.viewEnd = null;         // null = direct ; sinon temps absolu figé
      this.pinT = null;            // curseur épinglé (temps absolu)
      this.cursor = null;          // curseur transitoire {x} (survol souris)
      this.series = [];            // {addr, meta, colorIdx, axisMode, visible, periodMs, offsetY}
      this.heightMode = HEIGHT_MODES.includes(opts.heightMode) ? opts.heightMode : 'M';
      this.fullscreen = false;
      this.moveSeries = null;      // adresse en cours de décalage (mode explicite)
      this.axisState = new Map();  // clé de groupe -> état d'échelle
      this._cw = 0; this._ch = 0; this._dpr = 0;
      this._ptrs = new Map();
      this._gesture = null;
      this._plot = null;
      this._bands = [];            // zones des règles d'axes (hit-test)
      this._yFns = {};
      this._lastTap = 0; this._lastTapX = 0; this._lastTapBand = null;

      this.root = document.createElement('section');
      this.root.className = 'card chart-card';
      this.root.innerHTML =
        '<header class="chart-head">' +
          '<input class="chart-title" maxlength="48" aria-label="Titre du graphique">' +
          '<div class="chart-tools">' +
            '<select class="chart-window" title="Fenêtre de temps" aria-label="Fenêtre de temps"></select>' +
            '<button class="iconbtn chart-pause" type="button" title="Figer / reprendre">⏸</button>' +
            '<button class="iconbtn chart-more" type="button" title="Options du graphique">⋮</button>' +
          '</div>' +
        '</header>' +
        '<div class="chart-body">' +
          '<canvas aria-label="Courbes du graphique"></canvas>' +
          '<div class="chart-tip hide"></div>' +
          '<button class="chart-live hide" type="button">▶ Direct</button>' +
          '<div class="chart-move hide"><span class="mv-txt"></span><button class="btn sm" type="button">OK</button></div>' +
          '<div class="chart-hint">Ajoutez une variable via la barre de recherche, cible « ' +
            '<b class="hint-name"></b> ».</div>' +
        '</div>' +
        '<div class="chart-legend" role="list"></div>';

      this.titleEl = this.root.querySelector('.chart-title');
      this.titleEl.value = opts.title || 'Graphique';
      this.canvas = this.root.querySelector('canvas');
      this.ctx = this.canvas.getContext('2d');
      this.tipEl = this.root.querySelector('.chart-tip');
      this.hintEl = this.root.querySelector('.chart-hint');
      this.legendEl = this.root.querySelector('.chart-legend');
      this.winSel = this.root.querySelector('.chart-window');
      this.pauseBtn = this.root.querySelector('.chart-pause');
      this.liveBtn = this.root.querySelector('.chart-live');
      this.moveEl = this.root.querySelector('.chart-move');
      this._customOpt = null;

      for (const w of CFG.windows) {
        const o = document.createElement('option');
        o.value = w;
        o.textContent = w < 60 ? w + ' s' : (w / 60) + ' min';
        this.winSel.appendChild(o);
      }
      this.syncWinSel();
      this.applyHeightMode();

      this.root.querySelector('.hint-name').textContent = this.titleEl.value;

      this.titleEl.addEventListener('change', () => {
        this.root.querySelector('.hint-name').textContent = this.title;
        app.onChange();
        app.refreshTargets();
      });
      this.winSel.addEventListener('change', () => {
        const v = parseFloat(this.winSel.value);
        if (isFinite(v)) { this.windowS = v; this.syncWinSel(); app.onChange(); }
      });
      this.pauseBtn.addEventListener('click', () => this.setPaused(this.viewEnd === null));
      this.liveBtn.addEventListener('click', () => this.goLive());
      this.root.querySelector('.chart-more').addEventListener('click', (e) =>
        this.openChartMenu(e.currentTarget));
      this.moveEl.querySelector('button').addEventListener('click', () => this.endMoveMode());

      this._escHandler = (e) => { if (e.key === 'Escape' && this.fullscreen) this.setFullscreen(false); };
      document.addEventListener('keydown', this._escHandler);

      this.bindCanvasGestures();
    }

    get title() { return this.titleEl.value.trim() || 'Graphique'; }
    get paused() { return this.viewEnd !== null; }

    // ---------- Direct / figé ------------------------------------------
    setPaused(p) {
      this.viewEnd = p ? DW.source.now() : null;
      this.syncPauseUi();
    }
    goLive() {
      this.viewEnd = null;
      this.syncPauseUi();
    }
    syncPauseUi() {
      const frozen = this.viewEnd !== null;
      this.pauseBtn.textContent = frozen ? '▶' : '⏸';
      this.pauseBtn.classList.toggle('on', frozen);
      this.liveBtn.classList.toggle('hide', !frozen);
    }

    syncWinSel() {
      const preset = CFG.windows.find((w) => Math.abs(w - this.windowS) < 0.25);
      if (preset) {
        if (this._customOpt) { this._customOpt.remove(); this._customOpt = null; }
        this.winSel.value = String(preset);
      } else {
        if (!this._customOpt) {
          this._customOpt = document.createElement('option');
          this.winSel.appendChild(this._customOpt);
        }
        this._customOpt.value = String(this.windowS);
        this._customOpt.textContent = fmtWindow(this.windowS);
        this.winSel.value = String(this.windowS);
      }
    }

    // ---------- Taille & plein écran ------------------------------------
    applyHeightMode() {
      this.root.classList.toggle('size-L', this.heightMode === 'L');
      this.root.classList.toggle('size-XL', this.heightMode === 'XL');
    }
    cycleHeight() {
      const i = HEIGHT_MODES.indexOf(this.heightMode);
      this.heightMode = HEIGHT_MODES[(i + 1) % HEIGHT_MODES.length];
      this.applyHeightMode();
      this.app.onChange();
    }
    setFullscreen(on) {
      this.fullscreen = on;
      this.root.classList.toggle('fs', on);
      document.body.classList.toggle('has-fs', on);
    }

    openChartMenu(anchor) {
      openPopover(this, anchor, (mk) => {
        mk('Échelles automatiques', () => this.resetAxes());
        const next = HEIGHT_MODES[(HEIGHT_MODES.indexOf(this.heightMode) + 1) % HEIGHT_MODES.length];
        mk('Taille : ' + this.heightMode + ' → ' + next +
           (next === 'XL' ? ' (pleine largeur)' : ''), () => this.cycleHeight());
        mk(this.fullscreen ? 'Quitter le plein écran' : 'Plein écran', () =>
          this.setFullscreen(!this.fullscreen));
        mk('Fermer le graphique', () => {
          if (this.fullscreen) this.setFullscreen(false);
          this.app.removeChart(this);
        }, 'danger');
      });
    }

    resetAxes() {
      for (const st of this.axisState.values()) { st.mode = 'auto'; st.snap = true; }
    }

    // ---------- Mode décalage d'une courbe ------------------------------
    startMoveMode(s) {
      this.moveSeries = s.addr;
      this.moveEl.querySelector('.mv-txt').textContent = '↕ Glissez pour décaler ' + s.addr;
      this.moveEl.classList.remove('hide');
    }
    endMoveMode() {
      this.moveSeries = null;
      this.moveEl.classList.add('hide');
      this.rebuildLegend();
      this.app.onChange();
    }

    // ---------- Gestes ---------------------------------------------------
    bandAt(x) {
      for (const b of this._bands) if (x >= b.x0 && x <= b.x1) return b;
      return null;
    }

    bindCanvasGestures() {
      const cv = this.canvas;

      cv.addEventListener('pointerdown', (e) => {
        try { cv.setPointerCapture(e.pointerId); } catch (err) { /* pointeur synthétique */ }
        this.cursor = null;   // le curseur de survol ne survit pas à un appui
        const suppressed = consumePopClose(e.pointerId);
        this._ptrs.set(e.pointerId, { x: e.offsetX, y: e.offsetY, x0: e.offsetX, y0: e.offsetY, suppressed });
        if (suppressed) { this._gesture = { mode: 'dead' }; return; }
        if (this._ptrs.size === 2) {
          this._hadMulti = true;
          const [a, b] = [...this._ptrs.values()];
          const dist = Math.max(12, Math.hypot(a.x - b.x, a.y - b.y));
          const midX = (a.x + b.x) / 2;
          this._gesture = {
            mode: 'pinch',
            baseDist: dist,
            baseWindow: this.windowS,
            anchorT: this.viewEnd === null ? null : this.timeAt(midX),
            anchorX: midX,
          };
        } else if (this._ptrs.size === 1) {
          this._hadMulti = false;
          const band = this.bandAt(e.offsetX);
          if (this.moveSeries) {
            const s = this.series.find((x) => x.addr === this.moveSeries);
            this._gesture = s ? {
              mode: 'offset', series: s,
              baseOffset: s.offsetY || 0, baseY: e.offsetY,
              scale: this._axisScale[s.addr] || 0,
            } : null;
          } else if (band) {
            this._gesture = this.makeYGesture(band.key, e.offsetY);
          } else {
            this._gesture = null;   // décidé au premier mouvement
          }
        } else {
          this._gesture = { mode: 'dead' };
        }
      });

      cv.addEventListener('pointermove', (e) => {
        if (e.pointerType === 'mouse' && e.buttons === 0) {
          if (!this.bandAt(e.offsetX)) this.cursor = { x: e.offsetX };
          else this.cursor = null;
          return;
        }
        const p = this._ptrs.get(e.pointerId);
        if (!p) return;
        p.x = e.offsetX; p.y = e.offsetY;

        const g = this._gesture;
        if (g && g.mode === 'pinch') {
          if (this._ptrs.size < 2) return;
          const [a, b] = [...this._ptrs.values()];
          const dist = Math.max(12, Math.hypot(a.x - b.x, a.y - b.y));
          const w = clamp(g.baseWindow * g.baseDist / dist, MIN_WINDOW_S, MAX_WINDOW_S);
          this.windowS = w;
          if (g.anchorT !== null && this._plot) {
            const pl = this._plot;
            this.viewEnd = g.anchorT + ((pl.mL + pl.pw - g.anchorX) / pl.pw) * w;
            this.clampView();
          }
          this.syncWinSel();
          return;
        }
        if (g && g.mode === 'dead') return;

        if (!g) {
          const dx = p.x - p.x0, dy = p.y - p.y0;
          if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
          if (Math.abs(dx) >= Math.abs(dy)) {
            this._gesture = {
              mode: 'pan',
              baseEnd: this.viewEnd === null ? DW.source.now() : this.viewEnd,
              baseX: p.x0,
            };
          } else {
            // Glisser vertical sur le tracé : déplace l'échelle principale
            const primary = this._plot && this._plot.primaryKey;
            this._gesture = primary ? this.makeYGesture(primary, p.y0) : { mode: 'dead' };
          }
        }
        const g2 = this._gesture;
        if (g2.mode === 'pan' && this._plot) {
          const dt = (g2.baseX - p.x) * (this.windowS / this._plot.pw);
          this.viewEnd = g2.baseEnd + dt;
          this.clampView();
          if (this.viewEnd !== null && DW.source.now() - this.viewEnd < this.windowS * 0.01) this.goLive();
          else this.syncPauseUi();
        } else if (g2.mode === 'offset' && g2.scale) {
          g2.series.offsetY = g2.baseOffset + (g2.baseY - p.y) * g2.scale;
        } else if (g2.mode === 'yaxis') {
          // Zone morte : un appui qui tremble ne doit pas verrouiller l'axe
          if (!g2.armed) {
            if (Math.abs(p.y - g2.baseY) < 8) return;
            g2.armed = true;
          }
          const st = this.axisState.get(g2.key);
          if (st) {
            const dv = (p.y - g2.baseY) * g2.scale;
            st.mode = 'manual';
            st.cur = sanitizeRange(g2.baseMin + dv, g2.baseMax + dv);
          }
        }
      });

      const end = (e) => {
        const p = this._ptrs.get(e.pointerId);
        this._ptrs.delete(e.pointerId);
        const g = this._gesture;
        if (this._ptrs.size) { this._gesture = { mode: 'dead' }; return; }
        this._gesture = null;
        if (g && g.mode === 'offset') { this.rebuildLegend(); this.app.onChange(); return; }
        // Appui bref sans mouvement — jamais après un geste multi-touch,
        // un pointercancel ou le tap qui a fermé un menu
        if (p && !p.suppressed && !this._hadMulti && e.type !== 'pointercancel' &&
            Math.abs(p.x - p.x0) < 8 && Math.abs(p.y - p.y0) < 8) {
          const band = this.bandAt(p.x0);
          const now = performance.now();
          const isDouble = now - this._lastTap < 320 && Math.abs(p.x - this._lastTapX) < 40;
          if (band) {
            if (isDouble && this._lastTapBand === band.key) {
              const st = this.axisState.get(band.key);
              if (st) { st.mode = 'auto'; st.snap = true; }
            }
            this._lastTapBand = band.key;
          } else if (isDouble && this._lastTapBand === null) {
            // Double-appui homogène sur le tracé uniquement
            this.pinT = null;
            this.goLive();
          } else {
            if (this.pinT !== null && this._plot && Math.abs(this.xAt(this.pinT) - p.x) < 24) this.pinT = null;
            else this.pinT = this.timeAt(p.x);
            this._lastTapBand = null;
          }
          this._lastTap = now; this._lastTapX = p.x;
        }
        this._hadMulti = false;
      };
      cv.addEventListener('pointerup', end);
      cv.addEventListener('pointercancel', end);
      cv.addEventListener('pointerleave', (e) => {
        if (e.pointerType === 'mouse' && e.buttons === 0) this.cursor = null;
      });

      cv.addEventListener('wheel', (e) => {
        e.preventDefault();
        const factor = Math.pow(1.25, e.deltaY / 100);
        const band = this.bandAt(e.offsetX);
        if (band) {
          // Zoom de l'échelle de cet axe, ancré sous le curseur
          const st = this.axisState.get(band.key);
          if (!st || !this._plot) return;
          const pl = this._plot;
          const span = st.cur.max - st.cur.min;
          const v0 = st.cur.min + (1 - (e.offsetY - pl.mT) / pl.ph) * span;
          st.mode = 'manual';
          st.cur = sanitizeRange(v0 - (v0 - st.cur.min) * factor, v0 + (st.cur.max - v0) * factor);
          return;
        }
        const anchorT = this.viewEnd === null ? null : this.timeAt(e.offsetX);
        const w = clamp(this.windowS * factor, MIN_WINDOW_S, MAX_WINDOW_S);
        this.windowS = w;
        if (anchorT !== null && this._plot) {
          const pl = this._plot;
          this.viewEnd = anchorT + ((pl.mL + pl.pw - e.offsetX) / pl.pw) * w;
          this.clampView();
        }
        this.syncWinSel();
      }, { passive: false });

      cv.addEventListener('dblclick', (e) => {
        const band = this.bandAt(e.offsetX);
        if (band) {
          const st = this.axisState.get(band.key);
          if (st) { st.mode = 'auto'; st.snap = true; }
        } else {
          this.pinT = null;
          this.goLive();
        }
      });
    }

    makeYGesture(key, y0) {
      const st = this.axisState.get(key);
      if (!st || !this._plot) return { mode: 'dead' };
      return {
        mode: 'yaxis', key,
        baseY: y0,
        baseMin: st.cur.min, baseMax: st.cur.max,
        scale: (st.cur.max - st.cur.min) / this._plot.ph,
      };
    }

    clampView() {
      if (this.viewEnd === null) return;
      const now = DW.source.now();
      const minEnd = now - CFG.horizonS + this.windowS;
      this.viewEnd = Math.min(now, Math.max(this.viewEnd, Math.min(minEnd, now)));
    }

    timeAt(xPx) {
      const pl = this._plot;
      if (!pl) return DW.source.now();
      return pl.tEnd - ((pl.mL + pl.pw - xPx) / pl.pw) * (pl.tEnd - pl.tStart);
    }
    xAt(t) {
      const pl = this._plot;
      if (!pl) return -1;
      return pl.mL + ((t - pl.tStart) / (pl.tEnd - pl.tStart)) * pl.pw;
    }

    // ---------- Courbes --------------------------------------------------
    hasSeries(addr) { return this.series.some((s) => s.addr === addr); }

    addSeries(addr, opts) {
      opts = opts || {};
      if (this.hasSeries(addr)) return { ok: false, error: addr + ' est déjà tracée dans « ' + this.title + ' ».' };
      if (this.series.length >= CFG.maxSeriesPerChart) {
        return { ok: false, error: 'Limite de ' + CFG.maxSeriesPerChart + ' courbes par graphique atteinte — ajoutez un autre graphique.' };
      }
      const meta = this.app.acquire(addr, opts.periodMs);
      if (!meta) return { ok: false, error: 'Adresse invalide : ' + addr };
      const used = new Set(this.series.map((s) => s.colorIdx));
      let colorIdx = 0;
      while (used.has(colorIdx)) colorIdx++;
      this.series.push({
        addr, meta, colorIdx,
        axisMode: opts.axisMode === 'solo' ? 'solo' : 'auto',
        visible: opts.visible !== false,
        periodMs: opts.periodMs || undefined,
        offsetY: isFinite(opts.offsetY) ? opts.offsetY : 0,
      });
      this.rebuildLegend();
      return { ok: true };
    }

    removeSeries(addr) {
      const i = this.series.findIndex((s) => s.addr === addr);
      if (i < 0) return;
      if (this.moveSeries === addr) this.endMoveMode();
      this.app.release(addr);
      this.series.splice(i, 1);
      this.rebuildLegend();
      this.app.onChange();
    }

    // ---------- Légende ------------------------------------------------
    rebuildLegend() {
      closePopover();
      this.legendEl.innerHTML = '';
      for (const s of this.series) {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip' + (s.visible ? '' : ' off') +
          (this.moveSeries === s.addr ? ' moving' : '');
        chip.setAttribute('role', 'listitem');
        chip.dataset.addr = s.addr;
        chip.innerHTML =
          '<i class="sw"></i>' +
          '<span class="chip-addr"></span>' +
          '<span class="chip-val">—</span>' +
          '<span class="chip-off hide" title="Courbe décalée verticalement">Δ</span>' +
          '<span class="chip-axis"></span>';
        chip.querySelector('.chip-addr').textContent = s.addr;
        chip.querySelector('.sw').style.background = DW.seriesColor(s.colorIdx);
        chip.title = s.meta.label + (s.meta.unit ? ' (' + s.meta.unit + ')' : '') +
          ' · rafr. ' + (s.periodMs || DW.CONFIG.defaultPeriodMs) + ' ms' +
          (s.offsetY ? ' · décalage ' + DW.fmtVal(s.offsetY, s.meta) : '');
        chip.addEventListener('click', () => this.openSeriesMenu(s, chip));
        this.legendEl.appendChild(chip);
      }
      this.hintEl.classList.toggle('hide', this.series.length > 0);
    }

    openSeriesMenu(s, chip) {
      openPopover(s, chip, (mk) => {
        mk(s.visible ? 'Masquer la courbe' : 'Afficher la courbe', () => {
          s.visible = !s.visible;
          this.rebuildLegend();
          this.app.onChange();
        });
        mk((s.axisMode === 'solo' ? '✓ ' : '') + 'Échelle dédiée', () => {
          s.axisMode = s.axisMode === 'solo' ? 'auto' : 'solo';
          this.app.onChange();
          this.app.toast(s.addr + ' : ' + (s.axisMode === 'solo' ? 'échelle dédiée' : 'échelle partagée par unité') + '.');
        });
        mk('Décaler verticalement (glisser)', () => this.startMoveMode(s));
        if (s.offsetY) {
          mk('Annuler le décalage (Δ ' + DW.fmtVal(s.offsetY, s.meta) + ')', () => {
            s.offsetY = 0;
            this.rebuildLegend();
            this.app.onChange();
          });
        }
        mk('Retirer du graphique', () => this.removeSeries(s.addr), 'danger');
      });
    }

    /** Mise à jour des valeurs vivantes de la légende (~5 Hz). */
    updateLive() {
      const chips = this.legendEl.children;
      for (let i = 0; i < this.series.length && i < chips.length; i++) {
        const s = this.series[i];
        const last = DW.source.latest(s.addr);
        const valEl = chips[i].querySelector('.chip-val');
        valEl.textContent = last ? DW.fmtVal(last.v, s.meta) + (s.meta.unit ? ' ' + s.meta.unit : '') : '—';
        chips[i].querySelector('.chip-off').classList.toggle('hide', !s.offsetY);
        const axEl = chips[i].querySelector('.chip-axis');
        const badge = (this._axisBadge && this._axisBadge[s.addr]) || '';
        // Badge visible si plusieurs échelles OU si l'axe est verrouillé 🔒
        axEl.textContent = (this._axisCount > 1 || badge.includes('🔒')) ? badge : '';
      }
    }

    // ---------- Échelles ----------------------------------------------
    axisKey(s) {
      if (s.axisMode === 'solo') return 'solo:' + s.addr;
      if (s.meta.kind === 'bit') return 'bool';
      if (s.meta.unit) return 'u:' + s.meta.unit;
      return s.meta.kind === 'word' ? 'mot' : 'sans-unité';
    }

    /** Ajustement « nice » d'une plage de données (avec marge). */
    fitRange(min, max) {
      if (!isFinite(min)) { min = 0; max = 1; }
      if (min === max) {
        const e = Math.max(Math.abs(min) * 0.05, 0.5);
        min -= e; max += e;
      }
      const pad = (max - min) * 0.07;
      return sanitizeRange(min - pad, max + pad);
    }

    computeGroups(tStart, tEnd) {
      const groups = new Map();
      for (const s of this.series) {
        if (!s.visible) continue;
        const key = this.axisKey(s);
        let g = groups.get(key);
        if (!g) {
          g = {
            key,
            label: s.meta.kind === 'bit' && s.axisMode !== 'solo' ? 'TOR'
              : (s.meta.unit || (s.meta.kind === 'word' ? 'mot' : '')),
            series: [], dMin: Infinity, dMax: -Infinity, isBool: s.meta.kind === 'bit',
          };
          groups.set(key, g);
        }
        g.series.push(s);
        if (g.isBool && s.meta.kind !== 'bit') g.isBool = false;
      }
      const list = [...groups.values()];
      const nowMs = performance.now();

      for (const g of list) {
        // Plage des données (décalages inclus)
        if (g.isBool) {
          let lo = 0, hi = 0;
          for (const s of g.series) {
            const off = s.offsetY || 0;
            if (off < lo) lo = off;
            if (off > hi) hi = off;
          }
          g.dMin = -0.07 + lo; g.dMax = 1.07 + hi;
        } else {
          for (const s of g.series) {
            const off = s.offsetY || 0;
            const d = DW.source.data(s.addr);
            const [i0, i1] = rangeIdx(d.ts, tStart, tEnd);
            for (let i = i0; i <= i1; i++) {
              const v = d.vs[i] + off;
              if (v < g.dMin) g.dMin = v;
              if (v > g.dMax) g.dMax = v;
            }
          }
        }

        // État d'échelle stabilisé (auto avec hystérésis) ou manuel
        let st = this.axisState.get(g.key);
        if (!st) {
          st = { mode: 'auto', cur: null, shrinkSince: 0, snap: true };
          this.axisState.set(g.key, st);
        }
        if (g.isBool && st.mode === 'auto') {
          st.cur = { min: g.dMin, max: g.dMax };
          st.shrinking = false;
        } else if (st.mode === 'auto') {
          const fit = this.fitRange(g.dMin, g.dMax);
          if (!st.cur || st.snap) {
            st.cur = fit;
            st.snap = false;
            st.shrinkSince = 0;
            st.shrinking = false;
          } else if (g.dMin < st.cur.min || g.dMax > st.cur.max) {
            // Extension IMMÉDIATE quand les données sortent de la plage
            st.cur = sanitizeRange(
              Math.min(fit.min, st.cur.min),
              Math.max(fit.max, st.cur.max)
            );
            st.shrinkSince = 0;
            st.shrinking = false;
          } else if (st.shrinking) {
            // Rétraction en cours : on la mène jusqu'au fit (cible rafraîchie)
            st.cur = {
              min: st.cur.min + (fit.min - st.cur.min) * 0.18,
              max: st.cur.max + (fit.max - st.cur.max) * 0.18,
            };
            const span = fit.max - fit.min;
            if (Math.abs(st.cur.min - fit.min) < span * 0.005 &&
                Math.abs(st.cur.max - fit.max) < span * 0.005) {
              st.cur = fit;
              st.shrinking = false;
              st.shrinkSince = 0;
            }
          } else {
            // Rétraction différée quand les données n'occupent plus l'échelle
            const span = st.cur.max - st.cur.min;
            const occ = isFinite(g.dMin) ? (g.dMax - g.dMin) / span : 1;
            if (occ < SHRINK_OCCUPANCY) {
              if (!st.shrinkSince) st.shrinkSince = nowMs;
              else if (nowMs - st.shrinkSince > SHRINK_DELAY_S * 1000) st.shrinking = true;
            } else {
              st.shrinkSince = 0;
            }
          }
        }
        if (!st.cur || !isFinite(st.cur.min) || st.cur.max <= st.cur.min) {
          st.cur = this.fitRange(g.dMin, g.dMax);
        }
        st.cur = sanitizeRange(st.cur.min, st.cur.max);
        g.min = st.cur.min;
        g.max = st.cur.max;
        g.manual = st.mode === 'manual';

        if (g.isBool && !g.manual) {
          g.ticks = [0, 1];
          g.tickStep = 1;
        } else {
          // Graduations bornées par indices entiers (jamais de boucle infinie)
          const step = niceStep((g.max - g.min) / 4);
          g.tickStep = step;
          g.ticks = [];
          const k0 = Math.ceil(g.min / step - 1e-9);
          const k1 = Math.floor(g.max / step + 1e-9);
          if (isFinite(k0) && isFinite(k1) && k1 - k0 <= 40) {
            for (let k = k0; k <= k1; k++) {
              const v = k * step;
              g.ticks.push(Math.abs(v) < step * 1e-6 ? 0 : v);
            }
          }
        }
      }
      // Purge des états d'axes réellement disparus — les clés des séries
      // masquées sont conservées (réglage manuel 🔒 non perdu au masquage)
      const validKeys = new Set(this.series.map((s) => this.axisKey(s)));
      for (const key of [...this.axisState.keys()]) {
        if (!validKeys.has(key)) this.axisState.delete(key);
      }
      for (const g of list) {
        g.color = g.series.length === 1 ? DW.seriesColor(g.series[0].colorIdx) : ink().muted;
      }
      return list;
    }

    // ---------- Rendu ---------------------------------------------------
    render() {
      const cw = this.canvas.clientWidth, chh = this.canvas.clientHeight;
      if (!cw || !chh) return;
      const dpr = window.devicePixelRatio || 1;
      if (cw !== this._cw || chh !== this._ch || dpr !== this._dpr) {
        this._cw = cw; this._ch = chh; this._dpr = dpr;
        this.canvas.width = Math.round(cw * dpr);
        this.canvas.height = Math.round(chh * dpr);
      }
      const ctx = this.ctx;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, cw, chh);
      const IK = ink();

      // Adaptation à la largeur : axes compacts sur petit écran
      const compact = cw < 520;
      const axisW = compact ? 38 : cw > 1100 ? 50 : 44;
      const maxShown = compact ? 2 : MAX_AXES;
      const fontPx = compact ? 9 : cw > 1100 ? 11 : 10;

      this.clampView();
      const tEnd = this.viewEnd === null ? DW.source.now() : this.viewEnd;
      const tStart = tEnd - this.windowS;
      const groups = this.computeGroups(tStart, tEnd);

      // Badges d'échelle pour la légende
      this._axisBadge = {};
      this._axisCount = groups.length;
      groups.forEach((g, i) => {
        const tag = i < maxShown ? 'É' + (i + 1) + (g.manual ? '🔒' : '') : 'É·';
        for (const s of g.series) this._axisBadge[s.addr] = tag;
      });

      const shown = groups.slice(0, maxShown);
      const leftAxes = shown.filter((_, i) => i % 2 === 0);
      const rightAxes = shown.filter((_, i) => i % 2 === 1);
      const mL = 8 + (leftAxes.length ? leftAxes.length * axisW : 26);
      const mR = 8 + rightAxes.length * axisW;
      const mT = 18, mB = 22;
      const pw = Math.max(10, cw - mL - mR), ph = Math.max(10, chh - mT - mB);
      this._plot = {
        mL, mT, pw, ph, tStart, tEnd,
        primaryKey: shown[0] ? shown[0].key : null,
      };
      const X = (t) => mL + ((t - tStart) / this.windowS) * pw;
      const yOf = (g) => (v) => mT + ph * (1 - (v - g.min) / (g.max - g.min));

      // Zones des règles (hit-test des gestes d'axe)
      this._bands = shown.map((g, i) => {
        const side = i % 2 === 0 ? 'L' : 'R';
        const slot = Math.floor(i / 2);
        const x0 = side === 'L' ? mL - (slot + 1) * axisW : cw - mR + slot * axisW;
        return { key: g.key, x0: Math.max(0, x0), x1: x0 + axisW, side };
      });

      this._yFns = {};
      this._axisScale = {};
      for (const g of groups) {
        const yG = yOf(g);
        for (const s of g.series) {
          const off = s.offsetY || 0;
          this._yFns[s.addr] = (v) => yG(v + off);
          this._axisScale[s.addr] = (g.max - g.min) / ph;
        }
      }

      ctx.font = fontPx + 'px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';

      // Grille temporelle (graduations relatives au bord direct)
      const nowT = DW.source.now();
      const tickS = niceTimeStep(this.windowS / (compact ? 4 : 5));
      ctx.strokeStyle = IK.line;
      ctx.fillStyle = IK.faint;
      ctx.lineWidth = 1;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      const firstK = Math.ceil((nowT - tEnd) / tickS - 1e-9);
      for (let k = firstK; ; k++) {
        const t = nowT - k * tickS;
        if (t < tStart - 1e-9) break;
        const x = Math.round(X(t)) + 0.5;
        ctx.beginPath(); ctx.moveTo(x, mT); ctx.lineTo(x, mT + ph); ctx.stroke();
        ctx.fillText(fmtTimeTick(k * tickS, this.windowS), Math.min(Math.max(x, mL + 14), cw - mR - 16), mT + ph + 6);
      }

      // Grille horizontale : celle du premier groupe uniquement
      if (shown[0]) {
        const g0 = shown[0], y0 = yOf(g0);
        ctx.strokeStyle = IK.line;
        for (const v of g0.ticks) {
          const y = Math.round(y0(v)) + 0.5;
          if (y < mT || y > mT + ph) continue;
          ctx.beginPath(); ctx.moveTo(mL, y); ctx.lineTo(mL + pw, y); ctx.stroke();
        }
      }

      // Règles d'axes
      shown.forEach((g, i) => {
        const side = i % 2 === 0 ? 'L' : 'R';
        const slot = Math.floor(i / 2);
        const xr = side === 'L' ? mL - slot * axisW : cw - mR + slot * axisW;
        const yG = yOf(g);
        ctx.strokeStyle = g.color; ctx.globalAlpha = 0.55; ctx.lineWidth = 1;
        const xl = Math.round(xr) + (side === 'L' ? -0.5 : 0.5);
        ctx.beginPath(); ctx.moveTo(xl, mT); ctx.lineTo(xl, mT + ph); ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.fillStyle = g.color;
        ctx.textAlign = side === 'L' ? 'right' : 'left';
        ctx.textBaseline = 'middle';
        const tx = side === 'L' ? xr - 4 : xr + 4;
        for (const v of g.ticks) {
          const y = yG(v);
          if (y < mT - 2 || y > mT + ph + 2) continue;
          ctx.fillText(fmtAxisTick(v, g.tickStep || 1), tx, y);
        }
        ctx.textBaseline = 'bottom';
        const lbl = (g.manual ? '🔒' : '') + (g.label || '');
        if (lbl) ctx.fillText(lbl, tx, mT - 4);
      });

      // Courbes
      ctx.save();
      ctx.beginPath(); ctx.rect(mL, mT - 4, pw, ph + 8); ctx.clip();
      for (const g of groups) {
        for (const s of g.series) {
          const yFn = this._yFns[s.addr];
          const d = DW.source.data(s.addr);
          const [i0, i1] = rangeIdx(d.ts, tStart, tEnd);
          if (i1 < i0) continue;
          const discrete = s.meta.kind === 'bit' || s.meta.kind === 'word';
          ctx.strokeStyle = DW.seriesColor(s.colorIdx);
          ctx.lineWidth = this.moveSeries === s.addr ? 3 : 2;
          ctx.lineJoin = 'round';
          ctx.lineCap = 'round';
          drawPath(ctx, d.ts, d.vs, i0, i1, X, yFn, discrete, pw);
          if (this.viewEnd === null) {
            const xe = X(d.ts[i1]), ye = yFn(d.vs[i1]);
            ctx.beginPath(); ctx.arc(xe, ye, 3, 0, Math.PI * 2);
            ctx.fillStyle = DW.seriesColor(s.colorIdx); ctx.fill();
          }
        }
      }
      ctx.restore();

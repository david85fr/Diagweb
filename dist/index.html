<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Diagweb — diagnostic en ligne des variables et signaux internes d'un contrôleur embarqué : mapping PLC, mots de bus, signaux modèles Simulink (C API).">
<title>Diagweb — Diagnostic contrôleur</title>
<style>
/* Diagweb — styles (mobile-first, thèmes clair/sombre) */

:root {
  --bg: #0b0e14;
  --panel: #141a24;
  --panel-2: #1c2431;
  --line: #26303f;
  --ink: #e6edf5;
  --muted: #8494a8;
  --faint: #5b6a7e;
  --accent: #2dd4bf;
  --accent-dim: #1b8b7e;
  --good: #46d17f;
  --warn: #f5b942;
  --crit: #ff5f56;
  --shadow: 0 1px 0 rgba(255,255,255,.03), 0 12px 32px -18px rgba(0,0,0,.8);
  --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #eef1f5;
    --panel: #ffffff;
    --panel-2: #f4f6f9;
    --line: #dde3ea;
    --ink: #131922;
    --muted: #5a6675;
    --faint: #8b98a8;
    --accent: #0d9488;
    --accent-dim: #14b8a6;
    --good: #12924f;
    --warn: #b7791f;
    --crit: #d64535;
    --shadow: 0 1px 0 rgba(255,255,255,.6), 0 14px 30px -20px rgba(20,30,45,.35);
  }
}
:root[data-theme="dark"] {
  --bg: #0b0e14; --panel: #141a24; --panel-2: #1c2431; --line: #26303f;
  --ink: #e6edf5; --muted: #8494a8; --faint: #5b6a7e;
  --accent: #2dd4bf; --accent-dim: #1b8b7e; --good: #46d17f; --warn: #f5b942; --crit: #ff5f56;
  --shadow: 0 1px 0 rgba(255,255,255,.03), 0 12px 32px -18px rgba(0,0,0,.8);
}
:root[data-theme="light"] {
  --bg: #eef1f5; --panel: #ffffff; --panel-2: #f4f6f9; --line: #dde3ea;
  --ink: #131922; --muted: #5a6675; --faint: #8b98a8;
  --accent: #0d9488; --accent-dim: #14b8a6; --good: #12924f; --warn: #b7791f; --crit: #d64535;
  --shadow: 0 1px 0 rgba(255,255,255,.6), 0 14px 30px -20px rgba(20,30,45,.35);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(1100px 500px at 85% -10%, color-mix(in srgb, var(--accent) 7%, transparent), transparent 60%),
    var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
.wrap { max-width: 2300px; margin: 0 auto; padding: 10px 12px 60px; }
.hide { display: none !important; }
button { font-family: var(--sans); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Barre supérieure ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-areas:
    "tabs icons"
    "search search";
  gap: 8px 10px;
  align-items: center;
  padding: 8px 0 10px;
  margin-bottom: 12px;
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.logo {
  width: 30px; height: 30px; border-radius: 8px; flex: none;
  background: linear-gradient(145deg, var(--accent), var(--accent-dim));
  display: grid; place-items: center;
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent);
}
.logo svg { width: 18px; height: 18px; display: block; }

.topIcons {
  grid-area: icons;
  position: relative;
  display: flex; gap: 6px; align-items: center;
}
.menu-panel {
  position: absolute; top: calc(100% + 6px); right: 0; z-index: 80;
  display: grid; gap: 2px;
  min-width: 230px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: var(--shadow);
  padding: 6px;
}
.menu-panel button {
  display: flex; align-items: center; gap: 6px;
  text-align: left;
  font: 500 13.5px var(--sans);
  color: var(--ink);
  background: none; border: 0; border-radius: 8px;
  padding: 11px 12px;
  cursor: pointer;
}
.menu-panel button:hover:not(:disabled) { background: var(--panel-2); }
.menu-panel button:disabled { color: var(--faint); cursor: default; }

/* Actions liées au contenu de l'onglet actif */
.tabActions {
  display: flex; flex-wrap: wrap; gap: 6px;
  margin-bottom: 12px;
}
.tabActions .btn { font-size: 12.5px; padding: 7px 11px; }

.build-tag {
  font: 10.5px var(--mono);
  color: var(--faint);
  text-align: right;
  line-height: 1.3;
  white-space: nowrap;
  margin-right: 2px;
}

.searchrow {
  position: relative;
  grid-area: search;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto auto;
  gap: 6px;
}
.searchrow .searchbox { grid-column: 1 / -1; }
.searchbox { position: relative; min-width: 0; }
#searchInput {
  width: 100%;
  font: 16px/1.2 var(--mono);
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 9px 12px;
}
#searchInput::placeholder { color: var(--faint); font-family: var(--sans); font-size: 14px; }
#searchInput:focus { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); outline: none; }

.suggest {
  position: absolute; top: calc(100% + 4px); left: 0; z-index: 60;
  width: min(100%, 560px);
  max-height: min(46vh, 380px); overflow-y: auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: var(--shadow);
  padding: 4px;
}
.sug {
  display: grid;
  grid-template-columns: auto auto minmax(0, 1fr) auto;
  gap: 8px; align-items: baseline;
  width: 100%; text-align: left;
  background: none; border: 0; border-radius: 7px;
  padding: 8px 8px; cursor: pointer;
  color: var(--ink);
}
.sug:hover, .sug.sel { background: var(--panel-2); }
.sug-addr { font-family: var(--mono); font-size: 13px; }
.sug-label { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sug-unit { color: var(--faint); font-family: var(--mono); font-size: 11px; }
.sug-filters {
  display: flex; gap: 6px; flex-wrap: wrap;
  padding: 6px 8px 8px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 4px;
}
.fbtn {
  font: 600 11.5px var(--sans);
  color: var(--muted);
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 11px;
  cursor: pointer;
}
.fbtn.on {
  color: #04201d;
  background: linear-gradient(145deg, var(--accent), var(--accent-dim));
  border-color: transparent;
}
.sug-none { padding: 10px; font-size: 12.5px; color: var(--faint); }
.sug-help { padding: 8px 10px 6px; font-size: 11.5px; color: var(--muted); border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.sug-help code { font-family: var(--mono); background: var(--panel-2); border-radius: 4px; padding: 1px 4px; font-size: 11px; }

#targetSel, #periodSel {
  font: 13px var(--sans);
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 0 8px;
  min-height: 38px;
  max-width: 44vw;
}
#targetSel { min-width: 0; }
#periodSel { max-width: 32vw; }

/* ---------- Boutons ---------- */
.btn {
  font-size: 13px; font-weight: 560;
  color: var(--ink); background: var(--panel-2);
  border: 1px solid var(--line); border-radius: 9px;
  padding: 8px 12px; cursor: pointer;
  transition: border-color .15s, background .15s;
  white-space: nowrap;
}
.btn:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
.btn.primary {
  background: linear-gradient(145deg, var(--accent), var(--accent-dim));
  color: #04201d; border-color: transparent; font-weight: 640;
}
.btn.sm { padding: 5px 10px; font-size: 12px; }
.iconbtn {
  width: 34px; height: 34px; flex: none;
  display: inline-grid; place-items: center;
  font-size: 14px; color: var(--muted);
  background: var(--panel-2);
  border: 1px solid var(--line); border-radius: 9px;
  cursor: pointer;
}
.iconbtn:hover { color: var(--ink); border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
.iconbtn.on { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); }

/* ---------- Badges de famille ---------- */
.badge {
  display: inline-block; flex: none;
  font-family: var(--mono); font-size: 10px; font-weight: 700;
  padding: 2px 6px; border-radius: 5px;
  border: 1px solid var(--line);
  color: var(--muted); background: var(--panel-2);
  align-self: center;
}
.badge.fam-I    { color: #3987e5; border-color: color-mix(in srgb, #3987e5 40%, var(--line)); }
.badge.fam-Q    { color: #d95926; border-color: color-mix(in srgb, #d95926 40%, var(--line)); }
.badge.fam-M    { color: #9085e9; border-color: color-mix(in srgb, #9085e9 40%, var(--line)); }
.badge.fam-S    { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.badge.fam-MB   { color: #c98500; border-color: color-mix(in srgb, #c98500 45%, var(--line)); }
.badge.fam-CAPI { color: #199e70; border-color: color-mix(in srgb, #199e70 45%, var(--line)); }
.badge.fam-NET  { color: #d55181; border-color: color-mix(in srgb, #d55181 45%, var(--line)); }

/* ---------- Cartes ---------- */
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 13px;
  box-shadow: var(--shadow);
}
.card > h3, .table-card h3 {
  margin: 0; padding: 12px 14px 8px;
  font-size: 11px; text-transform: uppercase; letter-spacing: .11em;
  color: var(--muted); font-weight: 650;
}
.table-card h3 span { text-transform: none; letter-spacing: 0; color: var(--faint); font-weight: 500; margin-left: 6px; }

/* ---------- Tableau numérique ---------- */
.table-card { margin-bottom: 12px; position: relative; }
.trows { padding: 0 2px 2px; }
/* Hauteur libre (poignée) : le tableau défile en interne au lieu de pousser
   les graphiques vers le bas. La poignée reste réservée aux écrans ≥ 700 px. */
.table-card.has-th .trows { max-height: var(--table-h); overflow-y: auto; }
.table-card.resizing { outline: 1px solid color-mix(in srgb, var(--accent) 60%, transparent); }
.table-card.resizing .resize-grip { opacity: 1; }
.table-grip { bottom: 4px; right: 4px; }
#tableRows { padding: 2px 6px 8px; }
.vrow {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto auto auto;
  gap: 10px; align-items: center;
  padding: 7px 8px;
  border-radius: 9px;
}
.vrow:nth-child(odd) { background: color-mix(in srgb, var(--panel-2) 55%, transparent); }
.v-id { display: grid; min-width: 0; }
.v-addr { font-family: var(--mono); font-size: 13px; }
.v-label { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.v-label.renamed { color: var(--ink); font-style: italic; }
.v-rename, .chip-rename {
  font: inherit; color: var(--ink);
  background: var(--panel-2);
  border: 1px solid color-mix(in srgb, var(--accent) 55%, var(--line));
  border-radius: 6px; padding: 2px 5px;
  width: 100%; max-width: 220px; min-width: 0;
}
.chip-rename { font-size: 12px; width: 120px; }
.v-val {
  display: flex; align-items: baseline; gap: 6px;
  font-family: var(--mono); font-variant-numeric: tabular-nums;
  justify-content: flex-end;
}
.v-val .val { font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.v-unit { color: var(--faint); font-size: 11px; }
.v-hex { color: var(--faint); font-size: 11px; }
.v-trend { width: 14px; text-align: center; font-size: 12px; }
.v-trend.up { color: var(--good); }
.v-trend.down { color: #d95926; }
.v-trend.flat { color: var(--faint); }
/* Flash : variable immobile depuis ≥ 2 s qui change à nouveau */
@keyframes vrow-flash {
  from { box-shadow: inset 0 0 0 999px color-mix(in srgb, var(--accent) 30%, transparent); }
  to   { box-shadow: inset 0 0 0 999px transparent; }
}
.vrow.vflash { animation: vrow-flash 1.1s ease-out; }

.led {
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--panel-2); border: 1px solid var(--line);
  display: inline-block;
}
.led.on { background: var(--good); border-color: var(--good); box-shadow: 0 0 6px color-mix(in srgb, var(--good) 60%, transparent); }
.v-del, .v-edit {
  width: 28px; height: 28px;
  display: grid; place-items: center;
  color: var(--faint); background: none;
  border: 0; border-radius: 7px; cursor: pointer; font-size: 12px;
}
.v-del:hover { color: var(--crit); background: var(--panel-2); }
.v-edit:hover { color: var(--accent); background: var(--panel-2); }
/* Variable forcée (valeur imposée côté serveur) */
.v-forced {
  border: 0; background: none; cursor: pointer;
  color: var(--warn); font-size: 12px; padding: 0 2px;
}
.vrow.forced { box-shadow: inset 3px 0 0 var(--warn); }
.vrow.forced .val { color: var(--warn); }

/* ---------- Grille de graphiques ---------- */
/* --col-min : largeur minimale d'une colonne, lue par chart.js pour connaître
   le nombre de colonnes « naturelles » (0 = une seule colonne, mobile). */
.charts-grid { display: grid; gap: 12px; grid-template-columns: 1fr; --col-min: 0px; }

.chart-card { position: relative; display: flex; flex-direction: column; min-width: 0; }

/* Poignée de redimensionnement (coin bas-droit, souris ou stylet) */
.resize-grip {
  display: none;                      /* activée ≥ 700 px — cf. media query */
  position: absolute; right: 2px; bottom: 2px;
  width: 18px; height: 18px;
  cursor: nwse-resize; touch-action: none;
  border-bottom-right-radius: 12px;
  opacity: .45;
  background:
    linear-gradient(135deg, transparent 46%, var(--faint) 46%, var(--faint) 58%, transparent 58%),
    linear-gradient(135deg, transparent 68%, var(--faint) 68%, var(--faint) 80%, transparent 80%);
}
.resize-grip:hover { opacity: 1; }
.chart-card.resizing { outline: 1px solid color-mix(in srgb, var(--accent) 60%, transparent); }
.chart-card.resizing .resize-grip { opacity: 1; }
.chart-card.fs .resize-grip { display: none; }
.chart-head {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px 6px;
}
.chart-title {
  flex: 1; min-width: 0;
  font: 600 13.5px var(--sans);
  color: var(--ink);
  background: none; border: 1px solid transparent; border-radius: 7px;
  padding: 5px 8px;
}
.chart-title:hover { border-color: var(--line); }
.chart-title:focus { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); outline: none; background: var(--panel-2); }
.chart-tools { display: flex; gap: 6px; align-items: center; }
.chart-window {
  font: 12px var(--mono);
  color: var(--muted);
  background: var(--panel-2);
  border: 1px solid var(--line); border-radius: 8px;
  height: 34px; padding: 0 6px;
}
.chart-body { position: relative; height: clamp(220px, 32vh, 420px); padding: 0 4px; }
.chart-card.size-L .chart-body { height: clamp(300px, 48vh, 640px); }
.chart-card.size-XL { grid-column: 1 / -1; }
.chart-card.size-XL .chart-body { height: clamp(340px, 56vh, 780px); }

/* Plein écran par graphique */
.chart-card.fs {
  position: fixed; inset: 0; z-index: 140;
  margin: 0; border-radius: 0; border: 0;
  display: flex; flex-direction: column;
}
.chart-card.fs .chart-body { flex: 1 1 0; height: auto; min-height: 0; }
.chart-card.fs .chart-legend { flex: none; }
body.has-fs { overflow: hidden; }

/* Bandeau du mode « décaler une courbe » */
.chart-move {
  position: absolute; left: 50%; top: 8px; transform: translateX(-50%);
  z-index: 26;
  display: flex; align-items: center; gap: 10px;
  background: color-mix(in srgb, var(--panel) 94%, transparent);
  border: 1px solid color-mix(in srgb, var(--warn) 55%, var(--line));
  border-radius: 999px;
  padding: 5px 6px 5px 13px;
  font-size: 12px;
  box-shadow: var(--shadow);
  white-space: nowrap; max-width: 96%;
  overflow: hidden;
}
.chart-move .mv-txt { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.chart-move .btn { flex: none; }
.chip.moving { border-color: var(--warn); }
.chart-body canvas {
  width: 100%; height: 100%;
  display: block;
  touch-action: none;   /* gestes du graphique : zoom, navigation, décalage */
  cursor: crosshair;
}
.chart-live {
  position: absolute; right: 10px; bottom: 28px; z-index: 25;
  font: 640 12px var(--sans);
  color: #04201d;
  background: linear-gradient(145deg, var(--accent), var(--accent-dim));
  border: 0; border-radius: 999px;
  padding: 6px 12px;
  cursor: pointer;
  box-shadow: var(--shadow);
}
.chip-off {
  color: var(--warn);
  font-size: 10px; font-weight: 700;
}
.chart-tip {
  position: absolute; z-index: 30;
  pointer-events: none;
  background: color-mix(in srgb, var(--panel) 94%, transparent);
  border: 1px solid var(--line); border-radius: 8px;
  box-shadow: var(--shadow);
  padding: 6px 8px;
  font-family: var(--mono); font-size: 11px;
  min-width: 130px;
}
.tip-time { color: var(--faint); margin-bottom: 4px; }
.tip-row { display: flex; align-items: center; gap: 6px; padding: 1px 0; }
.tip-row i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.tip-row .tip-addr { color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; }
.tip-row b { font-weight: 600; font-variant-numeric: tabular-nums; }
.chart-hint {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  color: var(--faint); font-size: 12.5px;
  text-align: center; padding: 20px;
  pointer-events: none;
}
.chart-hint b { color: var(--muted); }

.chart-legend {
  display: flex; flex-wrap: wrap; gap: 6px;
  padding: 4px 10px 10px;
  min-height: 18px;
}
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: 11.5px;
  color: var(--ink);
  background: var(--panel-2);
  border: 1px solid var(--line); border-radius: 999px;
  padding: 4px 9px; cursor: pointer;
  max-width: 100%;
}
.chip:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.chip .sw { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.chip-addr { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 34vw; }
.chip-val { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip-axis { color: var(--faint); font-size: 10px; }
.chip.off { opacity: .45; }
.chip.off .sw { background: transparent !important; border: 1.5px solid var(--faint); }

.popmenu {
  position: absolute; z-index: 200;   /* au-dessus du plein écran (140) */
  display: grid; gap: 2px;
  background: var(--panel);
  border: 1px solid var(--line); border-radius: 10px;
  box-shadow: var(--shadow);
  padding: 5px;
  min-width: 190px;
}
.popmenu button {
  text-align: left;
  font-size: 13px; color: var(--ink);
  background: none; border: 0; border-radius: 7px;
  padding: 9px 10px; cursor: pointer;
}
.popmenu button:hover { background: var(--panel-2); }
.popmenu button.danger { color: var(--crit); }

/* ---------- Glisser-déposer de widgets ---------- */
.drag-handle {
  flex: none;
  cursor: grab;
  color: var(--faint);
  font-size: 13px;
  line-height: 1;
  padding: 4px 5px;
  border-radius: 6px;
  user-select: none;
}
.drag-handle:hover { color: var(--ink); background: var(--panel-2); }
.drag-handle:active { cursor: grabbing; }
.table-card h3 .drag-handle { margin-right: 6px; display: inline-block; }

body.dnd-active .tab { outline: 1px dashed var(--line); outline-offset: 2px; }
.tab.dnd-over {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  background: color-mix(in srgb, var(--accent) 18%, var(--panel));
}
body.dnd-over-pane #panes {
  outline: 2px dashed color-mix(in srgb, var(--accent) 60%, transparent);
  outline-offset: 4px;
  border-radius: 12px;
}
.vrow[draggable="true"] { cursor: grab; }

/* Repère d'insertion pendant le rangement des graphiques */
.chart-card { position: relative; }
.chart-card.drop-before::before,
.chart-card.drop-after::after {
  content: '';
  position: absolute; top: 6px; bottom: 6px; width: 3px;
  background: var(--accent);
  border-radius: 2px;
  box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 70%, transparent);
  z-index: 20;
}
.chart-card.drop-before::before { left: -7px; }
.chart-card.drop-after::after { right: -7px; }

/* Nuancier du menu de courbe */
.pop-swatches {
  display: flex; flex-wrap: wrap; gap: 5px;
  padding: 6px 8px 8px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 4px;
  max-width: 220px;
}
.sw-btn, .sw-custom {
  width: 22px; height: 22px; flex: none;
  border-radius: 6px;
  border: 2px solid transparent;
  box-shadow: 0 0 0 1px var(--line);
  cursor: pointer;
  padding: 0;
}
.sw-btn.on, .sw-custom.on { border-color: var(--ink); }
.sw-custom {
  display: grid; place-items: center;
  overflow: hidden;
  background: conic-gradient(#e34948, #eda100, #1baf7a, #2a78d6, #4a3aa7, #e87ba4, #e34948);
}
.sw-custom input[type="color"] {
  opacity: 0; width: 100%; height: 100%; cursor: pointer; border: 0; padding: 0;
}

/* ---------- Onglets (dans la barre supérieure, à la place du titre) ---------- */
.tabbar {
  grid-area: tabs;
  display: flex; gap: 8px; align-items: center;
  min-width: 0;
}
.tabs {
  display: flex; gap: 6px;
  flex: 1; min-width: 0;
  overflow-x: auto;
  padding-bottom: 2px;
  -webkit-overflow-scrolling: touch;
}
.tab {
  flex: none;
  display: inline-flex; align-items: center; gap: 7px;
  font: 600 13px var(--sans);
  color: var(--muted);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 7px 9px 7px 12px;
  cursor: pointer;
  max-width: 230px;
}
.tab.on {
  color: var(--ink);
  border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
  background: color-mix(in srgb, var(--accent) 9%, var(--panel));
}
.tab-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tab-name-input {
  font: 600 13px var(--sans);
  width: 120px;
  color: var(--ink);
  background: var(--panel-2);
  border: 1px solid var(--accent);
  border-radius: 6px;
  padding: 2px 6px;
}
.tab-close {
  color: var(--faint);
  font-size: 12px; line-height: 1;
  padding: 3px 4px; border-radius: 5px;
}
.tab-close:hover { color: var(--crit); background: var(--panel-2); }

.recdot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--crit);
  display: inline-block;
  margin-left: 6px;
  animation: recblink 1.6s infinite;
}
@keyframes recblink { 50% { opacity: .3; } }

.tabpane { display: none; }
.tabpane.on { display: block; }

/* ---------- Journal (modal) ---------- */
.log-status {
  font: 12px var(--mono);
  color: var(--muted);
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 9px 11px;
  margin: 10px 0;
  line-height: 1.6;
}
.log-opts { display: grid; gap: 9px; margin: 10px 0 4px; }
.log-opts label { display: flex; gap: 9px; align-items: center; font-size: 13.5px; cursor: pointer; }
.log-opts input[type="radio"] { accent-color: var(--accent); width: 16px; height: 16px; }
.log-opts .opt-note { color: var(--faint); font-size: 11.5px; }

/* ---------- État vide ---------- */
.empty {
  text-align: center;
  padding: 42px 18px;
  border: 1px dashed var(--line); border-radius: 14px;
  background: color-mix(in srgb, var(--panel) 55%, transparent);
  margin-bottom: 12px;
}
.empty h2 { margin: 0 0 8px; font-size: 19px; letter-spacing: -.02em; }
.empty p { margin: 0 auto 6px; color: var(--muted); max-width: 52ch; font-size: 13.5px; }
.empty .cta { margin-top: 18px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

/* ---------- Modal ---------- */
.modal-back {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(4, 8, 14, .55);
  display: grid; place-items: end center;
  padding: 0;
}
.modal {
  width: 100%; max-width: 560px;
  max-height: 88vh; overflow-y: auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px 16px 0 0;
  padding: 14px 16px 22px;
}
.m-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.m-head h3 { margin: 0; font-size: 16px; }
.m-section { padding: 10px 0; border-top: 1px solid var(--line); margin-top: 8px; }
.m-label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.m-input {
  width: 100%;
  font: 16px var(--sans); color: var(--ink);
  background: var(--panel-2);
  border: 1px solid var(--line); border-radius: 9px;
  padding: 9px 11px;
  margin-bottom: 10px;
}
.m-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.acc-row { margin-top: 4px; }
.acc-btn.on {
  color: #04201d;
  background: linear-gradient(145deg, var(--accent), var(--accent-dim));
  border-color: transparent;
  font-weight: 640;
}
.acc-panel {
  margin-top: 10px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: color-mix(in srgb, var(--panel-2) 55%, transparent);
}
.m-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.m-row h4 { margin: 0; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.m-import { display: inline-flex; align-items: center; }
.m-note { font-size: 11.5px; color: var(--faint); margin: 12px 0 0; }
.m-empty { color: var(--faint); font-size: 13px; margin: 6px 0; }
.m-text {
  width: 100%; height: 240px;
  font: 11px var(--mono); color: var(--ink);
  background: var(--panel-2);
  border: 1px solid var(--line); border-radius: 9px;
  padding: 8px;
  resize: vertical;
}
.lay-row {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 8px 6px;
  border-radius: 9px;
}
.lay-row:nth-child(odd) { background: color-mix(in srgb, var(--panel-2) 55%, transparent); }
.lay-id { min-width: 0; display: grid; }
.lay-id b { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lay-date { font-family: var(--mono); font-size: 11px; color: var(--faint); }
.lay-actions { display: flex; gap: 5px; flex: none; }
.star { color: var(--faint); }
.star.on { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); }

/* ---------- Fenêtre « Liens réseau » ---------- */
.modal.wide { max-width: 760px; }
.px-list { display: grid; gap: 8px; margin-top: 12px; }
.px-row {
  border: 1px solid var(--line); border-radius: 11px;
  padding: 9px 10px;
  background: color-mix(in srgb, var(--panel-2) 55%, transparent);
}
.px-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
.px-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
.px-name.mono { font-family: var(--mono); font-size: 12.5px; }
.px-unit { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.px-state { margin-left: auto; flex: none; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.px-state.st-up   { color: var(--good); }
.px-state.st-down { color: var(--crit); }
.px-state.st-sim  { color: var(--warn); }
.px-sub { font-size: 11.5px; color: var(--faint); margin-top: 3px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.px-acts { margin-top: 8px; }
.px-acts .btn { font-size: 12px; padding: 5px 9px; }
.btn.danger { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 45%, var(--line)); }

.pf-form { display: grid; gap: 2px; margin: 8px 0 4px; }
.pf-row {
  display: grid; grid-template-columns: 1fr; gap: 4px;
  padding: 6px 0;
}
.pf-label { font-size: 12px; color: var(--muted); }
.pf-input {
  width: 100%;
  font: 15px var(--sans); color: var(--ink);
  background: var(--panel-2);
  border: 1px solid var(--line); border-radius: 9px;
  padding: 8px 10px;
}
.pf-input.pf-check { width: 22px; height: 22px; padding: 0; }
@media (min-width: 700px) {
  .pf-row { grid-template-columns: minmax(160px, 240px) minmax(0, 1fr); align-items: center; gap: 10px; }
  .pf-label { text-align: right; }
}

/* ---------- Toasts ---------- */
#toasts {
  position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
  z-index: 200;
  display: grid; gap: 8px;
  width: min(94vw, 480px);
  pointer-events: none;
}
.toast {
  background: var(--panel);
  border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line));
  border-radius: 10px;
  box-shadow: var(--shadow);
  padding: 10px 14px;
  font-size: 13px;
  text-align: center;
  transition: opacity .35s, transform .35s;
}
.toast.err { border-color: color-mix(in srgb, var(--crit) 55%, var(--line)); }
.toast.gone { opacity: 0; transform: translateY(6px); }

/* ---------- Barre d'état ---------- */
.statusbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
  display: flex; justify-content: space-between; gap: 10px;
  padding: 5px 14px calc(5px + env(safe-area-inset-bottom, 0px));
  font: 10.5px var(--mono);
  color: var(--faint);
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  border-top: 1px solid var(--line);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.statusbar span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- Écrans moyens et larges ---------- */
@media (min-width: 700px) {
  body { font-size: 14.5px; }
  .wrap { padding: 12px 20px 64px; }
  .charts-grid { grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); --col-min: 380px; }
  .modal-back { place-items: center; padding: 20px; }
  .modal { border-radius: 16px; }
  .chip-addr { max-width: 240px; }

  /* Dimensionnement libre à la poignée — réservé aux écrans multi-colonnes ;
     sur mobile la grille reste en une colonne avec les hauteurs M/L/XL. */
  .resize-grip { display: block; }
  .chart-card.has-custom-h .chart-body { height: var(--custom-h); }
  .chart-card.has-span { grid-column: span var(--col-span); }
}

/* Barre supérieure sur une seule ligne : uniquement quand tout tient */
@media (min-width: 1100px) {
  .topbar {
    grid-template-columns: minmax(180px, 460px) minmax(340px, 1fr) auto;
    grid-template-areas: "tabs search icons";
    gap: 12px;
  }
  .searchrow .searchbox { grid-column: auto; }
  body.cfg-hidden .topbar { grid-template-columns: minmax(180px, 1fr) auto; grid-template-areas: "tabs icons"; }
}
body.cfg-hidden .searchrow { display: none; }
body.cfg-hidden .tabActions { display: none; }
@media (min-width: 1700px) {
  .charts-grid { grid-template-columns: repeat(auto-fit, minmax(500px, 1fr)); --col-min: 500px; }
}
@media (min-width: 2300px) {
  .charts-grid { grid-template-columns: repeat(auto-fit, minmax(620px, 1fr)); --col-min: 620px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* Fenêtre d'aide : récapitulatif des commandes et gestes */
.help-h {
  margin: 14px 0 6px;
  font-size: 11.5px; text-transform: uppercase; letter-spacing: .1em;
  color: var(--accent); font-weight: 650;
}
.help-list {
  display: grid; grid-template-columns: minmax(90px, auto) 1fr;
  gap: 5px 12px; margin: 0; font-size: 13px;
}
.help-list dt { color: var(--muted); font-weight: 600; }
.help-list dd { margin: 0; color: var(--ink); }
.help-list b { font-family: var(--mono); font-size: 12px; }

</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="tabbar">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#04201d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12h4l2-6 4 12 2-6h6"/>
        </svg>
      </span>
      <div id="tabs" class="tabs" role="tablist"></div>
      <button id="tabAdd" class="iconbtn" type="button" title="Nouvel onglet : un espace de travail vide, avec sa propre configuration">＋</button>
    </div>

    <div class="topIcons">
      <span id="buildTag" class="build-tag" title="Diagweb — version : commit court · n° de commit dans la branche">93f18c3 · #64</span>
      <button id="cfgToggle" class="iconbtn" type="button" title="Masquer / afficher la zone de configuration">⌃</button>
      <button id="menuBtn" class="iconbtn" type="button" title="Menu général : thème, aide, à propos (fonctions indépendantes des onglets)" aria-haspopup="true">☰</button>
      <div id="menuPanel" class="menu-panel hide" role="menu">
        <button id="themeBtn" type="button" title="Alterner entre le thème clair et le thème sombre">◐ Basculer le thème</button>
        <button id="helpBtn" type="button" title="Récapitulatif des commandes et des gestes (utile sur écran tactile, où les infobulles n’apparaissent pas)">Aide — commandes et gestes…</button>
        <button id="netBtn" type="button" title="Liens réseau : déclarer des équipements Modbus, IEC 61850, IEC 60870-5-104, CAN, J1939, CANopen, SNMP ou OPC UA et choisir les variables à lire">Liens réseau…</button>
        <button id="aboutBtn" type="button" title="Version affichée, mode de fonctionnement et source de données">À propos de Diagweb…</button>
        <button type="button" disabled title="Fonction globale prévue : capture des interfaces réseau du contrôleur">Capture d’interfaces réseau (à venir)</button>
        <button type="button" disabled title="Fonction globale prévue : historique des versions de l’application">Notes de version (à venir)</button>
      </div>
    </div>

    <div class="searchrow" id="cfgZone">
      <div class="searchbox">
        <input id="searchInput" type="text" inputmode="text" autocomplete="off" autocapitalize="off"
               autocorrect="off" spellcheck="false"
               placeholder="Variable : I1.2.3.4, MB414, Regulation.mesure.vitesse, @lien.point… (Q0.3 = 1 pour forcer)"
               aria-label="Adresse de la variable à ajouter"
               title="Adresse à diagnostiquer — bits I/Q/M/S (I1.2.3.4), mot de bus (MB414), signal de modèle (Regulation.mesure.vitesse) ou point d’un lien réseau (@lien.point). Les suggestions se filtrent à la frappe. Suffixe « = valeur » (ex. Q0.3 = 1) pour forcer la variable côté serveur.">
      </div>
      <select id="targetSel" aria-label="Destination de la variable"
              title="Où ajouter la variable : tableau numérique, graphique existant, ou nouveau graphique"></select>
      <select id="periodSel" aria-label="Période de rafraîchissement" title="Période de rafraîchissement"></select>
      <button id="addBtn" class="btn primary" type="button"
              title="Ajouter la variable saisie à la destination choisie (Entrée)">Ajouter</button>
      <div id="suggestBox" class="suggest hide"></div>
    </div>
  </header>

  <div class="tabActions">
    <button id="addChartBtn" class="btn" type="button" title="Créer un graphique vide dans cet onglet ; il devient la destination d’ajout">+ Graphique</button>
    <button id="layoutsBtn" class="btn" type="button" title="Configurations : enregistrer, télécharger (JSON/CSV), charger, copier la configuration de cet onglet">Configs</button>
    <button id="logBtn" class="btn" type="button" title="Journal de données : enregistrer tous les échantillons des variables de cet onglet (navigateur ou contrôleur), puis les télécharger en CSV/JSON">Journal<i id="logInd" class="recdot hide"></i></button>
    <button id="pauseAllBtn" class="btn" type="button" title="Figer ou reprendre d’un coup tous les graphiques de cet onglet">⏸ Figer</button>
  </div>

  <section id="emptyState" class="empty hide">
    <h2>Aucune variable dans cet onglet</h2>
    <p>Saisissez une adresse dans la barre de recherche pour l'ajouter au tableau
       numérique ou à un graphique&nbsp;: <b>I1.2.3.4</b>, <b>Q14.15</b>, <b>M1.14</b>,
       <b>S0.4</b>, <b>MB414</b> ou un signal modèle comme <b>Regulation.mesure.vitesse</b>.</p>
    <div class="cta">
      <button id="demoBtn" class="btn primary" type="button"
              title="Remplir cet onglet avec un exemple : 6 variables au tableau et 2 graphiques">Charger la disposition de démonstration</button>
    </div>
  </section>

  <div id="panes"></div>
</div>

<footer class="statusbar">
  <span id="srcInfo" title="Source des données et période de rafraîchissement par défaut"></span>
  <span id="statInfo" title="Nombre de variables actuellement abonnées et nombre d’onglets ouverts"></span>
</footer>

<div id="toasts" aria-live="polite"></div>
<div id="modalRoot"></div>

<script>
/* Diagweb — configuration globale & catalogue de variables simulées */
(function () {
  "use strict";
  const DW = (window.DW = window.DW || {});

  DW.CONFIG = {
    defaultPeriodMs: 10,     // période de rafraîchissement par défaut d'une variable
    periodChoices: [10, 20, 50, 100, 200, 500, 1000],
    horizonS: 330,           // profondeur d'historique conservée (s)
    windows: [15, 30, 60, 120, 300],
    defaultWindowS: 60,
    maxCharts: 8,
    maxSeriesPerChart: 8,    // ordre de palette fixe, jamais recyclé
    chartFps: 20,
    liveRefreshMs: 200,      // rafraîchissement tableau + légendes
  };

  // Palette catégorielle validée (ordre fixe — la position code l'identité).
  DW.SERIES_COLORS = {
    light: ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#4a3aa7', '#e34948'],
    dark:  ['#3987e5', '#d95926', '#199e70', '#c98500', '#d55181', '#008300', '#9085e9', '#e66767'],
  };

  DW.isDarkTheme = function () {
    const t = document.documentElement.getAttribute('data-theme');
    if (t === 'dark') return true;
    if (t === 'light') return false;
    return window.matchMedia('(prefers-color-scheme: dark)').matches;
  };
  DW.seriesColor = function (idx) {
    const pal = DW.isDarkTheme() ? DW.SERIES_COLORS.dark : DW.SERIES_COLORS.light;
    return pal[idx % pal.length];
  };

  // ------------------------------------------------------------------
  // Catalogue des variables connues du contrôleur (simulation).
  // kind : 'bit' | 'word' | 'float'
  // sim  : paramètres du générateur (voir sim.js)
  // ------------------------------------------------------------------
  DW.CATALOG = [
    // --- Entrées TOR : I<bus>.<module>.<voie>… -----------------------
    { addr: 'I0.1',      label: "Arrêt d'urgence (pupitre)",              kind: 'bit',  unit: '', sim: { type: 'bit', t0: 120, t1: 4 } },
    { addr: 'I0.2',      label: 'Sélecteur mode auto',                    kind: 'bit',  unit: '', sim: { type: 'bit', t0: 25, t1: 40 } },
    { addr: 'I1.2.3.4',  label: 'Entrée TOR — bus 1, module 2, voie 3.4', kind: 'bit',  unit: '', sim: { type: 'bit', t0: 6, t1: 9 } },
    { addr: 'I1.2.3.5',  label: 'Entrée TOR — bus 1, module 2, voie 3.5', kind: 'bit',  unit: '', sim: { type: 'bit', t0: 11, t1: 5 } },
    { addr: 'I2.0.1',    label: 'Capteur position A',                     kind: 'bit',  unit: '', sim: { type: 'bit', t0: 8, t1: 8 } },

    // --- Sorties TOR : Q… -------------------------------------------
    { addr: 'Q0.3',      label: 'Commande contacteur principal',          kind: 'bit',  unit: '', sim: { type: 'bit', t0: 30, t1: 90 } },
    { addr: 'Q2.1',      label: 'Électrovanne EV1',                       kind: 'bit',  unit: '', sim: { type: 'bit', t0: 14, t1: 7 } },
    { addr: 'Q14.15',    label: 'Sortie relais K15',                      kind: 'bit',  unit: '', sim: { type: 'bit', t0: 9, t1: 13 } },

    // --- Bits mémoire : M… ------------------------------------------
    { addr: 'M1.14',     label: 'Marche demandée',                        kind: 'bit',  unit: '', sim: { type: 'bit', t0: 20, t1: 60 } },
    { addr: 'M1.15',     label: 'Défaut mémorisé',                        kind: 'bit',  unit: '', sim: { type: 'bit', t0: 180, t1: 12 } },
    { addr: 'M20.0',     label: 'Cycle en cours',                         kind: 'bit',  unit: '', sim: { type: 'bit', t0: 15, t1: 45 } },

    // --- Variables système : S… -------------------------------------
    { addr: 'S0.4',      label: 'Système prêt',                           kind: 'bit',  unit: '', sim: { type: 'bit', t0: 8, t1: 300 } },
    { addr: 'S0.5',      label: 'Défaut présent',                         kind: 'bit',  unit: '', sim: { type: 'bit', t0: 240, t1: 15 } },
    { addr: 'S1.0',      label: 'Heartbeat 1 s',                          kind: 'bit',  unit: '', sim: { type: 'square', period: 2, duty: 0.5 } },
    { addr: 'S2.1',      label: 'Liaison bus terrain OK',                 kind: 'bit',  unit: '', sim: { type: 'bit', t0: 600, t1: 6 } },

    // --- Mots de bus : MB<registre> ---------------------------------
    { addr: 'MB400',     label: 'Registre process 400',                   kind: 'word', unit: '', sim: { type: 'sine', base: 12000, amp: 900, period: 47, noise: 60 } },
    { addr: 'MB414',     label: 'Mesure brute capteur (registre 414)',    kind: 'word', unit: '', sim: { type: 'sine', base: 20870, amp: 350, period: 13, noise: 90 } },
    { addr: 'MB520',     label: 'Consigne opérateur (registre 520)',      kind: 'word', unit: '', sim: { type: 'steps', values: [800, 1000, 1200, 1500], period: 35 } },
    { addr: 'MB1000',    label: 'Compteur trames bus',                    kind: 'word', unit: '', sim: { type: 'counter', rate: 87 } },

<script>
/* Diagweb — analyse et validation des adresses de variables */
(function () {
  "use strict";
  const DW = (window.DW = window.DW || {});

  const FAMILIES = {
    I:    { label: 'Entrée TOR',            kind: 'bit' },
    Q:    { label: 'Sortie TOR',            kind: 'bit' },
    M:    { label: 'Bit mémoire',           kind: 'bit' },
    S:    { label: 'Variable système',      kind: 'bit' },
    MB:   { label: 'Mot de bus (registre)', kind: 'word' },
    CAPI: { label: 'Signal modèle (C API)', kind: 'float' },
    NET:  { label: 'Point réseau (lien)',   kind: 'float' },
  };
  DW.FAMILIES = FAMILIES;

  // Identifiant d'un lien ou d'un point réseau (voir web/js/protocols.js)
  const NET_ID = '[A-Za-z][A-Za-z0-9_-]{0,23}';

  const HELP = "Formats acceptés : I1.2.3.4, Q14.15, M1.14, S0.4 (bits), " +
               "MB414 (mot de bus), Modele.sous_systeme.signal (C API Simulink, " +
               "premier champ = nom du modèle), @lien.point (point lu sur un " +
               "lien réseau).";

  /**
   * Analyse une saisie utilisateur.
   * Les familles PLC (I/Q/M/S/MB) sont prioritaires sur les chemins C API ;
   * l'ancien séparateur « / » est toléré et normalisé en « . ».
   * @returns {ok:true, addr, family, kind} | {ok:false, error}
   */
  DW.parseAddr = function (raw) {
    const input = String(raw == null ? '' : raw).trim().replace(/\//g, '.');
    if (!input) return { ok: false, error: 'Saisissez une adresse de variable. ' + HELP };

    // Point réseau : @lien.point — le « @ » lève toute ambiguïté avec les
    // autres familles, dont les chemins C API séparés par des points.
    if (input[0] === '@') {
      const m = new RegExp('^@(' + NET_ID + ')\\.(' + NET_ID + ')$').exec(input);
      if (m) {
        const addr = '@' + m[1] + '.' + m[2];
        const meta = DW.protocols ? DW.protocols.meta(addr) : null;
        return { ok: true, addr, family: 'NET', kind: meta ? meta.kind : 'float' };
      }
      return { ok: false, error: 'Point réseau attendu sous la forme @lien.point ' +
        '(identifiants : une lettre puis lettres, chiffres, « - » ou « _ »). ' +
        'Les liens se déclarent dans ☰ → Liens réseau.' };
    }

    // Mot de bus : MB<registre>
    let m = /^mb\s*(\d{1,5})$/i.exec(input);
    if (m) {
      const reg = parseInt(m[1], 10);
      if (reg > 65535) return { ok: false, error: 'Registre hors plage : MB0 à MB65535.' };
      return { ok: true, addr: 'MB' + reg, family: 'MB', kind: 'word' };
    }

    // Bits PLC : I / Q / M / S suivi de 1 à 4 niveaux numériques
    m = /^([iqms])\s*(\d{1,4}(?:\.\d{1,4}){0,3})$/i.exec(input);
    if (m) {
      const family = m[1].toUpperCase();
      return { ok: true, addr: family + m[2], family, kind: 'bit' };
    }

    // Signal C API : Modele.sous_systeme.signal — segments identifiants
    // séparés par des points, au moins deux (modèle + signal).
    m = /^[A-Za-z_][A-Za-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*)+$/.exec(input);
    if (m) return { ok: true, addr: input, family: 'CAPI', kind: 'float' };

    // Diagnostics ciblés pour les erreurs fréquentes
    if (/^[iqms]/i.test(input)) {
      return { ok: false, error: 'Adresse ' + input[0].toUpperCase() + '… incomplète ou mal formée. Exemple : ' +
        (input[0].toUpperCase() === 'I' ? 'I1.2.3.4' : input[0].toUpperCase() + '1.4') + '.' };
    }
    return { ok: false, error: 'Format non reconnu pour « ' + input + ' ». ' + HELP };
  };

  /**
   * Détecte un suffixe d'écriture « adresse = valeur » (ou « adresse := valeur »).
   * Le « = » ne peut apparaître dans aucune famille d'adresse : il signale donc
   * sans ambiguïté une demande de forçage de la valeur côté serveur.
   * @returns {base, value} | {base, bad} (valeur illisible) | null (pas de suffixe)
   */
  DW.splitWrite = function (raw) {
    const s = String(raw == null ? '' : raw);
    const eq = s.indexOf('=');
    if (eq < 0) return null;
    let base = s.slice(0, eq);
    if (base.endsWith(':')) base = base.slice(0, -1);   // forme « := »
    base = base.trim();
    const rhs = s.slice(eq + 1).trim();
    const value = Number(rhs.replace(',', '.'));
    if (rhs === '' || !isFinite(value)) return { base, bad: rhs };
    return { base, value };
  };

  /** Métadonnées d'une variable : catalogue si connue, sinon générées. */
  DW.resolveMeta = function (addr, parsed) {
    const p = parsed || DW.parseAddr(addr);
    if (!p.ok) return null;
    // Points réseau : le catalogue est la configuration des liens.
    if (p.family === 'NET') {
      const meta = DW.protocols ? DW.protocols.meta(p.addr) : null;
      if (meta) return meta;
      return {
        addr: p.addr, family: 'NET', kind: 'float', unit: '',
        label: 'Point réseau non configuré', known: false, sim: null,
      };
    }
    const known = DW.CATALOG_INDEX.get(p.addr.toUpperCase());
    if (known) return Object.assign({ family: p.family, known: true }, known);
    return {
      addr: p.addr,
      family: p.family,
      kind: p.kind,
      unit: '',
      label: FAMILIES[p.family].label + ' (hors catalogue)',
      known: false,
      sim: null,
    };
  };
})();

</script>

        F('sa', 'Adresse source', 'int', -1, false,
          'Adresse source attendue pour ce point ; −1 pour accepter n’importe laquelle. ' +
          'Elle désigne aussi le destinataire de la demande, le cas échéant.'),
        F('request', 'Demander ce PGN', 'bool', false, false,
          'À cocher si le calculateur n’émet PAS ce PGN de lui-même : le serveur le ' +
          'réclame alors périodiquement (PGN 59904). Laisser décoché pour un PGN diffusé ' +
          'spontanément, comme EEC1 — c’est le cas courant, et le lien reste alors ' +
          'strictement en écoute, sans rien émettre sur le bus.'),
        F('requestPeriodS', 'Période de demande (s)', 'float', 1, false,
          'Intervalle entre deux demandes de ce PGN (0,1 s à 1 h). Plusieurs SPN du même ' +
          'PGN ne déclenchent qu’une seule demande, à la plus courte des périodes ' +
          'réclamées. Trop court, on charge le bus et le calculateur pour rien.',
          { when: { request: ['true'] } }),
      ].concat(BITFIELD).concat(SCALE),
    },
    {
      id: 'canopen',
      label: 'CANopen',
      transport: 'SocketCAN (Linux)',
      state: 'live',
      help: 'Deux modes : écoute des TPDO déjà émis par le nœud (sans rien demander), ' +
            'ou lecture à la demande d’une entrée du dictionnaire d’objets par SDO — ' +
            'ce second mode est le seul où le serveur émet sur le bus. À savoir : un ' +
            'nœud qui n’est pas en état opérationnel n’émet aucun TPDO ; le lien ' +
            'paraîtra alors établi sans qu’aucune valeur ne remonte.',
      linkFields: [
        F('iface', 'Interface', 'text', 'can0', true, 'Nom de l’interface CAN du système.'),
        F('nodeId', 'Identifiant de nœud', 'int', 1, true,
          'Node-id du nœud CANopen (1 à 127) — il fixe les COB-ID des SDO et des PDO.'),
        F('listenOnly', 'Écoute seule', 'bool', true, false,
          'N’émettre aucune requête SDO : seuls les TPDO déjà émis par le nœud sont lus. ' +
          'Recommandé — interroger un nœud absent fait réémettre le contrôleur CAN jusqu’au ' +
          'bus-off, ce qui dégrade l’interface elle-même. Décocher active la lecture SDO.'),
      ],
      pointFields: [
        F('mode', 'Mode', 'enum', 'tpdo', true,
          'TPDO = écoute passive d’une trame déjà émise. SDO = interrogation d’une entrée du dictionnaire d’objets.',
          { choices: [['tpdo', 'Écoute d’un TPDO'], ['sdo', 'Lecture SDO']] }),
        F('cobId', 'COB-ID du TPDO', 'hex', '0x181', false,
          'Identifiant de la trame TPDO à écouter (0x180 + node-id pour le TPDO1, etc.).',
          { when: { mode: ['tpdo'] } }),
        F('index', 'Index', 'hex', '0x6041', false,
          'Index de l’objet dans le dictionnaire (ex. 0x6041 = mot d’état).', { when: { mode: ['sdo'] } }),
        F('subIndex', 'Sous-index', 'int', 0, false,
          'Sous-index de l’objet (0 quand l’objet n’est pas structuré).', { when: { mode: ['sdo'] } }),
        F('type', 'Type de donnée', 'enum', 'u16', false,
          'Type de l’objet lu par SDO.',
          { choices: [['u8', 'Entier 8 bits non signé'], ['i8', 'Entier 8 bits signé'],
                      ['u16', 'Entier 16 bits non signé'], ['i16', 'Entier 16 bits signé'],
                      ['u32', 'Entier 32 bits non signé'], ['i32', 'Entier 32 bits signé'],
                      ['f32', 'Flottant 32 bits']],
            when: { mode: ['sdo'] } }),
      ].concat(BITFIELD.map((f) => Object.assign({}, f, { when: { mode: ['tpdo'] } }))).concat(SCALE),
    },
    {
      id: 'snmp',
      label: 'SNMP',
      transport: 'UDP (port 161)',
      state: 'live',
      help: 'Gestionnaire SNMP en lecture seule : interrogation cyclique d’OID par ' +
            'GetRequest. v1 et v2c sont implémentées ; v3 (USM) se configure mais ' +
            'n’est pas encore lue — un lien en v3 s’annonce « non branché » plutôt ' +
            'que de retomber en silence sur une version non chiffrée. Aucune ' +
            'écriture (SetRequest) n’est possible.',
      linkFields: [
        F('host', 'Hôte', 'text', '', true, 'Adresse IP ou nom réseau de l’agent SNMP.'),
        F('port', 'Port', 'int', 161, false, 'Port UDP de l’agent (161 par défaut).'),
        F('version', 'Version', 'enum', 'v2c', true,
          'v1 : la plus ancienne, sans Counter64 ni exception par variable. v2c : le ' +
          'choix courant, communauté en clair. v3 : sécurisée (authentification et ' +
          'chiffrement) — configurable, lecture pas encore implémentée.',
          { choices: [['v1', 'v1'], ['v2c', 'v2c'], ['v3', 'v3 (non branché)']] }),
        F('community', 'Communauté', 'text', 'public', false,
          'Communauté de lecture, transmise EN CLAIR sur le réseau par v1 et v2c : ' +
          'ne pas y mettre un secret qui compte, et préférer v3 sur un réseau exposé.',
          { when: { version: ['v1', 'v2c'] } }),
        F('user', 'Utilisateur (USM)', 'text', '', false,
          'Nom d’utilisateur du modèle de sécurité USM.', { when: { version: ['v3'] } }),
        F('level', 'Niveau de sécurité', 'enum', 'authPriv', false,
          'noAuthNoPriv : ni authentification ni chiffrement. authNoPriv : authentifié. ' +
          'authPriv : authentifié et chiffré.',
          { choices: [['noAuthNoPriv', 'Aucun'], ['authNoPriv', 'Authentification'],
                      ['authPriv', 'Authentification et chiffrement']],
            when: { version: ['v3'] } }),
        F('authProto', 'Algorithme d’authentification', 'enum', 'SHA', false,
          'Fonction de hachage du condensé d’authentification.',
          { choices: [['MD5', 'HMAC-MD5'], ['SHA', 'HMAC-SHA-1'],
                      ['SHA256', 'HMAC-SHA-256']], when: { version: ['v3'] } }),
        F('privProto', 'Algorithme de chiffrement', 'enum', 'AES', false,
          'Chiffrement de la charge utile.',
          { choices: [['DES', 'DES-CBC'], ['AES', 'AES-128-CFB']], when: { version: ['v3'] } }),
        F('secretRef', 'Référence des secrets', 'text', '', false,
          'Nom sous lequel les phrases secrètes d’authentification et de chiffrement sont ' +
          'rangées dans le magasin de secrets du contrôleur — une désignation, jamais le ' +
          'secret lui-même : cette configuration s’exporte en clair.',
          { when: { version: ['v3'] } }),
        F('timeoutMs', 'Délai d’attente (ms)', 'int', 1500, false,
          'Temps maximal d’attente d’une réponse. UDP perd des datagrammes sans le dire : ' +
          'le lien n’est déclaré en défaut qu’après trois délais consécutifs.'),
        F('maxVars', 'Groupement (variables)', 'int', 16, false,
          'Nombre maximal d’OID demandés dans une même requête ; 1 pour les interroger ' +
          'séparément. Trop élevé, l’agent répond « tooBig ».'),
      ],
      pointFields: [
        F('oid', 'OID', 'text', '1.3.6.1.2.1.1.3.0', true,
          'Identifiant d’objet en notation pointée. Un scalaire se termine par « .0 » ' +
          '(ex. 1.3.6.1.2.1.1.3.0 = temps depuis le démarrage) ; une entrée de table ' +
          'porte son index (ex. 1.3.6.1.2.1.2.2.1.10.2 = octets reçus sur l’interface 2).'),
      ].concat(SCALE),
    },
    {
      id: 'opcua',
      label: 'OPC UA (IEC 62541)',
      transport: 'UA-TCP binaire (opc.tcp, port 4840)',
      state: 'live',
      help: 'Client OPC UA d’un serveur de supervision ou d’un équipement : lecture ' +
            'de nœuds désignés par leur NodeId, par abonnement (MonitoredItems) ou ' +
            'par interrogation cyclique (Read). S’appuie sur open62541. Lecture seule ' +
            'définitive : ni Write ni Call ne sont appelés. Le chiffrement demande un ' +
            'serveur compilé avec l’option correspondante ; sans elle, un lien réglé ' +
            'en signature ou chiffrement refuse de s’ouvrir plutôt que de dialoguer ' +
            'en clair.',
      linkFields: [
        F('endpoint', 'Point de terminaison', 'text', 'opc.tcp://192.168.0.10:4840', true,
          'URL du serveur OPC UA, forme opc.tcp://hôte:port/chemin. Le chemin est facultatif ' +
          'et dépend du serveur.'),
        F('securityPolicy', 'Politique de sécurité', 'enum', 'None', false,
          'Politique annoncée par le serveur pour le canal sécurisé. « Aucune » ne convient ' +
          'qu’à un réseau de confiance ; les autres exigent un certificat client.',
          { choices: [['None', 'Aucune'], ['Basic256Sha256', 'Basic256Sha256'],
                      ['Aes128Sha256RsaOaep', 'Aes128-Sha256-RsaOaep'],
                      ['Aes256Sha256RsaPss', 'Aes256-Sha256-RsaPss']] }),
        F('securityMode', 'Mode de sécurité', 'enum', 'None', false,
          'Aucun (en clair), signature seule, ou signature et chiffrement du canal.',
          { choices: [['None', 'Aucun'], ['Sign', 'Signature'],
                      ['SignAndEncrypt', 'Signature et chiffrement']] }),
        F('auth', 'Authentification', 'enum', 'anonymous', false,
          'Jeton d’identité présenté à l’ouverture de session.',
          { choices: [['anonymous', 'Anonyme'], ['username', 'Nom d’utilisateur'],
                      ['certificate', 'Certificat client']] }),
        F('username', 'Nom d’utilisateur', 'text', '', false,
          'Identifiant de session. Le mot de passe n’est JAMAIS enregistré ici : la ' +
          'configuration des liens est lisible par tout poste connecté et s’exporte en ' +
          'clair. Le secret est repris de l’environnement du serveur de diagnostic.',
          { when: { auth: ['username'] } }),
        F('secretRef', 'Référence du secret', 'text', '', false,
          'Nom désignant le secret — jamais le secret lui-même. Le serveur lit la variable ' +
          'd’environnement DIAGWEB_SECRET_<référence> (en majuscules), que systemd sait ' +
          'alimenter depuis son magasin de secrets sans l’écrire sur disque.',
          { when: { auth: ['username', 'certificate'] } }),
        F('mode', 'Mode de lecture', 'enum', 'subscribe', false,
          'Abonnement = le serveur OPC UA notifie les changements (économe, recommandé). ' +
          'Interrogation cyclique = service Read répété, utile face à un serveur qui ' +
          'refuse les abonnements.',
          { choices: [['subscribe', 'Abonnement (MonitoredItems)'],
                      ['poll', 'Interrogation cyclique (Read)']] }),
        F('publishMs', 'Intervalle de publication (ms)', 'int', 500, false,
          'Cadence à laquelle le serveur OPC UA regroupe et renvoie les changements.',
          { when: { mode: ['subscribe'] } }),
        F('sessionTimeoutS', 'Expiration de session (s)', 'int', 60, false,
          'Durée au-delà de laquelle le serveur ferme une session restée sans échange.'),
      ],
      pointFields: [
        F('nodeId', 'NodeId', 'text', 'ns=2;s=', true,
          'Identifiant du nœud à lire, forme ns=<espace>;<type>=<valeur> — par exemple ' +
          'ns=2;s=Machine/Pression pour une chaîne, ns=2;i=1234 pour un entier.'),
        F('attr', 'Attribut', 'enum', 'Value', false,
          'Attribut du nœud à lire. « Valeur » convient à toutes les variables ; les autres ' +
          'servent au diagnostic du serveur lui-même.',
          { choices: [['Value', 'Valeur'], ['StatusCode', 'Code d’état'],
                      ['SourceTimestamp', 'Horodatage source']] }),
        F('samplingMs', 'Échantillonnage (ms)', 'int', 200, false,
          'Cadence à laquelle le serveur OPC UA échantillonne le nœud, quand le lien est en ' +
          'mode abonnement ; 0 laisse le serveur choisir. Ne peut pas être plus rapide que ' +
          'la source de la donnée.'),
        F('deadband', 'Bande morte (%)', 'float', 0, false,
          'Variation minimale, en pourcentage de l’étendue, avant notification d’un ' +
          'changement (mode abonnement) ; 0 pour tout notifier.'),
      ].concat(SCALE),
    },
  ];

  DW.PROTO_INDEX = new Map(DW.PROTOCOLS.map((p) => [p.id, p]));

  // ------------------------------------------------------------------
  // Modèle de configuration
  // ------------------------------------------------------------------
  const STORE_KEY = 'diagweb.protocols.v1';
  const ID_RE = /^[A-Za-z][A-Za-z0-9_-]{0,23}$/;

  /** Valeur par défaut d'un champ. */
  function fieldDefault(f) { return f.def; }

  /** Un champ est-il pertinent compte tenu des autres valeurs saisies ? */
  function fieldApplies(f, params) {
    if (!f.when) return true;
    for (const k in f.when) {
      const cur = params[k] == null ? '' : String(params[k]);
      if (!f.when[k].map(String).includes(cur)) return false;
    }
    return true;
  }

  function defaults(fields) {
    const o = {};
    for (const f of fields) o[f.key] = fieldDefault(f);
    return o;
  }

  /** Type de variable Diagweb déduit des paramètres d'un point. */
  function kindOf(proto, point) {
    const p = point.params || {};
    if (proto.id === 'modbus-tcp' || proto.id === 'modbus-rtu') {
      if (String(p.fn) === '1' || String(p.fn) === '2' || p.type === 'bool') return 'bit';
      if (Number(p.bit) >= 0) return 'bit';
      const scaled = Number(p.gain) !== 1 || Number(p.offset) !== 0;
      if (!scaled && (p.type === 'int16' || p.type === 'uint16')) return 'word';
      return 'float';
    }
    if (proto.id === 'iec104') {
      if (p.type === 'single' || p.type === 'double') return 'bit';
      return 'float';
    }
    if (Number(p.bitLen) === 1) return 'bit';
    return 'float';
  }

  /** Résumé lisible de l'adressage protocole d'un point (listes et infobulles). */
  function pointSummary(link, point) {
    const proto = DW.PROTO_INDEX.get(link.protocol);
    const p = point.params || {};
    if (!proto) return '';
    switch (proto.id) {
      case 'modbus-tcp':
      case 'modbus-rtu':
        return 'fonction ' + String(p.fn).padStart(2, '0') + ' · adresse ' + p.reg +
               ' · ' + p.type + (Number(p.bit) >= 0 ? ' · bit ' + p.bit : '');
      case 'iec104':
        return 'IOA ' + p.ioa + ' · ' + (p.type === 'auto' ? 'type automatique' : p.type);
      case 'iec61850':
        return (p.ref || '—') + ' [' + p.fc + ']';
      case 'can-raw':
        return 'ID ' + p.canId + (p.ext ? ' (29 bits)' : '') + ' · bits ' + p.startBit + '+' + p.bitLen;
      case 'j1939':
        return 'PGN ' + p.pgn + (Number(p.sa) >= 0 ? ' · SA ' + p.sa : '') +
               ' · bits ' + p.startBit + '+' + p.bitLen;
      case 'canopen':
        return p.mode === 'sdo'
          ? 'SDO ' + p.index + '/' + p.subIndex + ' · ' + p.type
          : 'TPDO ' + p.cobId + ' · bits ' + p.startBit + '+' + p.bitLen;
      default:
        return '';
    }
  }

  function addrOf(link, point) { return '@' + link.id + '.' + point.id; }

  // ------------------------------------------------------------------
  // Stockage : serveur de diagnostic si présent, sinon navigateur
  // ------------------------------------------------------------------
  const api = {
    /** 'server' = configuration détenue par le contrôleur ; 'local' = navigateur (valeurs simulées). */
    mode: 'local',
    config: { version: 1, links: [] },
    status: {},          // idLien → {state:'up'|'down'|'off'|'sim', detail, points:{id:quality}}
    ready: null,
    onChange: null,      // renseigné par app.js (rafraîchir les suggestions)

    descriptor(id) { return DW.PROTO_INDEX.get(id) || null; },
    links() { return this.config.links || []; },
    link(id) { return this.links().find((l) => l.id === id) || null; },

    /** Tous les points configurés, au format des suggestions du catalogue. */
    catalog() {
      const out = [];
      for (const link of this.links()) {
        const proto = DW.PROTO_INDEX.get(link.protocol);
        if (!proto) continue;
        for (const pt of link.points || []) {
          out.push({
            addr: addrOf(link, pt),
            family: 'NET',
            label: pt.label || (link.label || link.id) + ' — ' + pt.id,
            unit: pt.unit || '',
            kind: pt.kind || kindOf(proto, pt),
            protocol: proto.id,
            protocolLabel: proto.label,
            summary: pointSummary(link, pt),
            periodMs: pt.periodMs,
            enabled: link.enabled !== false,
          });
        }
      }
      return out;
    },

    /** Métadonnées d'un point réseau, ou null si l'adresse n'est pas configurée. */
    meta(addr) {
      const e = this.catalog().find((x) => x.addr === addr);
      if (!e) return null;
      return {
        addr: e.addr, family: 'NET', kind: e.kind, unit: e.unit, label: e.label,
        known: true, protocol: e.protocol, summary: e.summary, sim: null,
      };
    },

    /** Période propre au point (sinon la valeur par défaut du réglage d'ajout). */
    periodOf(addr) {
      const e = this.catalog().find((x) => x.addr === addr);
      return e && e.periodMs ? e.periodMs : null;
    },

    // ---- Persistance ------------------------------------------------
    async load() {
      try {
        // Page ouverte en fichier local (Artifact, copie hors ligne) ou hors
        // navigateur (générateur d'en-tête C++) : aucun appel réseau à tenter —
        // la configuration vit alors dans le navigateur.
        const httpish = typeof location !== 'undefined' &&
          (location.protocol === 'http:' || location.protocol === 'https:');
        if (!httpish) throw new Error('page hors serveur');
        const r = await fetch('/api/protocols', { cache: 'no-store' });
        if (r.ok) {
          const j = await r.json();
          this.config = normalize(j.config || j);
          this.status = indexStatus(j.status);
          this.mode = 'server';
          return this.config;
        }
      } catch (e) { /* pas de serveur : configuration locale */ }
      this.mode = 'local';
      try {
        const raw = typeof localStorage === 'undefined' ? null : localStorage.getItem(STORE_KEY);
        if (raw) this.config = normalize(JSON.parse(raw));
      } catch (e) { /* stockage indisponible */ }
      return this.config;
    },

    async save() {
      // On envoie une copie remise en forme, sans remplacer les objets vivants :
      // la fenêtre de configuration garde ses références (un remplacement ferait
      // écrire les modifications suivantes dans des objets orphelins).
      const payload = normalize(this.config);
      if (this.mode === 'server') {
        const r = await fetch('/api/protocols', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        if (!r.ok) throw new Error('le serveur de diagnostic a refusé la configuration');
        const j = await r.json().catch(() => ({}));
        this.status = indexStatus(j.status);
      } else {
        try {
          localStorage.setItem(STORE_KEY, JSON.stringify(payload));
        } catch (e) {
          throw new Error('stockage local indisponible');
        }
      }
      if (typeof this.onChange === 'function') this.onChange();
    },

    async refreshStatus() {
      if (this.mode !== 'server') return this.status;
      try {
        const r = await fetch('/api/protocols/status', { cache: 'no-store' });
        if (r.ok) this.status = indexStatus(await r.json());
      } catch (e) { /* lien serveur perdu : on garde le dernier état connu */ }
      return this.status;
    },

    /** Teste un lien côté serveur ; en mode local, réponse explicite. */
    async test(linkId) {
      if (this.mode !== 'server') {
        return { ok: false, detail: 'Aucun serveur de diagnostic : la configuration est ' +
                 'mémorisée dans le navigateur et les valeurs sont simulées.' };
      }
      const r = await fetch('/api/protocols/test', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: linkId }),
      });
      const j = await r.json().catch(() => ({}));
      return { ok: !!j.ok, detail: j.detail || (j.ok ? 'connexion établie' : 'échec') };
    },

    linkState(id) {
      const st = this.status[id];
      if (this.mode !== 'server') return { key: 'sim', label: 'simulé', detail: 'Valeurs simulées (pas de serveur de diagnostic).' };
      if (!st) return { key: 'off', label: 'inconnu', detail: 'État non communiqué par le serveur.' };
      return st;
    },

    addrOf, pointSummary, kindOf, defaults, fieldApplies,
  };

  function indexStatus(list) {
    const o = {};
    for (const s of list || []) o[s.id] = s;
    return o;
  }

  /** Remet une configuration lue (fichier, serveur, stockage) en forme sûre. */
  function normalize(cfg) {
    const out = { version: 1, links: [] };
    if (!cfg || typeof cfg !== 'object') return out;
    for (const l of cfg.links || []) {
      const proto = DW.PROTO_INDEX.get(l.protocol);
      if (!proto || !ID_RE.test(String(l.id || ''))) continue;
      const link = {
        id: String(l.id),
        label: String(l.label || l.id).slice(0, 60),
        protocol: proto.id,
        enabled: l.enabled !== false,
        params: Object.assign(defaults(proto.linkFields), l.params || {}),
        points: [],
      };
      for (const p of l.points || []) {
        if (!ID_RE.test(String(p.id || ''))) continue;
        if (link.points.some((q) => q.id === p.id)) continue;
        const point = {
          id: String(p.id),
          label: String(p.label || p.id).slice(0, 60),
          unit: String(p.unit || '').slice(0, 12),
          periodMs: Math.max(10, Math.min(60000, parseInt(p.periodMs, 10) || 200)),
          params: Object.assign(defaults(proto.pointFields), p.params || {}),
        };
        point.kind = ['bit', 'word', 'float'].includes(p.kind) ? p.kind : kindOf(proto, point);
        link.points.push(point);
      }
      if (!out.links.some((x) => x.id === link.id)) out.links.push(link);
    }
    return out;
  }
  api.normalize = normalize;

  DW.protocols = api;
  DW.protocolsReady = api.load();
})();

</script>
<script>
/* Diagweb — source de données simulée.
 *
 * Implémente le contrat DataSource (voir docs/SPECS.md §7) : le back-end
 * réel (WebSocket vers le contrôleur) devra exposer la même interface.
 */
(function () {
  "use strict";
  const DW = window.DW;
  const CFG = DW.CONFIG;

  // --- PRNG déterministe par adresse (comportement stable entre rechargements)
  function hash32(s) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // --- Générateurs -----------------------------------------------------
  function makeGen(meta, addr) {
    const rnd = mulberry32(hash32(addr));
    const phase = rnd() * 1000;
    let sim = meta.sim;
    if (!sim) sim = defaultSim(meta.kind, rnd);

    switch (sim.type) {
      case 'sine': {
        const round = meta.kind === 'word';
        return (t) => {
          let v = sim.base + sim.amp * Math.sin((t + phase) * 2 * Math.PI / sim.period) +
                  (sim.noise || 0) * (rnd() - 0.5) * 2;
          if (round) v = Math.max(0, Math.min(65535, Math.round(v)));
          return v;
        };
      }
      case 'walk': {
        let v = sim.base;
        return () => {
          v += (rnd() - 0.5) * 2 * sim.step + (sim.drift || 0);
          if (v < sim.min) v = sim.min + (sim.min - v);
          if (v > sim.max) v = sim.max - (v - sim.max);
          v = Math.max(sim.min, Math.min(sim.max, v));
          return v;
        };
      }
      case 'steps': {
        let cur = sim.values[Math.floor(rnd() * sim.values.length)];
        let nextAt = null;   // initialisé au premier appel (le pré-remplissage part de t négatif)
        const round = meta.kind === 'word';
        return (t) => {
          if (nextAt === null) nextAt = t + sim.period * (0.5 + rnd());
          if (t >= nextAt) {
            cur = sim.values[Math.floor(rnd() * sim.values.length)];
            nextAt = t + sim.period * (0.5 + rnd());
          }
          let v = cur + (sim.noise || 0) * (rnd() - 0.5) * 2;
          return round ? Math.round(v) : v;
        };
      }
      case 'square':
        return (t) => (((t + phase) % sim.period) < sim.period * sim.duty ? 1 : 0);
      case 'bit': {
        // Chaîne de Markov : temps de séjour moyens t0 (état 0) et t1 (état 1)
        let v = rnd() < sim.t1 / (sim.t0 + sim.t1) ? 1 : 0;
        let flipAt = null;   // initialisé au premier appel (t peut être négatif)
        return (t) => {
          if (flipAt === null) flipAt = t + (v ? sim.t1 : sim.t0) * (0.3 + rnd() * 1.4);
          if (t >= flipAt) {
            v = v ? 0 : 1;
            flipAt = t + (v ? sim.t1 : sim.t0) * (0.3 + rnd() * 1.4);
          }
          return v;
        };
      }
      case 'counter': {
        return (t) => ((Math.round(sim.rate * t) % 65536) + 65536) % 65536;
      }
      case 'jitter': {
        return () => {
          let v = sim.base + (rnd() - 0.5) * 2 * sim.noise;
          if (rnd() < sim.spikeP) v += sim.spikeAmp * rnd();
          return v;
        };
      }
      default:
        return () => 0;
    }
  }

  function defaultSim(kind, rnd) {
    if (kind === 'bit') return { type: 'bit', t0: 4 + rnd() * 30, t1: 4 + rnd() * 30 };
    if (kind === 'word') {
      const base = Math.round(500 + rnd() * 40000);
      return { type: 'sine', base, amp: base * 0.06 + 20, period: 8 + rnd() * 60, noise: 25 };
    }
    const base = Math.round((rnd() * 200 - 40) * 10) / 10;
    return { type: 'sine', base, amp: 2 + rnd() * 25, period: 8 + rnd() * 50, noise: 0.4 };
  }

  // --- Registre des abonnements ---------------------------------------
  // addr -> { meta, gen, ts:[], vs:[], refs, periodS, nextT }
  const regs = new Map();
  // Valeurs forcées (diagnostic) : tant qu'une adresse y figure, la simulation
  // sert cette valeur au lieu du générateur (voir DW.source.write).
  const forced = new Map();
  const t0 = performance.now() / 1000;
  const now = () => performance.now() / 1000 - t0;

  function clampPeriodMs(p) {
    p = parseInt(p, 10);
    if (!isFinite(p) || p <= 0) p = CFG.defaultPeriodMs;
    return Math.min(10000, Math.max(CFG.defaultPeriodMs, p));
  }

  /**
   * @param opts {periodMs?} — période de rafraîchissement (défaut 10 ms).
   * Une souscription supplémentaire avec une période plus courte resserre
   * le flux existant (un seul flux par variable).
   */
  function subscribe(addr, opts) {
    const periodS = clampPeriodMs(opts && opts.periodMs) / 1000;
    let rec = regs.get(addr);
    if (rec) {
      rec.refs++;
      if (periodS < rec.periodS) rec.periodS = periodS;
      return rec;
    }
    const meta = DW.resolveMeta(addr);
    if (!meta) return null;
    rec = { meta, gen: makeGen(meta, addr), ts: [], vs: [], refs: 1, periodS, nextT: 0 };
    // Pré-remplissage de tout l'horizon (les t négatifs sont autorisés)
    // pour que les courbes soient pleines dès l'ajout d'une variable.
    const tNow = now();
    for (let t = tNow - CFG.horizonS; t <= tNow; t += periodS) {
      rec.ts.push(t); rec.vs.push(rec.gen(t));
    }
    rec.nextT = tNow + periodS;
    regs.set(addr, rec);
    return rec;
  }

  function unsubscribe(addr) {
    const rec = regs.get(addr);
    if (!rec) return;
    rec.refs--;
    if (rec.refs <= 0) regs.delete(addr);
  }

  function tick() {
    const t = now();
    const minT = t - CFG.horizonS;
    for (const [addr, rec] of regs) {
      // Rattrapage borné : si l'onglet a été suspendu, on saute en avant.
      if (t - rec.nextT > 2) rec.nextT = t;
      const held = forced.has(addr) ? forced.get(addr) : null;
      while (rec.nextT <= t) {
        rec.ts.push(rec.nextT);
        rec.vs.push(held != null ? held : rec.gen(rec.nextT));
        rec.nextT += rec.periodS;
      }
      // Purge de l'historique au-delà de l'horizon
      let cut = 0;
      while (cut < rec.ts.length && rec.ts[cut] < minT) cut++;
      if (cut > 400) { rec.ts.splice(0, cut); rec.vs.splice(0, cut); }
    }
  }
  setInterval(tick, CFG.defaultPeriodMs);

  DW.sources = DW.sources || {};
  DW.sources.sim = {
    name: 'Simulation locale',
    defaultPeriodMs: CFG.defaultPeriodMs,
    now,
    subscribe,
    unsubscribe,
    count: () => regs.size,
    latest(addr) {
      const rec = regs.get(addr);
      if (!rec || !rec.ts.length) return null;
      const i = rec.ts.length - 1;
      return { t: rec.ts[i], v: rec.vs[i] };
    },
    /** Valeur ~delta secondes en arrière (pour la tendance). */
    past(addr, delta) {
      const rec = regs.get(addr);
      if (!rec || !rec.ts.length) return null;
      const target = rec.ts[rec.ts.length - 1] - delta;
      for (let i = rec.ts.length - 1; i >= 0; i--) {
        if (rec.ts[i] <= target) return rec.vs[i];
      }
      return rec.vs[0];
    },
    data(addr) {
      const rec = regs.get(addr);
      return rec ? { ts: rec.ts, vs: rec.vs } : { ts: [], vs: [] };
    },
    meta(addr) {
      const rec = regs.get(addr);
      return rec ? rec.meta : DW.resolveMeta(addr);
    },

    /**
     * Force (ou relâche, si value == null) la valeur d'une variable.
     * Les points réseau (@lien.point) sont en lecture seule : refusés.
     * @returns {Promise<{ok, error?}>}
     */
    write(addr, value) {
      const p = DW.parseAddr(addr);
      if (!p.ok) return Promise.resolve({ ok: false, error: 'Adresse invalide : ' + addr });
      if (p.family === 'NET') {
        return Promise.resolve({ ok: false, error: 'Point réseau en lecture seule — forçage impossible.' });
      }
      if (value == null) forced.delete(p.addr);
      else forced.set(p.addr, p.kind === 'bit' ? (value >= 0.5 ? 1 : 0) : value);
      // Effet immédiat sur le dernier échantillon (retour visuel instantané)
      const rec = regs.get(p.addr);
      if (rec && value != null && rec.ts.length) rec.vs[rec.vs.length - 1] = forced.get(p.addr);
      return Promise.resolve({ ok: true });
    },
    /** Valeur forcée d'une variable, ou null si elle suit son générateur. */
    forced(addr) {
      const p = DW.parseAddr(addr);
      const key = p.ok ? p.addr : addr;
      return forced.has(key) ? forced.get(key) : null;
    },
  };

  // Source par défaut ; source.js peut lui substituer le flux du serveur
  // de diagnostic avant le démarrage de l'application.
  DW.source = DW.sources.sim;
})();

</script>
<script>
/* Diagweb — source de données WebSocket (serveur de diagnostic).
 *
 * Implémente le même contrat que la simulation (voir docs/SPECS.md §7) :
 * subscribe(addr, {periodMs}) / unsubscribe / latest / past / data / meta /
 * now / count. Le reste de l'application ignore laquelle des deux sources
 * est active.
 *
 * Protocole (trames texte JSON, voir server/src/main.cpp) :
 *   → {"c":"sub","addr":"MB414","periodMs":10} · {"c":"unsub","addr":…}
 *   ← {"e":"hello"|"meta"|"err"|"d", …}
 */
(function () {
  "use strict";
  const DW = (window.DW = window.DW || {});
  const CFG = DW.CONFIG;

  DW.sources = DW.sources || {};

  function createWsSource() {
    const chans = new Map();     // addr -> {meta, ts:[], vs:[], refs, periodMs}
    const forced = new Map();    // adresses forcées (diagnostic) → valeur
    const pendingWrites = new Map();   // adresse → résolveur en attente de confirmation
    let ws = null;
    let skew = 0, haveSkew = false;
    let horizonS = CFG.horizonS;
    let srcName = 'Serveur de diagnostic';
    let retry = 0, retryTimer = null, closed = false;

    const localSec = () => performance.now() / 1000;
    const now = () => localSec() + skew;

    function setStatus(msg, isErr) {
      if (typeof api.onStatus === 'function') api.onStatus(msg, isErr);
    }

    function send(obj) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(obj));
        return true;
      }
      return false;
    }

    function trim(ch) {
      const minT = now() - horizonS;
      let cut = 0;
      while (cut < ch.ts.length && ch.ts[cut] < minT) cut++;
      if (cut > 400) { ch.ts.splice(0, cut); ch.vs.splice(0, cut); }
    }

    let onHello = null;   // renseigné par connect() : la session n'est prête
                          // qu'une fois « hello » reçu (nom, horizon, horloge)

    function onMessage(ev) {
      let m;
      try { m = JSON.parse(ev.data); } catch (e) { return; }

      if (m.e === 'hello') {
        horizonS = m.horizonS || horizonS;
        srcName = m.source || srcName;
        api.name = srcName;
        api.defaultPeriodMs = m.defaultPeriodMs || CFG.defaultPeriodMs;
        // Redémarrage du serveur : son horloge (t depuis le démarrage) repart
        // près de zéro. Sans purge, la déduplication (t ≤ dernier t) rejetterait
        // tout échantillon neuf et les courbes gèleraient définitivement. Si
        // l'horloge a reculé, on vide l'historique avant de repartir.
        let maxT = -Infinity;
        for (const ch of chans.values()) if (ch.ts.length) maxT = Math.max(maxT, ch.ts[ch.ts.length - 1]);
        if (isFinite(maxT) && m.now < maxT - 1) {
          for (const ch of chans.values()) { ch.ts.length = 0; ch.vs.length = 0; }
          setStatus('Serveur redémarré — historique réinitialisé.');
        }
        skew = m.now - localSec();
        haveSkew = true;
        if (onHello) { const f = onHello; onHello = null; f(); }
        return;
      }
      if (m.e === 'meta') {
        const ch = chans.get(m.addr);
        if (ch) {
          // Les métadonnées du contrôleur font autorité sur celles déduites
          // localement : on complète l'objet en place (déjà référencé par l'UI).
          if (m.label) ch.meta.label = m.label;
          if (m.unit != null) ch.meta.unit = m.unit;
          if (m.kind) ch.meta.kind = m.kind;
          if (m.family) ch.meta.family = m.family;
          ch.meta.known = !!m.known;
        }
        return;
      }
      if (m.e === 'err') {
        setStatus(m.addr ? m.addr + ' : ' + m.msg : m.msg, true);
        return;
      }

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Diagweb — diagnostic en ligne des variables et signaux internes d'un contrôleur embarqué : mapping PLC, mots de bus, signaux modèles Simulink (C API).">
<title>Diagweb — Diagnostic contrôleur</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="tabbar">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#04201d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12h4l2-6 4 12 2-6h6"/>
        </svg>
      </span>
      <div id="tabs" class="tabs" role="tablist"></div>
      <button id="tabAdd" class="iconbtn" type="button" title="Nouvel onglet">＋</button>
    </div>

    <div class="topIcons">
      <span id="buildTag" class="build-tag" title="Diagweb — version : commit court · n° de commit dans la branche">dev</span>
      <button id="cfgToggle" class="iconbtn" type="button" title="Masquer / afficher la zone de configuration">⌃</button>
      <button id="menuBtn" class="iconbtn" type="button" title="Menu général" aria-haspopup="true">☰</button>
      <div id="menuPanel" class="menu-panel hide" role="menu">
        <button id="themeBtn" type="button">◐ Basculer le thème</button>
        <button id="aboutBtn" type="button">À propos de Diagweb…</button>
        <button type="button" disabled>Capture d’interfaces réseau (à venir)</button>
        <button type="button" disabled>Notes de version (à venir)</button>
      </div>
    </div>

    <div class="searchrow" id="cfgZone">
      <div class="searchbox">
        <input id="searchInput" type="text" inputmode="text" autocomplete="off" autocapitalize="off"
               autocorrect="off" spellcheck="false"
               placeholder="Variable : I1.2.3.4, MB414, Regulation.mesure.vitesse…"
               aria-label="Adresse de la variable à ajouter">
      </div>
      <select id="targetSel" aria-label="Destination de la variable"></select>
      <select id="periodSel" aria-label="Période de rafraîchissement" title="Période de rafraîchissement"></select>
      <button id="addBtn" class="btn primary" type="button">Ajouter</button>
      <div id="suggestBox" class="suggest hide"></div>
    </div>
  </header>

  <div class="tabActions">
    <button id="addChartBtn" class="btn" type="button" title="Ajouter un graphique dans cet onglet">+ Graphique</button>
    <button id="layoutsBtn" class="btn" type="button" title="Enregistrer / charger la configuration de cet onglet">Configs</button>
    <button id="logBtn" class="btn" type="button" title="Journalisation des données de cet onglet">Journal<i id="logInd" class="recdot hide"></i></button>
    <button id="pauseAllBtn" class="btn" type="button" title="Figer / reprendre les graphiques de cet onglet">⏸ Figer</button>
  </div>

  <section id="emptyState" class="empty hide">
    <h2>Aucune variable dans cet onglet</h2>
    <p>Saisissez une adresse dans la barre de recherche pour l'ajouter au tableau
       numérique ou à un graphique&nbsp;: <b>I1.2.3.4</b>, <b>Q14.15</b>, <b>M1.14</b>,
       <b>S0.4</b>, <b>MB414</b> ou un signal modèle comme <b>Regulation.mesure.vitesse</b>.</p>
    <div class="cta">
      <button id="demoBtn" class="btn primary" type="button">Charger la disposition de démonstration</button>
    </div>
  </section>

  <div id="panes"></div>
</div>

<footer class="statusbar">
  <span id="srcInfo"></span>
  <span id="statInfo"></span>
</footer>

<div id="toasts" aria-live="polite"></div>
<div id="modalRoot"></div>

<script src="js/config.js"></script>
<script src="js/parser.js"></script>
<script src="js/sim.js"></script>
<script src="js/source-ws.js"></script>
<script src="js/source.js"></script>
<script src="js/chart.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
